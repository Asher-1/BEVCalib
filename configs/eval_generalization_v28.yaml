# V28 Full 泛化评估: 架构对比 (Query-BEV/LSS x Swin/DINOv2), 32节点训练
# 模型参数由 evaluate_checkpoint.py 从 checkpoint 自动检测
#
# 用法:
#   python run_generalization_eval.py --config configs/eval_generalization_v28.yaml --parallel -1

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data/v28"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_v2"
output_dir: "logs/evaluations/generalization_eval_v28"

eval_params:
  angle_range: 5.0
  trans_range: 0.15
  batch_size: 16
  vis_interval: 200
  timeout: 14400
  eval_max_frames_per_seq: 800

models:
  - label: "v28-F1-query-swin"
    dir_name: "model_small_5deg_v28_F1_query_bev_swin"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    mode_desc: "F1: Query-BEV + Swin (best_val)"

  - label: "v28-F2-lss-dinov2"
    dir_name: "model_small_5deg_v28_F2_lss_dinov2"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    mode_desc: "F2: LSS + DINOv2 backbone"

  - label: "v28-F3-query-dinov2"
    dir_name: "model_small_5deg_v28_F3_query_dinov2"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    mode_desc: "F3: Query-BEV + DINOv2 (full architecture upgrade)"

  - label: "v28-F4-query-dinov2-dann"
    dir_name: "model_small_5deg_v28_F4_query_dinov2_dann"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    mode_desc: "F4: Query-BEV + DINOv2 + strong jitter + DANN"

  - label: "v28-F5-query-dinov2-frozen"
    dir_name: "model_small_5deg_v28_F5_query_dinov2_frozen"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    mode_desc: "F5: Query-BEV + frozen DINOv2 (backbone not fine-tuned)"

  - label: "v28-F1-query-swin-ckpt_400"
    dir_name: "model_small_5deg_v28_F1_query_bev_swin"
    ckpt: "ckpt_400.pth"
    bev_zbound_step: "4.0"
    mode_desc: "F1: Query-BEV + Swin (ckpt_400)"

  - label: "v28-F2-lss-dinov2-ckpt_400"
    dir_name: "model_small_5deg_v28_F2_lss_dinov2"
    ckpt: "ckpt_400.pth"
    bev_zbound_step: "4.0"
    mode_desc: "F2: LSS + DINOv2 backbone"

  - label: "v28-F3-query-dinov2-ckpt_400"
    dir_name: "model_small_5deg_v28_F3_query_dinov2"
    ckpt: "ckpt_400.pth"
    bev_zbound_step: "4.0"
    mode_desc: "F3: Query-BEV + DINOv2 (full architecture upgrade)"

  - label: "v28-F4-query-dinov2-dann-ckpt_400"
    dir_name: "model_small_5deg_v28_F4_query_dinov2_dann"
    ckpt: "ckpt_400.pth"
    bev_zbound_step: "4.0"
    mode_desc: "F4: Query-BEV + DINOv2 + strong jitter + DANN"

  - label: "v28-F5-query-dinov2-frozen-ckpt_400"
    dir_name: "model_small_5deg_v28_F5_query_dinov2_frozen"
    ckpt: "ckpt_400.pth"
    bev_zbound_step: "4.0"
    mode_desc: "F5: Query-BEV + frozen DINOv2 (backbone not fine-tuned)"
