bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_v2"
output_dir: "logs/evaluations/generalization_v64b_smoke_only"
eval_script: "evaluate_checkpoint.py"

bag_eval_dir: "/mnt/drtraining/user/dahailu/data/bevcalib/calibration_outputs/v64b_smoke_generalization"

eval_params:
  angle_range: 5.0
  trans_range: 0.0
  batch_size: 16
  vis_interval: 200
  timeout: 7200
  shortcut_diag: false
  generalization_diag: false
  exclude_seqs: "07"
  eval_max_frames_per_seq: 400

models:
  - label: "v64b-smoke-best-dual"
    dir_name: "model_small_5deg_v64b_clean_mount_pitch_smoke"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_medw.pth", "ckpt_best_val.pth", "ckpt_4.pth", "ckpt_2.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_dp_head: 0
    use_hard_route_eval: 0
    use_gated_instance_norm: 1
    gin_channels: 128
    mode_desc: "V64b smoke best-dual early signal"
    pitch_vertical_bands: 5

  - label: "v64b-smoke-best-medw"
    dir_name: "model_small_5deg_v64b_clean_mount_pitch_smoke"
    ckpt: "ckpt_best_medw.pth"
    ckpt_fallback: ["ckpt_best_dual.pth", "ckpt_best_val.pth", "ckpt_4.pth", "ckpt_2.pth"]
