    ckpt: "ckpt_best_val.pth"
    ckpt_fallback: ["ckpt_best_dual.pth", "ckpt_4.pth", "ckpt_2.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
