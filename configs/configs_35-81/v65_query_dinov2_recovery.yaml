# V65-query-dinov2-recovery
#
# Motivation:
#   - V29-G3 Query-BEV + DINOv2-small has very low temporal MEDW bias
#     under the current protocol (MEDW400 ~= 0.09 deg).
#   - Its fixed-inject diagnostic fails: 2 deg inject recovery is ~= 0%.
#   - V65 keeps the low-bias architecture but explicitly trains genuine
#     recovery, zero-drift stability, and local Jacobian response.
#
# Gate:
#   - Do not promote by MEDW alone.
#   - A deploy candidate must pass MEDW400 and fixed-inject recovery diag.

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    rotation_only: true

    cam2bev_mode: "query"
    backbone_type: "dinov2"
    backbone_variant: "dinov2-small"
    freeze_backbone: 1
    backbone_freeze_layers: "0:-2"
    backbone_lr_scale: 0.002
    drop_path_rate: 0.10
    head_dropout: 0.22

    batch_size: 8
    learning_rate: 8.0e-06
    wd: 0.01
    use_ddp: true
    ddp_gpus: 4
    nnodes: 1
    ddp_auto_scale: 0
    no_amp: 1

    enable_axis_loss: true
    weight_axis_rotation: 0.60
    axis_weights: "1.25,1.25,1.15"
    use_balanced_axis_loss: 1
    use_mlp_head: 0

    perturb_distribution: truncated_normal
    zero_perturbation_prob: 0.30
    multi_scale_perturb: "0.5:0.25,1.0:0.25,2.0:0.25,3.5:0.15,5.0:0.10"
    per_axis_prob: 0.35
    per_axis_weights: "0.34,0.33,0.33"
    symmetric_perturb: 1
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 2.0
    tinit_dropout_prob: 0.02
    overcorrection_penalty: 1.6

    # Query-BEV/DINOv2 has no MGDA bottleneck parameter group in the current
    # trainer, so use direct weighted-sum losses for this recovery rebaseline.
    use_mgda: 0
    mgda_start_epoch: 0
    mgda_include_inject: 1
    mgda_include_photo: 0

    jacobian_loss_weight: 0.025
    jacobian_loss_start_epoch: 0
    jacobian_loss_probe_deg: 2.0
    jacobian_loss_interval: 8

    zero_drift_loss_weight: 0.45
    zero_drift_loss_weight_start: 0.25
    zero_drift_loss_ramp_epochs: 6
    zero_drift_loss_start_epoch: 0
    zero_drift_dedicated_ratio: 0.25

    inject_recovery_loss_weight: 0.42
    inject_recovery_loss_start_epoch: 0
    inject_recovery_magnitude_deg: 2.0
    inject_recovery_dedicated_ratio: 0.28

    augment_mount_jitter_prob: 0.45
    augment_mount_jitter_rot_sigma: 2.0
    augment_mount_jitter_trans_sigma: 0.008
    augment_pitch_sign_flip_prob: 0.0
    augment_pitch_flip_prob: 0.04
    augment_pitch_flip_max_deg: 1.0
    augment_color_jitter: 0.12
    augment_pc_jitter: 0.015
    augment_pc_dropout: 0.03
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0

    pose_aware_sampling: true
    max_frames_per_seq: 300
    eval_epoches: 4
    save_ckpt_per_epoches: 4
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 2.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.55
    dual_gate_medw_max: 0.18
    enable_jacobian_gate_ckpt: 1
    jacobian_early_stop_min: 0.35
    jacobian_early_stop_patience: 4

    seed: 42
    grad_accum_steps: 1
    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"
    fuser_type: "diff"
    no_tensorboard: true

experiments:
  - name: "v65_query_dinov2_recovery_smoke"
    description: "V65 smoke: V29-G3 architecture + fixed-inject recovery supervision"
    dataset: "all"
    version: "v65_query_dinov2_recovery_smoke"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 20
      warmup_epochs: 2
      lr_schedule: cosine_warm_restarts
      cosine_T0: 20
      cosine_Tmult: 1
      early_stopping_patience: 999
      max_frames_per_seq: 200
      eval_epoches: 4
      save_ckpt_per_epoches: 4
      pretrain_ckpt: "logs/all_training_data/v29_quick/model_small_5deg_v29_G3_partial_unfreeze_dinov2_quick/all_training_data_scratch/checkpoint/ckpt_best_val.pth"

  - name: "v65_query_dinov2_recovery_full"
    description: "V65 full: recovery rebaseline from V29-G3, target MEDW + fixed-inject recovery"
    dataset: "all"
    version: "v65_query_dinov2_recovery"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      batch_size: 12
      ddp_gpus: 8
      learning_rate: 6.0e-06
      backbone_lr_scale: 0.001
      num_epochs: 90
      warmup_epochs: 4
      lr_schedule: cosine_warm_restarts
      cosine_T0: 45
      cosine_Tmult: 1
      early_stopping_patience: 24
      max_frames_per_seq: 500
      eval_epoches: 5
      save_ckpt_per_epoches: 5
      inject_recovery_dedicated_ratio: 0.32
      zero_drift_dedicated_ratio: 0.28
      jacobian_loss_weight: 0.03
      jacobian_loss_interval: 8
      augment_mount_jitter_prob: 0.55
      augment_mount_jitter_rot_sigma: 2.4
      pretrain_ckpt: "logs/all_training_data/v29_quick/model_small_5deg_v29_G3_partial_unfreeze_dinov2_quick/all_training_data_scratch/checkpoint/ckpt_best_val.pth"
