# V80-tinit-bev-film-rpy02
#
# Strict target:
#   Deployment R/P/Y generalization error must satisfy all axes < 0.2 deg.
#
# Diagnosis from V78/V79:
#   - V78 DINOv2-query prior is strong for random sequence-level RPY02
#     (random full aggregate R/P/Y=0.1080/0.0733/0.0360 deg), but it has
#     almost no fixed 2/2/2 recovery path.
#   - V79 final-head explicit T_init adapter did not preserve RPY02 and did
#     not form a reliable Jacobian. The T_init signal arrives too late.
#
# Design:
#   - Start from V78 ckpt_best_medw.pth, not V79.
#   - Add a zero-initialized T_init-conditioned FiLM adapter on the fused BEV
#     feature map before transformer/pooling.
#   - Freeze the V78 visual/BEV prior; train only the new BEV adapter and the
#     linear rotation head.
#   - Promotion requires random R/P/Y < 0.2 deg and fixed 2/2/2 recovery
#     returning toward the 72% floor.

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    CUDA_VISIBLE_DEVICES: "0,1,2,5"
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    rotation_only: true

    cam2bev_mode: "query"
    backbone_type: "dinov2"
    backbone_variant: "dinov2-small"
    freeze_backbone: 1
    backbone_freeze_layers: "0:-2"
    backbone_lr_scale: 0.0
    bev_branch_lr_scale: 0.0
    use_mlp_head: 0
    explicit_tinit: 0
    tinit_bev_film: 1
    trainable_prefixes: "tinit_bev_encoder,tinit_bev_film,rotation_pred"
    drop_path_rate: 0.04
    head_dropout: 0.05

    batch_size: 8
    learning_rate: 9.0e-06
    wd: 0.006
    use_ddp: true
    ddp_gpus: 4
    nnodes: 1
    master_port: 29680
    ddp_auto_scale: 0
    no_amp: 1

    enable_axis_loss: true
    weight_axis_rotation: 0.64
    axis_weights: "1.18,1.35,1.08"
    use_balanced_axis_loss: 1

    perturb_distribution: truncated_normal
    zero_perturbation_prob: 0.30
    multi_scale_perturb: "0.25:0.11,0.5:0.18,1.0:0.24,2.0:0.34,3.5:0.09,5.0:0.04"
    per_axis_prob: 0.50
    per_axis_weights: "0.34,0.36,0.30"
    symmetric_perturb: 1
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 2.2
    tinit_dropout_prob: 0.0
    overcorrection_penalty: 0.95

    use_mgda: 0
    mgda_start_epoch: 0
    mgda_include_inject: 1
    mgda_include_photo: 0

    jacobian_loss_weight: 0.050
    jacobian_loss_start_epoch: 0
    jacobian_loss_probe_deg: 2.0
    jacobian_loss_interval: 4
    jacobian_loss_axis_weights: "1.15,1.35,1.08"

    zero_drift_loss_weight: 0.62
    zero_drift_loss_weight_start: 0.42
    zero_drift_loss_ramp_epochs: 4
    zero_drift_loss_start_epoch: 0
    zero_drift_dedicated_ratio: 0.34

    inject_recovery_loss_weight: 0.52
    inject_recovery_loss_start_epoch: 0
    inject_recovery_magnitude_deg: 2.0
    inject_recovery_dedicated_ratio: 0.30

    augment_mount_jitter_prob: 0.05
    augment_mount_jitter_rot_sigma: 0.24
    augment_mount_jitter_trans_sigma: 0.003
    augment_pitch_sign_flip_prob: 0.0
    augment_pitch_flip_prob: 0.008
    augment_pitch_flip_max_deg: 0.22
    augment_color_jitter: 0.03
    augment_pc_jitter: 0.005
    augment_pc_dropout: 0.010
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0

    pose_aware_sampling: true
    max_frames_per_seq: 300
    eval_epoches: 2
    save_ckpt_per_epoches: 2
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 2.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.16
    dual_gate_medw_max: 0.18
    enable_jacobian_gate_ckpt: 1
    jacobian_early_stop_min: 0.05
    jacobian_early_stop_patience: 5
    medw_eval_max_frames: 200

    seed: 800
    grad_accum_steps: 1
    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"
    fuser_type: "diff"
    no_tensorboard: true

experiments:
  - name: "v80_tinit_bev_film_rpy02_smoke"
    description: "V80 smoke: pre-pooling T_init FiLM adapter from V78 random-RPY02 prior"
    dataset: "all"
    version: "v80_tinit_bev_film_rpy02_smoke"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      batch_size: 8
      ddp_gpus: 4
      num_epochs: 12
      warmup_epochs: 1
      lr_schedule: cosine_warm_restarts
      cosine_T0: 12
      cosine_Tmult: 1
      early_stopping_patience: 999
      max_frames_per_seq: 220
      eval_epoches: 2
      save_ckpt_per_epoches: 2
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v78_dinov2_query_rpy02_recovery_guard_smoke/all_training_data_scratch/checkpoint/ckpt_best_medw.pth"

  - name: "v80_tinit_bev_film_rpy02_full"
    description: "V80 full: launch only after smoke external eval clears random RPY02 and fixed recovery trend"
    dataset: "all"
    version: "v80_tinit_bev_film_rpy02"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      batch_size: 8
      ddp_gpus: 4
      learning_rate: 7.0e-06
      num_epochs: 34
      warmup_epochs: 2
      lr_schedule: cosine_warm_restarts
      cosine_T0: 17
      cosine_Tmult: 1
      early_stopping_patience: 8
      max_frames_per_seq: 500
      eval_epoches: 2
      save_ckpt_per_epoches: 2
      inject_recovery_loss_weight: 0.44
      inject_recovery_dedicated_ratio: 0.26
      jacobian_loss_weight: 0.040
      zero_drift_loss_weight: 0.66
      zero_drift_dedicated_ratio: 0.36
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v80_tinit_bev_film_rpy02_smoke/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
