# V50b / V50c: 对照实验 (远端机器训练)
#
# v50b: Optuna T32 + cf_n_groups=256 + 无consistency (融合 v45c 空间分辨率)
# v50c: Optuna T32 + 条件一致性 consistency=0.6 (对照 v50a)
#
# 前置依赖 (需同步到远端机器的 logs/ 目录):
#   - v45c best_val: logs/all_training_data/model_small_5deg_v45c_cf_bev_r_S1_quick/.../ckpt_best_val.pth
#   - T32 best_val:  logs/all_training_data/model_small_5deg_v49_optuna_best_t32_S1_full/.../ckpt_best_val.pth
#
# Usage:
#   bash batch_train.sh configs/v50_bc_cf_bev_r.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    use_pitch_fusion: 1
    pitch_vertical_bands: 5
    corr_window_mode: adaptive

    use_dla: 1
    use_instance_norm: 0
    use_gated_instance_norm: 0
    gin_channels: 0
    gin_gate_reg_weight: 0.0

    backbone_type: swin
    backbone_lr_scale: 0.1
    head_dropout: 0.05
    batch_size: 16
    learning_rate: 4.006191761686402e-05
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.5,5.5,1.5"
    use_geodesic_loss: 0
    corr_alignment_weight: 0.2
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.3
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.1

    tinit_dropout_prob: 0.5
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 15.0
    zero_perturbation_prob: 0.15
    symmetric_perturb: 1
    overcorrection_penalty: 1.5
    use_magnitude_head: 1
    magnitude_loss_weight: 0.3
    multi_scale_perturb: "0.5:0.20,1.0:0.05,2.0:0.05"

    augment_mount_jitter_prob: 0.4
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.015
    augment_intrinsic: 0.03
    augment_intrinsic_cxcy: 0.015
    augment_color_jitter: 0.3

    xyz_only: 1
    max_pcd_points: 16384
    perturb_distribution: magnitude_balanced
    per_axis_prob: 0.4
    pose_aware_sampling: true
    max_frames_per_seq: 500
    foreground: true
    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_pitch_flip_prob: 0.0

    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.1
    save_ckpt_per_epoches: 10

    seed: 42
    resume_ckpt: auto

experiments:
  # ===== v50b: T32 超参 + cf_n_groups=256 + 无consistency =====
  # 融合 v45c 空间分辨率优势 (256 FPS groups)
  - name: "v50b_optuna_256g_no_cons_S1_full"
    description: "V50b: Optuna T32 + cf_n_groups=256 + 无consistency (v45c融合)"
    dataset: "all"
    version: "v50b_optuna_256g_no_cons_S1_full"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 150
      warmup_epochs: 6
      lr_schedule: cosine_warm_restarts
      cosine_T0: 40
      cosine_Tmult: 2
      early_stopping_patience: 50
      eval_epoches: 10
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v45c_cf_bev_r_S1_quick/all_training_data_scratch/checkpoint/ckpt_best_val.pth"
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 999
      cf_n_groups: 256
      consistency_loss_weight: 0.0
      consistency_loss_start_epoch: 999
      conditional_consistency_threshold: 0.0
      quat_bias_reset_alpha: 0.1
      decoder_pool_mode: mean

  # ===== v50c: T32 超参 + 条件一致性 (折中方案) =====
  # 保留 Optuna 找到的 consistency=0.6 + threshold=3.0, 对比 v50a
  - name: "v50c_optuna_cond_cons_S1_full"
    description: "V50c: Optuna T32 原始 consistency 策略 (对照组)"
    dataset: "all"
    version: "v50c_optuna_cond_cons_S1_full"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 150
      warmup_epochs: 6
      lr_schedule: cosine_warm_restarts
      cosine_T0: 40
      cosine_Tmult: 2
      early_stopping_patience: 50
      eval_epoches: 10
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v49_optuna_best_t32_S1_full/all_training_data_scratch/checkpoint/ckpt_best_val.pth"
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 999
      consistency_loss_weight: 0.6
      consistency_loss_start_epoch: 5
      conditional_consistency_threshold: 3.0
      quat_bias_reset_alpha: 0.1
      decoder_pool_mode: mean
