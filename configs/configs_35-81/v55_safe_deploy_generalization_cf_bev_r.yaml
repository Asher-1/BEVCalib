# V55-safe: 保守备线参数
#
# 核心思想:
#   1. 回到更稳的 Partial GIN + MGDA 主线
#   2. 关闭 DP-Head / hard-route，减少路由塌缩和结构耦合
#   3. 保留中等强度域泛化增强，优先保住 MEDW / ZD 底盘
#
# 使用场景:
#   - v55 首跑 smoke 出现 NaN / router collapse
#   - 希望先快速拿到一条稳定可训练的对照线
#
# Usage:
#   bash batch_train.sh configs/v55_safe_deploy_generalization_cf_bev_r.yaml --skip-pattern refine
#   bash batch_train.sh configs/v55_safe_deploy_generalization_cf_bev_r.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    use_pitch_fusion: 1
    pitch_vertical_bands: 5
    corr_window_mode: adaptive

    use_dla: 1
    use_instance_norm: 0
    use_gated_instance_norm: 1
    gin_channels: 128
    gin_init_gate: 0.35
    gin_gate_reg_weight: 0.01
    gin_gate_reg_target: 0.35

    use_dp_head: 0
    use_hard_route_eval: 0
    dp_gate_deg: 1.5
    route_loss_weight: 0.0
    route_zd_penalty_weight: 0.0
    use_jacg: 1
    jacg_hidden_dim: 64
    bias_path_in_norm: 1
    recovery_path_layer_norm: 1

    backbone_type: swin
    backbone_lr_scale: 0.08
    head_dropout: 0.05
    batch_size: 16
    learning_rate: 1.0e-05
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    no_amp: 1

    enable_axis_loss: true
    weight_axis_rotation: 0.50
    axis_weights: "1.5,5.5,1.8"
    corr_alignment_weight: 0.30
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.30
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.08
    seq_consistency_start_epoch: 10

    tinit_dropout_prob: 0.20
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 7.0
    zero_perturbation_prob: 0.35
    multi_scale_perturb: "0.5:0.25,1.0:0.25,2.0:0.20,3.5:0.10"
    per_axis_prob: 0.30
    per_axis_weights: "0.30,0.25,0.45"
    symmetric_perturb: 1
    overcorrection_penalty: 2.0
    use_magnitude_head: 1
    magnitude_loss_weight: 0.25

    use_mgda: 1
    mgda_start_epoch: 0
    mgda_include_inject: 1
    mgda_include_photo: 0

    jacobian_loss_weight: 0.10
    jacobian_loss_start_epoch: 0
    jacobian_loss_probe_deg: 2.0
    jacobian_loss_interval: 4

    zero_drift_loss_weight: 0.42
    zero_drift_loss_weight_start: 0.25
    zero_drift_loss_ramp_epochs: 8
    zero_drift_loss_start_epoch: 0
    zero_drift_dedicated_ratio: 0.35

    inject_recovery_loss_weight: 0.50
    inject_recovery_loss_start_epoch: 0
    inject_recovery_magnitude_deg: 2.0
    inject_recovery_dedicated_ratio: 0.14

    use_lsp_loss: 0
    rig_consistency_weight: 0.0
    pose_release_epoch: 0
    freeze_backbone_epoch: 999

    progressive_angle_start: 1.5
    progressive_angle_end: 5.0
    progressive_warmup_epochs: 25

    augment_mount_jitter_prob: 0.35
    augment_mount_jitter_rot_sigma: 1.2
    augment_mount_jitter_trans_sigma: 0.012
    augment_intrinsic: 0.025
    augment_color_jitter: 0.20
    augment_fov_crop_prob: 0.15
    augment_fov_crop_ratio_min: 0.82
    augment_fov_crop_ratio_max: 0.94
    augment_lidar_sparse_prob: 0.10
    augment_lidar_sparse_lines: "32,64"
    augment_lidar_vertical_fov: "-25,15"
    max_pcd_points: 16384
    pose_aware_sampling: true
    max_frames_per_seq: 400

    enable_medw_eval: 1
    enable_jacobian_eval: 1
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.84
    dual_gate_medw_max: 0.18
    enable_jacobian_gate_ckpt: 1
    jacobian_early_stop_min: 0.82
    jacobian_early_stop_patience: 3
    eval_epoches: 5
    save_ckpt_per_epoches: 5
    seed: 42
    no_tensorboard: true

experiments:
  - name: "v55_safe_smoke"
    description: "V55-safe smoke: Partial GIN + MGDA + mild domain augment, 15ep"
    dataset: "all"
    version: "v55_safe_smoke"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 15
      warmup_epochs: 2
      lr_schedule: cosine_warm_restarts
      cosine_T0: 15
      cosine_Tmult: 1
      early_stopping_patience: 999
      eval_epoches: 5
      pretrain_ckpt: "logs/all_training_data/v53/model_small_5deg_v53f_gin_jacg/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
      dual_gate_medw_max: 0.25

  - name: "v55_safe_full"
    description: "V55-safe full: 保守备线，优先稳住 MEDW/ZD 底盘"
    dataset: "all"
    version: "v55_safe_deploy_generalization"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 60
      warmup_epochs: 5
      lr_schedule: cosine_warm_restarts
      cosine_T0: 30
      cosine_Tmult: 2
      early_stopping_patience: 25
      eval_epoches: 5
      pretrain_ckpt: "logs/all_training_data/v53/model_small_5deg_v53f_gin_jacg/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
      dual_gate_medw_max: 0.18

  - name: "v55_safe_refine"
    description: "V55-safe refine: 冻结 backbone 继续压 MEDW/ZD"
    dataset: "all"
    version: "v55_safe_refine"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      learning_rate: 8.0e-06
      num_epochs: 20
      warmup_epochs: 2
      lr_schedule: cosine_warm_restarts
      cosine_T0: 20
      cosine_Tmult: 1
      freeze_backbone_epoch: 0
      early_stopping_patience: 20
      eval_epoches: 5
      zero_perturbation_prob: 0.42
      zero_drift_dedicated_ratio: 0.40
      zero_drift_loss_weight: 0.50
      inject_recovery_dedicated_ratio: 0.16
      inject_recovery_loss_weight: 0.55
      continuous_noise_max_deg: 5.5
      progressive_angle_start: 2.0
      progressive_angle_end: 5.0
      progressive_warmup_epochs: 5
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v55_safe_deploy_generalization/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
      dual_gate_medw_max: 0.17
