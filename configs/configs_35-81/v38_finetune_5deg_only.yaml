# V38b Stage-2: ±5° fine-tune from v38 Arm1 (±10° main) ckpt_best_val
#
# 启动（Arm1→Arm4 已合并进 v38_native_cross_fleet_pointgpt.yaml；本文件仅用于单独重跑 Stage-2）:
#   bash batch_train.sh configs/v38_finetune_5deg_only.yaml --force
#   bash tools/run_v38_finetune_5deg.sh
#
# 注意: 需 Arm1 完成并产生 ckpt_best_val.pth；PointGPT 仍用 fleet_pointgpt_L20.pth
#
# 多机 DDP: 同 v38_native_cross_fleet_pointgpt.yaml，设置 nnodes/node_rank/master_addr

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    PROJFUSION_ROOT: /mnt/drtraining/user/dahailu/code/ProjFusion

  params:
    angle_range_deg: 5
    trans_range: 0.15
    batch_size: 64
    learning_rate: 5e-5
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false
    no_amp: 1
    rotation_only: true
    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.0,1.0,1.0"
    use_balanced_axis_loss: 1
    use_mlp_head: 0
    use_geodesic_loss: 0
    drop_path_rate: 0.15
    head_dropout: 0.15
    lr_schedule: cosine_warm_restarts
    cosine_T0: 25
    cosine_Tmult: 2
    warmup_epochs: 5
    backbone_lr_scale: 0.0
    backbone_warmup_epochs: 0
    layer_wise_lr_decay: 1.0
    use_pitch_branch: 0
    pitch_aux_weight: 0.0
    bev_instance_norm: 0
    use_contrastive_extrinsic: 0
    contrastive_weight: 0.0
    augment_mount_jitter_prob: 0.5
    augment_mount_jitter_rot_sigma: 3.0
    augment_mount_jitter_trans_sigma: 0.01
    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    augment_pitch_sign_flip_prob: 0.15
    augment_pitch_flip_prob: 0.20
    augment_pitch_flip_max_deg: 3.0
    augment_color_jitter: 0.15
    augment_pc_jitter: 0.02
    augment_pc_dropout: 0.05
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0
    pose_aware_sampling: true
    max_frames_per_seq: 5000
    num_epochs: 100
    save_ckpt_per_epoches: 25
    early_stopping_patience: 0
    eval_epoches: 10
    seed: 42
    grad_accum_steps: 1
    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"
    fuser_type: "diff"
    cam_drop_prob: 0.0
    cam_drop_mode: "zero"
    foreground: true
    domain_adversarial: 0
    domain_adversarial_weight: 0.0
    num_domains: 0

experiments:
  - name: "v38_native_cross_fleet_pointgpt_L20_finetune_5deg"
    description: "V38b: fleet L20, ±5deg fine-tune from Arm1 ckpt_best_val, LR=5e-5, 100ep"
    dataset: "all"
    version: "v38_native_cross_fleet_pointgpt_L20_finetune_5deg"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_freeze_layers: "0:-2"
      native_cross: 1
      native_cross_pc_groups: 256
      native_cross_n_harmonic: 6
      native_cross_n_layers: 1
      native_cross_dual_branch: 1
      native_cross_use_pointgpt: 1
      native_cross_pointgpt_ckpt: /mnt/drtraining/user/dahailu/code/ProjFusion/pretrained/fleet_pointgpt_L20.pth
      native_cross_pointgpt_config: /mnt/drtraining/user/dahailu/code/ProjFusion/cfg/pointgpt/finetune_fleet_L20.yaml
      native_cross_pointgpt_max_depth: 60.0
      native_cross_extend_ratio: 2.5
      explicit_tinit: 0
      pretrain_ckpt: /mnt/drtraining/user/dahailu/code/BEVCalib/logs/all_training_data/model_small_10deg_v38_native_cross_fleet_pointgpt_L20/all_training_data_scratch/checkpoint/ckpt_best_val.pth
      resume_ckpt: null
      angle_range_deg: 5
      trans_range: 0.15
      learning_rate: 5e-5
      warmup_epochs: 5
      cosine_T0: 25
      batch_size: 64
      max_frames_per_seq: 5000
      num_epochs: 100
      save_ckpt_per_epoches: 25
      eval_epoches: 10
      fuser_type: "diff"
