# V46 CF-BEV-R Quick: GIN + Anti-Shortcut Training Strategy
#
# Based on V45 GIN (best architecture), with targeted improvements:
#   1. magnitude_balanced perturbation distribution (uniform |angle| ∈ [0, max])
#   2. Overcorrection penalty (λ=2.0) to punish prediction > initial error
#   3. Higher zero_perturbation_prob (0.25) for zero-drift robustness
#   4. Magnitude estimation head for explicit perturbation sensing
#   5. Symmetric perturbation + higher per_axis_prob for shortcut resistance
#
# Rationale: addresses zero-drift vs genuine-recovery tradeoff by teaching
# the model magnitude awareness at both data-level and architecture-level.
#
# Quick version: single-node 8-GPU for fast iteration
#
# Usage:
#   bash batch_train.sh configs/v46_cf_bev_r_quick.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1

    use_dla: 1
    use_pitch_fusion: 1
    use_instance_norm: 0
    use_gated_instance_norm: 1
    gin_init_gate: 0.5

    backbone_type: swin
    backbone_lr_scale: 0.1
    head_dropout: 0.15

    batch_size: 16
    learning_rate: 1e-4
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.5,4.0,1.5"
    use_geodesic_loss: 0
    corr_alignment_weight: 0.2
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.4
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.1

    tinit_dropout_prob: 0.3
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 15.0
    consistency_loss_weight: 0.5
    consistency_loss_start_epoch: 10
    zero_perturbation_prob: 0.25
    symmetric_perturb: 1
    overcorrection_penalty: 2.0
    use_magnitude_head: 1
    magnitude_loss_weight: 0.3

    augment_mount_jitter_prob: 0.4
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.015
    augment_intrinsic: 0.03
    augment_intrinsic_cxcy: 0.015
    augment_color_jitter: 0.3

    xyz_only: 1
    max_pcd_points: 16384
    perturb_distribution: magnitude_balanced
    per_axis_prob: 0.3
    pose_aware_sampling: true
    max_frames_per_seq: 500
    foreground: true
    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_pitch_flip_prob: 0.0

    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.10
    save_ckpt_per_epoches: 10

    seed: 42
    pretrain_ckpt: null
    resume_ckpt: auto

experiments:
  # ===== S1: ±5° from V45 GIN S1 Full best_dual =====
  - name: "v46_cf_bev_r_S1_quick"
    description: "V46 S1: ±5° GIN + mag_balanced + overcorr_penalty + mag_head"
    dataset: "all"
    version: "v46_cf_bev_r_S1_quick"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 200
      warmup_epochs: 10
      lr_schedule: cosine_warm_restarts
      cosine_T0: 40
      cosine_Tmult: 2
      early_stopping_patience: 50
      eval_epoches: 10
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v45_gin_cf_bev_r_S1_full/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
      resume_ckpt: auto
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 999
      zero_perturbation_prob: 0.25
      per_axis_prob: 0.4
      symmetric_perturb: 1

  # ===== S2: ±3° with experience replay to prevent generalization collapse =====
  - name: "v46_cf_bev_r_S2_quick"
    description: "V46 S2: ±3° + mag_balanced + replay 35% + overcorr_penalty"
    dataset: "all"
    version: "v46_cf_bev_r_S2_quick"
    params:
      angle_range_deg: 3
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 120
      warmup_epochs: 5
      learning_rate: 5e-5
      lr_schedule: cosine_warm_restarts
      cosine_T0: 30
      cosine_Tmult: 2
      early_stopping_patience: 35
      eval_epoches: 10
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v46_cf_bev_r_S1_quick/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
      resume_ckpt: auto
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 0
      per_axis_prob: 0.5
      continuous_noise_max_deg: 8.0
      zero_perturbation_prob: 0.25
      symmetric_perturb: 1
      multi_range_prob: 0.35
      multi_range_angle: 5.0

  # ===== S3: ±2° (wider than V45's ±1°) to prevent generalization collapse =====
  # GIN S3 Full (±1°) showed severe generalization degradation (GS=0.63 vs S1's 0.32)
  # Root cause: ±1° range too narrow → model forgets large-angle correction
  # Fix: use ±2° with continuous_noise_max_deg=5.0 for generalization retention
  - name: "v46_cf_bev_r_S3_quick"
    description: "V46 S3: ±2° + mag_balanced + replay 25% + overcorr_penalty"
    dataset: "all"
    version: "v46_cf_bev_r_S3_quick"
    params:
      angle_range_deg: 2
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 100
      warmup_epochs: 5
      learning_rate: 1e-5
      lr_schedule: cosine_warm_restarts
      cosine_T0: 25
      cosine_Tmult: 2
      early_stopping_patience: 35
      eval_epoches: 10
      pretrain_ckpt: "logs/all_training_data/model_small_3deg_v46_cf_bev_r_S2_quick/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
      resume_ckpt: auto
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 0
      per_axis_prob: 0.6
      continuous_noise_max_deg: 5.0
      zero_perturbation_prob: 0.30
      axis_weights: "2.0,4.0,2.0"
      symmetric_perturb: 1
      multi_range_prob: 0.25
      multi_range_angle: 5.0
