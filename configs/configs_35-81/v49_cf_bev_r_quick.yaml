# V49: 基于根因分析的改进方案
# 针对六大根因: (1)Consistency-Recovery冲突 (2)旋转头bias固化 (3)GIN不分化
#              (4)T_init信息压缩 (5)非对称axis loss (6)训练-泛化指标不一致
#
# E1: v49a — 条件一致性 + Attention Pool + Bias重置 (全部改进)
# E2: v49b — 仅关闭consistency loss (消融: 验证根因#1)
# E3: v49c — 条件一致性 + Mean Pool (消融: 验证C4 attention pool的效果)
#
# pretrain: 使用 v48a best_val (当前最优) 而非 v45c
#
# Usage:
#   bash batch_train.sh configs/v49_cf_bev_r_quick.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 256
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    use_pitch_fusion: 1
    pitch_vertical_bands: 3
    corr_window_mode: adaptive

    # V49: 不使用GIN (根因#3: gate不分化, v48a已证明无GIN最优)
    use_dla: 1
    use_instance_norm: 0
    use_gated_instance_norm: 0
    gin_channels: 0
    gin_gate_reg_weight: 0.0

    backbone_type: swin
    backbone_lr_scale: 0.1
    head_dropout: 0.15

    batch_size: 12
    learning_rate: 1e-4
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    # V49 C5: 平衡axis weights (根因#5: 减少Pitch主导bias)
    axis_weights: "2.0,3.0,2.0"
    use_geodesic_loss: 0
    corr_alignment_weight: 0.2
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.4
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.1

    tinit_dropout_prob: 0.3
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 15.0
    zero_perturbation_prob: 0.20
    symmetric_perturb: 1
    overcorrection_penalty: 2.5
    use_magnitude_head: 1
    magnitude_loss_weight: 0.3

    multi_scale_perturb: "0.5:0.10,1.0:0.10,2.0:0.10"

    augment_mount_jitter_prob: 0.4
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.015
    augment_intrinsic: 0.03
    augment_intrinsic_cxcy: 0.015
    augment_color_jitter: 0.3

    xyz_only: 1
    max_pcd_points: 16384
    perturb_distribution: magnitude_balanced
    per_axis_prob: 0.4
    pose_aware_sampling: true
    max_frames_per_seq: 500
    foreground: true
    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_pitch_flip_prob: 0.0

    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.10
    save_ckpt_per_epoches: 10

    seed: 42
    resume_ckpt: auto

experiments:
  # ===== E1: v49a — 全部改进 =====
  # C1: 条件一致性(threshold=1.5deg)  C3: bias重置(alpha=0.3)
  # C4: Attention Pool  C5: 平衡axis weights  无GIN
  - name: "v49a_full_S1_quick"
    description: "V49a: 条件一致性 + AttPool + Bias重置 + 平衡axis (全部改进)"
    dataset: "all"
    version: "v49a_full_S1_quick"
    skip: true
    skip_reason: "已完成150 epoch训练 (2026-06-08)"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 150
      warmup_epochs: 8
      lr_schedule: cosine_warm_restarts
      cosine_T0: 40
      cosine_Tmult: 2
      early_stopping_patience: 50
      eval_epoches: 10
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v48a_ms_only_S1_quick/all_training_data_scratch/checkpoint/ckpt_best_val.pth"
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 999
      # V49 C1: 条件一致性损失
      consistency_loss_weight: 0.3
      consistency_loss_start_epoch: 10
      conditional_consistency_threshold: 1.5
      # V49 C3: 旋转头bias周期重置
      quat_bias_reset_alpha: 0.3
      # V49 C4: Attention Pool
      decoder_pool_mode: attention

  # ===== E2: v49b — 消融: 完全关闭consistency loss =====
  # 验证根因#1: consistency是否是Recovery的头号杀手
  - name: "v49b_no_cons_S1_quick"
    description: "V49b: 关闭consistency loss (消融实验)"
    dataset: "all"
    version: "v49b_no_cons_S1_quick"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 150
      warmup_epochs: 8
      lr_schedule: cosine_warm_restarts
      cosine_T0: 40
      cosine_Tmult: 2
      early_stopping_patience: 50
      eval_epoches: 10
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v48a_ms_only_S1_quick/all_training_data_scratch/checkpoint/ckpt_best_val.pth"
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 999
      # 完全关闭consistency
      consistency_loss_weight: 0.0
      consistency_loss_start_epoch: 999
      conditional_consistency_threshold: 0.0
      # 无bias重置, 无attention pool (纯消融)
      quat_bias_reset_alpha: 0.0
      decoder_pool_mode: mean

  # ===== E3: v49c — 消融: 条件一致性 + Mean Pool =====
  # 验证C4 Attention Pool的独立贡献
  - name: "v49c_cond_cons_S1_quick"
    description: "V49c: 条件一致性 + Mean Pool (消融: 验证AttPool效果)"
    dataset: "all"
    version: "v49c_cond_cons_S1_quick"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 150
      warmup_epochs: 8
      lr_schedule: cosine_warm_restarts
      cosine_T0: 40
      cosine_Tmult: 2
      early_stopping_patience: 50
      eval_epoches: 10
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v48a_ms_only_S1_quick/all_training_data_scratch/checkpoint/ckpt_best_val.pth"
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 999
      # C1: 条件一致性
      consistency_loss_weight: 0.3
      consistency_loss_start_epoch: 10
      conditional_consistency_threshold: 1.5
      # C3: bias重置
      quat_bias_reset_alpha: 0.3
      # 保持Mean Pool (消融对比)
      decoder_pool_mode: mean
