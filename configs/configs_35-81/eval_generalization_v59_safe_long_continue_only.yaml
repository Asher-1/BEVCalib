bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_v2"
output_dir: "logs/evaluations/generalization_v59_safe_long_continue_only"
eval_script: "evaluate_checkpoint.py"

bag_eval_dir: "/mnt/drtraining/user/dahailu/data/bevcalib/calibration_outputs/v59_safe_long_continue_generalization"

deploy_policy:
  gate_deg: 1.5
  medw_n_frames: 400
  ckpt_medw:
    label: "v59-best-dual"
    dir_name: "model_small_5deg_v59_safe_long_continue"
    ckpt: "ckpt_best_dual.pth"
    eval_aliases: ["v59-best-dual"]
  ckpt_recovery:
    label: "v59-best-val"
    dir_name: "model_small_5deg_v59_safe_long_continue"
    ckpt: "ckpt_best_val.pth"
    eval_aliases: ["v59-best-val"]
  acceptance:
    medw400_max_deg: 0.18
    zd_max_rpy_max_deg: 0.10
    genuine_recovery_2deg_min_pct: 70.0
    multi_mag_0p5_recv_min_pct: 0.0
    multi_mag_1p0_recv_min_pct: 0.0

eval_params:
  angle_range: 5.0
  trans_range: 0.0
  batch_size: 16
  vis_interval: 200
  timeout: 7200
  shortcut_diag: false
  generalization_diag: true
  exclude_seqs: "07"
  eval_max_frames_per_seq: 400

models:
  - label: "v59-best-dual"
    dir_name: "model_small_5deg_v59_safe_long_continue"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_medw.pth", "ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_dp_head: 0
    use_hard_route_eval: 0
    use_gated_instance_norm: 1
    gin_channels: 128
    mode_desc: "V59 best-dual 主候选"
    pitch_vertical_bands: 5

  - label: "v59-best-medw"
    dir_name: "model_small_5deg_v59_safe_long_continue"
    ckpt: "ckpt_best_medw.pth"
    ckpt_fallback: ["ckpt_best_dual.pth", "ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_dp_head: 0
    use_hard_route_eval: 0
    use_gated_instance_norm: 1
    gin_channels: 128
    mode_desc: "V59 best-medw 候选"
    pitch_vertical_bands: 5

  - label: "v59-best-val"
    dir_name: "model_small_5deg_v59_safe_long_continue"
    ckpt: "ckpt_best_val.pth"
    ckpt_fallback: ["ckpt_best_dual.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_dp_head: 0
    use_hard_route_eval: 0
    use_gated_instance_norm: 1
    gin_channels: 128
    mode_desc: "V59 best-val 候选"
    pitch_vertical_bands: 5

  - label: "v59-ckpt40"
    dir_name: "model_small_5deg_v59_safe_long_continue"
    ckpt: "ckpt_40.pth"
    ckpt_fallback: ["ckpt_best_dual.pth", "ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_dp_head: 0
    use_hard_route_eval: 0
    use_gated_instance_norm: 1
    gin_channels: 128
    mode_desc: "V59 epoch40 长训末端候选"
    pitch_vertical_bands: 5
