# V52a: 两阶段解耦训练 — Recovery Base (S1) + ZD Fine-tune (S2)
#
# 机器 A 并行实验线（与 v52b 机器 B 同时跑）
# 设计文档: docs/V52_DESIGN.md
#
# Usage:
#   bash batch_train.sh configs/v52a_cf_bev_r.yaml --skip-pattern full   # smoke
#   bash batch_train.sh configs/v52a_cf_bev_r.yaml --skip-pattern smoke    # full

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    use_pitch_fusion: 1
    pitch_vertical_bands: 5
    corr_window_mode: adaptive

    use_dla: 1
    use_instance_norm: 0
    use_gated_instance_norm: 0
    gin_channels: 0
    gin_gate_reg_weight: 0.0

    backbone_type: swin
    backbone_lr_scale: 0.1
    head_dropout: 0.05
    batch_size: 16
    learning_rate: 4.006191761686402e-05
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.5,5.5,1.5"
    use_geodesic_loss: 0
    corr_alignment_weight: 0.3
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.3
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.1

    tinit_dropout_prob: 0.5
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 15.0
    zero_perturbation_prob: 0.10
    zero_drift_loss_weight: 0.0
    zero_drift_dedicated_ratio: 0.0
    inject_recovery_loss_weight: 0.0
    symmetric_perturb: 1
    overcorrection_penalty: 2.0
    use_magnitude_head: 1
    magnitude_loss_weight: 0.3
    multi_scale_perturb: "0.5:0.30,1.0:0.25,2.0:0.15"

    jacobian_loss_weight: 0.15
    jacobian_loss_start_epoch: 10
    jacobian_loss_probe_deg: 2.0
    jacobian_loss_interval: 4

    progressive_angle_start: 2.0
    progressive_angle_end: 5.0
    progressive_warmup_epochs: 50

    augment_mount_jitter_prob: 0.4
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.015
    augment_intrinsic: 0.03
    augment_intrinsic_cxcy: 0.015
    augment_color_jitter: 0.3

    xyz_only: 1
    max_pcd_points: 16384
    perturb_distribution: magnitude_balanced
    per_axis_prob: 0.4
    pose_aware_sampling: true
    max_frames_per_seq: 500
    foreground: true
    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_pitch_flip_prob: 0.0

    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.1
    enable_jacobian_gate_ckpt: 1
    jacobian_early_stop_min: 0.0
    jacobian_early_stop_patience: 2
    zero_drift_loss_weight_start: 0.0
    zero_drift_loss_ramp_epochs: 0
    save_ckpt_per_epoches: 10

    seed: 42
    resume_ckpt: auto

    consistency_loss_weight: 0.0
    consistency_loss_start_epoch: 999
    conditional_consistency_threshold: 0.0
    quat_bias_reset_alpha: 0.1
    decoder_pool_mode: mean
    rocr_detach_epochs: 999
    seq_consistency_start_epoch: 999

experiments:
  # ===== Smoke: Stage1 → Stage2 链式验证 =====
  - name: "v52a_S1_smoke"
    description: "V52a-S1 smoke: Recovery base 15ep (no ZD loss)"
    dataset: "all"
    version: "v52a_S1_smoke"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 15
      warmup_epochs: 3
      lr_schedule: cosine_warm_restarts
      cosine_T0: 15
      cosine_Tmult: 1
      early_stopping_patience: 999
      eval_epoches: 5
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v50a_optuna_no_cons_S1_full/all_training_data_scratch/checkpoint/ckpt_best_val.pth"
      save_ckpt_per_epoches: 5
      max_frames_per_seq: 200

  - name: "v52a_S2_smoke"
    description: "V52a-S2 smoke: ZD ramp fine-tune 5ep + jac guard"
    dataset: "all"
    version: "v52a_S2_smoke"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 5
      warmup_epochs: 1
      lr_schedule: cosine_warm_restarts
      cosine_T0: 5
      cosine_Tmult: 1
      early_stopping_patience: 999
      eval_epoches: 2
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v52a_S1_smoke/all_training_data_scratch/checkpoint/ckpt_best_val.pth"
      backbone_lr_scale: 0.01
      learning_rate: 8.012383523372804e-06
      jacobian_loss_weight: 0.05
      jacobian_loss_start_epoch: 1
      zero_drift_loss_weight: 1.0
      zero_drift_loss_weight_start: 0.3
      zero_drift_loss_ramp_epochs: 3
      zero_drift_loss_start_epoch: 1
      zero_drift_dedicated_ratio: 0.15
      zero_perturbation_prob: 0.25
      jacobian_early_stop_min: 0.85
      jacobian_early_stop_patience: 2
      enable_jacobian_gate_ckpt: 1
      progressive_angle_start: 0.0
      progressive_angle_end: 0.0
      save_ckpt_per_epoches: 5
      max_frames_per_seq: 200

  # ===== Full: Stage1 100ep → Stage2 30ep =====
  - name: "v52a_S1_full"
    description: "V52a-S1 full: Recovery base 100ep"
    dataset: "all"
    version: "v52a_S1_full"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 100
      warmup_epochs: 6
      lr_schedule: cosine_warm_restarts
      cosine_T0: 40
      cosine_Tmult: 2
      early_stopping_patience: 50
      eval_epoches: 10
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v50a_optuna_no_cons_S1_full/all_training_data_scratch/checkpoint/ckpt_best_val.pth"

  - name: "v52a_S2_full"
    description: "V52a-S2 full: ZD ramp 30ep + jac guard/early-stop on S1 ckpt"
    dataset: "all"
    version: "v52a_S2_full"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 30
      warmup_epochs: 2
      lr_schedule: cosine_warm_restarts
      cosine_T0: 30
      cosine_Tmult: 1
      early_stopping_patience: 15
      eval_epoches: 5
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v52a_S1_full/all_training_data_scratch/checkpoint/ckpt_best_val.pth"
      backbone_lr_scale: 0.01
      learning_rate: 8.012383523372804e-06
      jacobian_loss_weight: 0.05
      jacobian_loss_start_epoch: 1
      zero_drift_loss_weight: 1.0
      zero_drift_loss_weight_start: 0.3
      zero_drift_loss_ramp_epochs: 10
      zero_drift_loss_start_epoch: 1
      zero_drift_dedicated_ratio: 0.15
      zero_perturbation_prob: 0.25
      jacobian_early_stop_min: 0.85
      jacobian_early_stop_patience: 2
      enable_jacobian_gate_ckpt: 1
      progressive_angle_start: 0.0
      progressive_angle_end: 0.0
