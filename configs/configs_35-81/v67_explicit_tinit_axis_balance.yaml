# V67-explicit-tinit-axis-balance
#
# Based on V66 smoke:
#   - explicit_tinit starts to create recovery gain (epoch5 Jacobian=0.142)
#   - but sensitivity is axis-imbalanced (Yaw near 0) and MEDW degrades.
# V67 keeps the explicit T_init path, reduces noisy tinit_sensitivity pressure,
# and biases train-time Jacobian sampling toward Yaw/Roll while preserving
# more normal random-perturbation accuracy.

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    rotation_only: true

    cam2bev_mode: "query"
    backbone_type: "dinov2"
    backbone_variant: "dinov2-small"
    freeze_backbone: 1
    backbone_freeze_layers: "0:-2"
    backbone_lr_scale: 0.002
    use_mlp_head: 0
    explicit_tinit: 1
    tinit_sensitivity_weight: 0.02
    drop_path_rate: 0.04
    head_dropout: 0.06

    batch_size: 8
    learning_rate: 3.8e-05
    wd: 0.005
    use_ddp: true
    ddp_gpus: 4
    nnodes: 1
    ddp_auto_scale: 0
    no_amp: 1

    enable_axis_loss: true
    weight_axis_rotation: 0.50
    axis_weights: "1.5,1.4,2.6"
    use_balanced_axis_loss: 1

    perturb_distribution: truncated_normal
    zero_perturbation_prob: 0.16
    multi_scale_perturb: "0.5:0.16,1.0:0.22,2.0:0.38,3.5:0.18,5.0:0.06"
    per_axis_prob: 0.48
    per_axis_weights: "0.34,0.26,0.40"
    symmetric_perturb: 1
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 2.5
    tinit_dropout_prob: 0.00
    overcorrection_penalty: 0.65

    use_mgda: 0
    mgda_start_epoch: 0
    mgda_include_inject: 1
    mgda_include_photo: 0

    jacobian_loss_weight: 0.22
    jacobian_loss_start_epoch: 0
    jacobian_loss_probe_deg: 2.0
    jacobian_loss_interval: 1
    jacobian_loss_axis_weights: "1.3,1.0,2.7"

    zero_drift_loss_weight: 0.24
    zero_drift_loss_weight_start: 0.12
    zero_drift_loss_ramp_epochs: 6
    zero_drift_loss_start_epoch: 0
    zero_drift_dedicated_ratio: 0.18

    inject_recovery_loss_weight: 0.85
    inject_recovery_loss_start_epoch: 0
    inject_recovery_magnitude_deg: 2.0
    inject_recovery_dedicated_ratio: 0.32

    augment_mount_jitter_prob: 0.18
    augment_mount_jitter_rot_sigma: 0.8
    augment_mount_jitter_trans_sigma: 0.004
    augment_pitch_sign_flip_prob: 0.0
    augment_pitch_flip_prob: 0.01
    augment_pitch_flip_max_deg: 0.4
    augment_color_jitter: 0.05
    augment_pc_jitter: 0.006
    augment_pc_dropout: 0.012
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0

    pose_aware_sampling: true
    max_frames_per_seq: 300
    eval_epoches: 4
    save_ckpt_per_epoches: 4
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 2.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.35
    dual_gate_medw_max: 0.22
    enable_jacobian_gate_ckpt: 1
    jacobian_early_stop_min: 0.20
    jacobian_early_stop_patience: 3

    seed: 45
    grad_accum_steps: 1
    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"
    fuser_type: "diff"
    no_tensorboard: true

experiments:
  - name: "v67_explicit_tinit_axis_balance_smoke"
    description: "V67 smoke: explicit T_init with yaw-biased Jacobian sampling and safer MEDW balance"
    dataset: "all"
    version: "v67_explicit_tinit_axis_balance_smoke"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 20
      warmup_epochs: 1
      lr_schedule: cosine_warm_restarts
      cosine_T0: 20
      cosine_Tmult: 1
      early_stopping_patience: 999
      max_frames_per_seq: 200
      eval_epoches: 4
      save_ckpt_per_epoches: 4
      pretrain_ckpt: "logs/all_training_data/v29_quick/model_small_5deg_v29_G3_partial_unfreeze_dinov2_quick/all_training_data_scratch/checkpoint/ckpt_best_val.pth"

  - name: "v67_explicit_tinit_axis_balance_full"
    description: "V67 full: promote only if smoke keeps MEDW while lifting all-axis Jacobian"
    dataset: "all"
    version: "v67_explicit_tinit_axis_balance"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      batch_size: 12
      ddp_gpus: 8
      learning_rate: 2.4e-05
      backbone_lr_scale: 0.0015
      tinit_sensitivity_weight: 0.01
      num_epochs: 80
      warmup_epochs: 3
      lr_schedule: cosine_warm_restarts
      cosine_T0: 40
      cosine_Tmult: 1
      early_stopping_patience: 18
      max_frames_per_seq: 500
      eval_epoches: 5
      save_ckpt_per_epoches: 5
      inject_recovery_dedicated_ratio: 0.26
      inject_recovery_loss_weight: 0.72
      jacobian_loss_weight: 0.16
      jacobian_loss_interval: 2
      jacobian_loss_axis_weights: "1.3,1.0,2.7"
      zero_drift_dedicated_ratio: 0.20
      zero_drift_loss_weight: 0.28
      pretrain_ckpt: "logs/all_training_data/v29_quick/model_small_5deg_v29_G3_partial_unfreeze_dinov2_quick/all_training_data_scratch/checkpoint/ckpt_best_val.pth"
