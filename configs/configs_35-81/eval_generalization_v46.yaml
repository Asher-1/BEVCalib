    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V46 S3 Quick: ±2° (wider than V45's ±1°) to prevent collapse"
    pitch_vertical_bands: 1

  # ===== V46 Full =====
  - label: "v46-S1-full-dual"
    dir_name: "model_small_5deg_v46_cf_bev_r_S1"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_medw.pth", "ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
