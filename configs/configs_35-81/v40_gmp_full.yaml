# V40 完整版单次训练（部署 ±3° 对齐）
#
# 主实验: v40_gmp_full_5deg_main — ±5°→±2° curriculum, eval@3°, 80ep
# 对齐 V39 冲 0.1° 路径；pretrain 仍用 V39 ±10° ckpt
#
# Wall-clock 粗估：~12–15h（8×L20, f500, iter1, 80ep）

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200
    PROJFUSION_ROOT: /mnt/drtraining/user/dahailu/code/ProjFusion

  params:
    fusion_backend: geo_match_proj
    pc_encoder_mode: pointgpt2bev

    batch_size: 32
    learning_rate: 4.6e-4
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    use_compile: false
    no_amp: 1
    rotation_only: true

    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 5.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 5
    medw_eval_max_frames: 200

    native_cross: 0
    cam2bev_mode: query
    backbone_type: dinov2
    backbone_variant: dinov2-small
    freeze_backbone: 1

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.0,3.0,1.0"
    use_balanced_axis_loss: 1

    drop_path_rate: 0.15
    head_dropout: 0.15

    max_frames_per_seq: 500
    augment_mount_jitter_prob: 0.6
    augment_mount_jitter_rot_sigma: 5.0
    augment_mount_jitter_trans_sigma: 0.01
    augment_pitch_sign_flip_prob: 0.15
    augment_pitch_flip_prob: 0.35
    augment_pitch_flip_max_deg: 5.0
    augment_color_jitter: 0.15
    augment_pc_jitter: 0.02
    augment_pc_dropout: 0.10
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0

    native_cross_extend_ratio: 2.5
    lr_schedule: cosine_warm_restarts
    cosine_T0: 30
    cosine_Tmult: 2
    warmup_epochs: 6
    backbone_lr_scale: 0.0

    save_ckpt_per_epoches: 10
    eval_epoches: 10

    iterative_refine: 0
    projfusion_image_hw: [252, 448]
    appearance_loss_weight: 0.1
    depth_loss_weight: 0.05
    geo_loss_start_epoch: 5
    use_match_head: 1
    use_local_correlation: 1
    compose_mode: match_then_refine
    num_correspondences: 64
    correspondence_loss_weight: 1.0
    correspondence_supervision: 1
    match_valid_ratio_min: 0.3

    # 部署 ±3°：训练 5°→2° curriculum，val/MEDW @3°
    angle_range_deg: 5
    progressive_angle_start: 5
    progressive_angle_end: 2
    progressive_warmup_epochs: 60
    eval_angle_range_deg: 3

    native_cross_pointgpt_ckpt: /mnt/drtraining/user/dahailu/code/ProjFusion/pretrained/fleet_pointgpt_L20.pth
    native_cross_pointgpt_config: /mnt/drtraining/user/dahailu/code/ProjFusion/cfg/pointgpt/finetune_fleet_L20.yaml
    native_cross_pointgpt_max_depth: 60.0

    pose_aware_sampling: true
    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    seed: 42

    pretrain_ckpt: logs/all_training_data/model_small_10deg_v39_fast_exp1_wide_10deg/all_training_data_scratch/checkpoint/ckpt_best_medw.pth

experiments:
  - name: "v40_gmp_full_5deg_main"
    description: "V40 主实验: ±5→2° curriculum, eval@3°, 80ep, 部署对齐"
    dataset: "all"
    version: "v40_gmp_full_5deg_main"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      num_epochs: 80

  - name: "v40_gmp_full_main"
    description: "旧版 ±10→2°（已被 5deg 取代）"
    dataset: "all"
    version: "v40_gmp_full_main"
    skip: true
    skip_reason: "部署仅需 ±3°，改用 v40_gmp_full_5deg_main"
    params:
      angle_range_deg: 10
      progressive_angle_start: 10
      progressive_warmup_epochs: 70
      jacobian_eval_angle_deg: 10.0
      trans_range: 0.0
      num_epochs: 100

  - name: "v40_gmp_full_smoke"
    description: "2ep 冒烟"
    dataset: "all"
    version: "v40_gmp_full_smoke"
    skip: true
    skip_reason: "主实验优先"
    params:
      angle_range_deg: 5
      progressive_angle_start: 5
      progressive_warmup_epochs: 2
      trans_range: 0.0
      num_epochs: 2
      eval_epoches: 1
      geo_loss_start_epoch: 0
      max_frames_per_seq: 500

  - name: "v40_gmp_p1c_main"
    description: "P1c 结构验证（无 curriculum）"
    dataset: "all"
    version: "v40_gmp_p1c_main"
    skip: true
    skip_reason: "已被 v40_gmp_full_5deg_main 取代"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      num_epochs: 60
      max_frames_per_seq: 500
