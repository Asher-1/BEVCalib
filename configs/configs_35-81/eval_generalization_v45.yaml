# V45 全变种泛化评估配置 (含 V44 基线 + Full 链路)
#
# 用法:
#   python run_generalization_eval.py --config configs/eval_generalization_v45.yaml --parallel -1 --eval_max_frames_per_seq 400
#   python run_generalization_eval.py --config configs/eval_generalization_v45.yaml --generalization_diag --parallel -1 --eval_max_frames_per_seq 400
#
# 评估内容:
#   - V44-S1(baseline)
#   - V45a S1/S2/S3 Quick (no IN, stronger aug+reg ablation)
#   - V45b S1/S2/S3 Quick (S1 no IN, S2/S3 with IN)
#   - V45c S1/S2/S3 Quick (V45b + cf_n_groups=256)
#   - V45c S1 (non-quick, 150ep longer training)
#   - V45 GIN S1/S2/S3 Quick (Gated Instance Norm)
#   - V45 GIN S1/S2/S3 Full (long-training, 全局最优链路)
#   - best_dual + best_val checkpoints
#   - generalization_diag: zero-drift / inject / shortcut / GS_medw (MEDW多帧聚合)

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_v2"
output_dir: "logs/evaluations/generalization_v45"
eval_script: "evaluate_checkpoint.py"

bag_eval_dir: "/mnt/drtraining/user/dahailu/data/bevcalib/calibration_outputs/v45_generalization"

eval_params:
  angle_range: 5.0
  trans_range: 0.0
  batch_size: 16
  vis_interval: 200
  timeout: 7200
  shortcut_diag: false
  generalization_diag: true
  exclude_seqs: "07"

models:
  # ===== Baselines (V44-S1, already verified) =====
  - label: "v44-S1-best-dual"
    dir_name: "model_small_5deg_v44_cf_bev_r_S1_quick"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_medw.pth", "ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V44 S1 baseline (no IN, MEDW=0.058°, bag=0.369°)"
    pitch_vertical_bands: 1

  - label: "v44-S1-best-val"
    dir_name: "model_small_5deg_v44_cf_bev_r_S1_quick"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
