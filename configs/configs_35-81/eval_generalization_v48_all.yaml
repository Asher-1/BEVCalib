# V48 + V47 + V45c 合并泛化评估配置
#
# 用法:
#   python run_generalization_eval.py --config configs/eval_generalization_v48_all.yaml --parallel -1 --eval_max_frames_per_seq 400
#   python run_generalization_eval.py --config configs/eval_generalization_v48_all.yaml --generalization_diag --parallel -1 --eval_max_frames_per_seq 400
#
# 评估内容:
#   - V45c S1/S2 Quick (基线)
#   - V46 S1 Quick (v47方案的对照基线)
#   - V47-512g S1 Full (长训练)
#   - V48a: Multi-Scale only (无GIN)
#   - V48b: Partial GIN(64ch) + Multi-Scale
#   - V48c: Partial GIN(128ch) + Multi-Scale
#   - V48d: 960x540 高分辨率 + Multi-Scale (无GIN)
#   - best_dual + best_val checkpoints
#   - generalization_diag: zero-drift / inject / shortcut / GS_medw

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_v2"
output_dir: "logs/evaluations/generalization_v48_all"
eval_script: "evaluate_checkpoint.py"

bag_eval_dir: "/mnt/drtraining/user/dahailu/data/bevcalib/calibration_outputs/v48_generalization"

eval_params:
  angle_range: 5.0
  trans_range: 0.0
  batch_size: 12
  vis_interval: 200
  timeout: 7200
  shortcut_diag: false
  generalization_diag: true
  exclude_seqs: "07"

models:

  # ================================================================
  #  Baselines: V45c / V46 / V47
  # ================================================================

  # ----- V45c S1 Quick (全局最优基线) -----
  - label: "v45c-S1-quick-best-dual"
    dir_name: "model_small_5deg_v45c_cf_bev_r_S1_quick"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_medw.pth", "ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V45c S1 n_groups=256 (5deg + double spatial res)"
    pitch_vertical_bands: 1

  - label: "v45c-S1-quick-best-val"
    dir_name: "model_small_5deg_v45c_cf_bev_r_S1_quick"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V45c S1 n_groups=256 best-val"
    pitch_vertical_bands: 1

  # ----- V45c S2 Quick -----
  - label: "v45c-S2-quick-best-dual"
    dir_name: "model_small_3deg_v45c_cf_bev_r_S2_quick"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_medw.pth", "ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V45c S2 n_groups=256 + IN (3deg fine-tune)"
    pitch_vertical_bands: 1

  # ----- V46 S1 Quick (v47对照基线) -----
  - label: "v46-S1-quick-best-dual"
    dir_name: "model_small_5deg_v46_cf_bev_r_S1_quick"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_medw.pth", "ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V46 S1 Quick baseline (MEDW=0.048deg)"
