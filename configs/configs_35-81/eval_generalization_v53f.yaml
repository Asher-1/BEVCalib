# V53f 泛化评估配置
#
# GIN + JACG + MGDA（无 DP-Head）vs V53e/V54 锚点
# 验收: GenuineRec≥70%, MEDW400≤0.18°, ZD≤0.10°
#
# Usage:
#   bash run_v53f_eval.sh
#   bash run_v53f_eval.sh --gate-eval
#   bash run_v53f_eval.sh --precheck-only

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_v2"
output_dir: "logs/evaluations/generalization_v53f"
eval_script: "evaluate_checkpoint.py"

bag_eval_dir: "/mnt/drtraining/user/dahailu/data/bevcalib/calibration_outputs/v53f_generalization"

deploy_policy:
  gate_deg: 1.5
  medw_n_frames: 400
  ckpt_medw:
    label: "v53f-gin-jacg-best-dual"
    dir_name: "model_small_5deg_v53f_gin_jacg"
    ckpt: "ckpt_best_dual.pth"
    eval_aliases: ["v53f-gin-jacg-best-dual"]
  ckpt_recovery:
    label: "v53f-gin-jacg-best-val"
    dir_name: "model_small_5deg_v53f_gin_jacg"
    ckpt: "ckpt_best_val.pth"
    eval_aliases: ["v53f-gin-jacg-best-val"]
  acceptance:
    medw400_max_deg: 0.18
    zd_max_rpy_max_deg: 0.10
    genuine_recovery_2deg_min_pct: 70.0
    multi_mag_0p5_recv_min_pct: 0.0
    multi_mag_1p0_recv_min_pct: 0.0

eval_params:
  angle_range: 5.0
  trans_range: 0.0
  batch_size: 16
  vis_interval: 200
  timeout: 7200
  shortcut_diag: false
  generalization_diag: true
  exclude_seqs: "07"
  eval_max_frames_per_seq: 400

models:

  - label: "v53f-gin-jacg-best-dual"
    dir_name: "model_small_5deg_v53f_gin_jacg"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_medw.pth", "ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_dp_head: 0
    use_gated_instance_norm: 1
    gin_channels: 128
    mode_desc: "V53f GIN+JACG+MGDA dual (val MEDW 0.031° ep1)"
    pitch_vertical_bands: 5

  - label: "v53f-gin-jacg-best-medw"
    dir_name: "model_small_5deg_v53f_gin_jacg"
    ckpt: "ckpt_best_medw.pth"
    ckpt_fallback: ["ckpt_best_dual.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_dp_head: 0
    use_gated_instance_norm: 1
    gin_channels: 128
    mode_desc: "V53f MEDW最优"
    pitch_vertical_bands: 5

  - label: "v53f-gin-jacg-best-val"
    dir_name: "model_small_5deg_v53f_gin_jacg"
    ckpt: "ckpt_best_val.pth"
    ckpt_fallback: ["ckpt_best_dual.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_dp_head: 0
    use_gated_instance_norm: 1
    gin_channels: 128
    mode_desc: "V53f Recovery 路径"
    pitch_vertical_bands: 5

  - label: "v53f-gin-jacg-best-jacobian"
    dir_name: "model_small_5deg_v53f_gin_jacg"
    ckpt: "ckpt_best_jacobian.pth"
    ckpt_fallback: ["ckpt_best_dual.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_dp_head: 0
    use_gated_instance_norm: 1
    gin_channels: 128
    mode_desc: "V53f Jacobian gate 最优"
    pitch_vertical_bands: 5

  - label: "v53e-gin-mgda-best-dual"
    dir_name: "model_small_5deg_v53e_gin_mgda_full"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_gated_instance_norm: 1
    gin_channels: 128
    use_dp_head: 0
    mode_desc: "V53e 基座锚点 (Rec 56.6%)"
    pitch_vertical_bands: 5

  - label: "v54d-router-fix-best-dual"
    dir_name: "model_small_5deg_v54d_router_fix"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_medw.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_dp_head: 1
    use_gated_instance_norm: 0
    gin_channels: 0
    mode_desc: "V54d DP-Head 对照"
    pitch_vertical_bands: 5

  - label: "v54a-nolsp-best-dual"
    dir_name: "model_small_5deg_v54a_nolsp"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_gated_instance_norm: 1
    gin_channels: 128
    use_dp_head: 0
    mode_desc: "V54a MEDW 最佳锚点 (0.193°)"
    pitch_vertical_bands: 5
