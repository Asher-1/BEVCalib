# V61-hardseq-refine: 从 V60 formal best ckpt15 出发，针对 Seq02/Seq03 聚合误差做短程精修
#
# V60 formal:
#   - best: v60-ckpt15, MEDW400 = 0.205° (R:0.121 P:0.120 Y:0.082)
#   - hard seq: Seq03 Rot 0.690°, Seq02 Rot 0.406°, Seq10 Rot 0.225°
# 目标:
#   1. 保住 V60 的 roll/yaw 收益
#   2. 用 sampler hard-seq override 拉低 Seq02/Seq03 的聚合误差
#   3. 降低 LR / inject / jac 压力，减少 V60 后半程 NaN guard

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    use_pitch_fusion: 1
    pitch_vertical_bands: 5
    corr_window_mode: adaptive

    use_dla: 1
    use_instance_norm: 0
    use_gated_instance_norm: 1
    gin_channels: 128
    gin_init_gate: 0.35
    gin_gate_reg_weight: 0.01
    gin_gate_reg_target: 0.35

    use_dp_head: 0
    use_hard_route_eval: 0
    dp_gate_deg: 1.5
    route_loss_weight: 0.0
    route_zd_penalty_weight: 0.0
    use_jacg: 1
    jacg_hidden_dim: 64
    bias_path_in_norm: 1
    recovery_path_layer_norm: 1

    backbone_type: swin
    backbone_lr_scale: 0.020
    head_dropout: 0.05
    batch_size: 16
    learning_rate: 2.4e-06
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    no_amp: 1
    data_balance: 1
    seq_weight_overrides: "02:1.45,03:2.00,06:1.15,08:1.10,10:1.20"

    enable_axis_loss: true
    weight_axis_rotation: 0.60
    axis_weights: "3.0,7.0,0.7"
    corr_alignment_weight: 0.36
    corr_alignment_warmup: 4
    pitch_aux_weight: 0.38
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.22
    seq_consistency_start_epoch: 0

    tinit_dropout_prob: 0.08
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 3.0
    zero_perturbation_prob: 0.64
    multi_scale_perturb: "0.5:0.42,1.0:0.36,2.0:0.12,3.5:0.02"
    per_axis_prob: 0.42
    per_axis_weights: "0.45,0.47,0.08"
    symmetric_perturb: 1
    overcorrection_penalty: 2.4
    use_magnitude_head: 1
    magnitude_loss_weight: 0.10

    use_mgda: 1
    mgda_start_epoch: 0
    mgda_include_inject: 1
    mgda_include_photo: 0

    jacobian_loss_weight: 0.045
    jacobian_loss_start_epoch: 0
    jacobian_loss_probe_deg: 1.6
    jacobian_loss_interval: 6

    zero_drift_loss_weight: 0.74
    zero_drift_loss_weight_start: 0.56
    zero_drift_loss_ramp_epochs: 5
    zero_drift_loss_start_epoch: 0
    zero_drift_dedicated_ratio: 0.66

    inject_recovery_loss_weight: 0.16
    inject_recovery_loss_start_epoch: 0
    inject_recovery_magnitude_deg: 1.6
    inject_recovery_dedicated_ratio: 0.04

    use_lsp_loss: 0
    rig_consistency_weight: 0.0
    pose_release_epoch: 0
    freeze_backbone_epoch: 0

    progressive_angle_start: 0.6
    progressive_angle_end: 4.0
    progressive_warmup_epochs: 5

    augment_mount_jitter_prob: 0.08
    augment_mount_jitter_rot_sigma: 0.38
    augment_mount_jitter_trans_sigma: 0.005
    augment_intrinsic: 0.008
    augment_color_jitter: 0.06
    augment_fov_crop_prob: 0.03
    augment_fov_crop_ratio_min: 0.92
    augment_fov_crop_ratio_max: 0.98
    augment_lidar_sparse_prob: 0.015
    augment_lidar_sparse_lines: "32,64"
    augment_lidar_vertical_fov: "-25,15"
    max_pcd_points: 16384
    pose_aware_sampling: true
    max_frames_per_seq: 400

    enable_medw_eval: 1
    enable_jacobian_eval: 1
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.90
    dual_gate_medw_max: 0.135
    enable_jacobian_gate_ckpt: 1
    jacobian_early_stop_min: 0.86
    jacobian_early_stop_patience: 3
    eval_epoches: 4
    save_ckpt_per_epoches: 4
    seed: 42
    no_tensorboard: true

experiments:
  - name: "v61_hardseq_refine_smoke"
    description: "V61 smoke: V60 ckpt15 anchor + hard seq sampler overrides"
    dataset: "all"
    version: "v61_hardseq_refine_smoke"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 6
      warmup_epochs: 1
      lr_schedule: cosine_warm_restarts
      cosine_T0: 6
      cosine_Tmult: 1
      early_stopping_patience: 999
      eval_epoches: 3
      save_ckpt_per_epoches: 3
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v60_seq_balance_pitch_guard/all_training_data_scratch/checkpoint/ckpt_15.pth"
      dual_gate_medw_max: 0.16

  - name: "v61_hardseq_refine_full"
    description: "V61 full: hard-seq refine toward MEDW400 <= 0.195"
    dataset: "all"
    version: "v61_hardseq_refine"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 12
      warmup_epochs: 1
      lr_schedule: cosine_warm_restarts
      cosine_T0: 12
      cosine_Tmult: 1
      early_stopping_patience: 12
      eval_epoches: 4
      save_ckpt_per_epoches: 4
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v60_seq_balance_pitch_guard/all_training_data_scratch/checkpoint/ckpt_15.pth"
      dual_gate_medw_max: 0.135
