# V76-v75e2-soft-axis-balance
#
# V75 ckpt2 is the current fixed-inject best by residual:
#   - fixed 2/2/2 full: residual 1.0571 deg, recovery 69.3%, median 79.4%.
#   - target for 70% recovery is about 1.033 deg residual.
#
# V75 improved roll-heavy hard sequences but slightly hurt pitch/yaw and several
# easy sequences. V76 keeps the same selective-head recipe, lowers LR a little,
# softens hard-seq weighting versus V75, and increases yaw/pitch exposure so we
# can recover the remaining ~0.024 deg without paying an easy-seq tax.

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    CUDA_VISIBLE_DEVICES: "4,5,6,7"
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    use_pitch_fusion: 1
    pitch_vertical_bands: 5
    corr_window_mode: adaptive

    use_dla: 1
    use_instance_norm: 0
    use_gated_instance_norm: 1
    gin_channels: 128
    gin_init_gate: 0.35
    gin_gate_reg_weight: 0.01
    gin_gate_reg_target: 0.35

    use_dp_head: 0
    use_hard_route_eval: 0
    use_jacg: 0

    use_adir: 1
    adir_train_only: 0
    trainable_prefixes: "corr_head,pose_query_init,adir_refiner"
    adir_steps: 3
    adir_max_step_deg: 1.80

    backbone_type: swin
    backbone_lr_scale: 0.0
    bev_branch_lr_scale: 0.0
    head_dropout: 0.03
    batch_size: 8
    learning_rate: 5.0e-06
    wd: 5.0e-05
    use_ddp: true
    ddp_gpus: 4
    nnodes: 1
    master_port: 29676
    no_amp: 1
    data_balance: 2
    seq_weight_overrides: "00:2.05,01:1.14,02:1.12,03:1.05,04:1.66,05:1.10,06:2.08,08:1.68,09:1.12,10:1.14,11:1.72"

    enable_axis_loss: true
    weight_axis_rotation: 0.68
    axis_weights: "3.8,6.2,3.1"
    corr_alignment_weight: 0.0
    corr_alignment_warmup: 4
    pitch_aux_weight: 0.25
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.00
    seq_consistency_start_epoch: 0

    tinit_dropout_prob: 0.010
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 2.4
    zero_perturbation_prob: 0.22
    multi_scale_perturb: "0.5:0.10,1.0:0.16,2.0:0.56,3.5:0.15,5.0:0.03"
    per_axis_prob: 0.58
    per_axis_weights: "0.38,0.34,0.28"
    symmetric_perturb: 1
    overcorrection_penalty: 0.90
    use_magnitude_head: 1
    magnitude_loss_weight: 0.0

    use_mgda: 0
    mgda_start_epoch: 0
    mgda_include_inject: 0
    mgda_include_photo: 0

    jacobian_loss_weight: 0.086
    jacobian_loss_start_epoch: 0
    jacobian_loss_probe_deg: 2.0
    jacobian_loss_interval: 4
    jacobian_loss_axis_weights: "1.42,1.18,1.68"

    zero_drift_loss_weight: 0.40
    zero_drift_loss_weight_start: 0.28
    zero_drift_loss_ramp_epochs: 3
    zero_drift_loss_start_epoch: 0
    zero_drift_dedicated_ratio: 0.20

    inject_recovery_loss_weight: 1.16
    inject_recovery_loss_start_epoch: 0
    inject_recovery_magnitude_deg: 2.0
    inject_recovery_dedicated_ratio: 0.50

    use_lsp_loss: 0
    rig_consistency_weight: 0.0
    pose_release_epoch: 0
    freeze_backbone_epoch: 0

    progressive_angle_start: 1.0
    progressive_angle_end: 5.0
    progressive_warmup_epochs: 3

    augment_mount_jitter_prob: 0.030
    augment_mount_jitter_rot_sigma: 0.14
    augment_mount_jitter_trans_sigma: 0.003
    augment_intrinsic: 0.0025
    augment_color_jitter: 0.025
    augment_fov_crop_prob: 0.005
    augment_fov_crop_ratio_min: 0.980
    augment_fov_crop_ratio_max: 0.995
    augment_lidar_sparse_prob: 0.004
    augment_lidar_sparse_lines: "32,64"
    augment_lidar_vertical_fov: "-25,15"
    max_pcd_points: 16384
    pose_aware_sampling: true
    max_frames_per_seq: 400

    enable_medw_eval: 1
    enable_jacobian_eval: 1
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.78
    dual_gate_medw_max: 0.24
    enable_jacobian_gate_ckpt: 1
    jacobian_early_stop_min: 0.60
    jacobian_early_stop_patience: 4
    eval_epoches: 1
    save_ckpt_per_epoches: 1
    seed: 760
    no_tensorboard: true

experiments:
  - name: "v76_v75e2_soft_axis_balance_smoke"
    description: "V76 smoke: soft hard-seq balance from V75 ckpt2, yaw/pitch guard"
    dataset: "all"
    version: "v76_v75e2_soft_axis_balance_smoke"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      batch_size: 8
      ddp_gpus: 4
      num_epochs: 4
      warmup_epochs: 1
      lr_schedule: cosine_warm_restarts
      cosine_T0: 4
      cosine_Tmult: 1
      early_stopping_patience: 999
      max_frames_per_seq: 380
      eval_epoches: 1
      save_ckpt_per_epoches: 1
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v75_v74e2_hardseq_micro_polish_smoke/all_training_data_scratch/checkpoint/ckpt_2.pth"
