# V43 + V44 bag calibration 泛化评估 — 基线（零扰动）
# 用法: python run_bag_calibration.py --config configs/calibration_v43_44_generalization.yaml

input_file: /mnt/drtraining/user/dahailu/data/bevcalib/bag_lists/test_v42.txt
input_format: trips
trips_base: /mnt/drtraining/user/dahailu/data/bevcalib/dummy_data

# ckpt_path 和 output_dir 由 batch 脚本动态覆盖
ckpt_path: null
output_dir: null

max_frames: 200
min_agg_frames: 50
extract_buffer_multiplier: 1.2
infer_cap_multiplier: 1.25
incremental_extract: true

camera_name: traffic_2
batch_size: 16
img_h: 360
img_w: 640
projection_ratio: 0.05

min_speed_kmh: 5.0
max_speed_kmh: 120.0
min_accel: -1.0
max_accel: 2.0
min_brightness: 25

parallel: -1
preparer_num_workers: 16
filter_air_suspension: false
cleanup_cache: false
