# V21 泛化评估配置 — 测试集 (test_data_v2)
#
# 4 个实验: full / no_intr / strong / z10
# 所有模型使用 spconv (USE_DRCV_BACKEND=0)
#
# 用法:
#   HF_HUB_OFFLINE=1 python run_generalization_eval.py \
#     --config configs/eval_generalization_v21.yaml --parallel -1
#
# 同时评估训练域:
#   修改 test_data 为 all_training_data 路径, output_dir 改为 *_all_data

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_v2"
output_dir: "logs/evaluations/generalization_eval_v21_test"
eval_script: "evaluate_checkpoint.py"

eval_params:
  angle_range: 5.0
  trans_range: 0.15
  batch_size: 16
  vis_interval: 200
  timeout: 3600
  eval_max_frames_per_seq: 400

models:
  # ===== V21 泛化实验 (spconv, axis_weights=1:3:1) =====

  # 1. V21 完整增强 (主实验)
  - label: "v21-full"
    dir_name: "model_small_5deg_v21_generalize_full"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    rotation_only: 1
    use_drcv: 0
    use_mlp_head: 0
    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 5
    version: "v21-full"
    mode_desc: "V21 完整增强: 双Pitch+color+intrinsic(0.03)+pc_drop"

  # 2. V21 无内参增强 (消融对照)
  - label: "v21-no-intr"
    dir_name: "model_small_5deg_v21_generalize_no_intr"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    rotation_only: 1
    use_drcv: 0
    use_mlp_head: 0
    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 5
    version: "v21-no-intr"
    mode_desc: "V21 消融: 无内参增强 (intrinsic=0)"

  # 3. V21 超强增强
  - label: "v21-strong"
    dir_name: "model_small_5deg_v21_generalize_strong"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    rotation_only: 1
    use_drcv: 0
    use_mlp_head: 0
    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 5
    version: "v21-strong"
    mode_desc: "V21 强化: 加大所有增强强度, 探索上限"

  # 4. V21 Z10 + 完整增强
  - label: "v21-z10"
    dir_name: "model_small_5deg_v21_generalize_z10"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 0
    use_mlp_head: 0
    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v21-z10"
    mode_desc: "V21: Z10+完整增强 (Z消融)"

  # ===== 对照: V20 最佳 (无增强) 作为 baseline =====
  - label: "v20-baseline"
    dir_name: "model_small_5deg_v20_v8recipe_z5_5deg_pitch_wt3_no_drcv"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    rotation_only: 1
    use_drcv: 0
    use_mlp_head: 0
    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 5
    version: "v20-baseline"
    mode_desc: "V20 对照: Z5+spconv+wt1:3:1 (无增强)"

# ============================================================================
# V21 评估矩阵
# ============================================================================
#
#   实验          | intrinsic | pitch_flip | sign_flip | color | Z  | 目标
#   --------+--------+-----------+-----------+-----------+-------+----+-------
#   v21-full      | 0.03      | 0.20/3°    | 0.15      | 0.15  | 5  | 主实验
#   v21-no-intr   | 0         | 0.20/3°    | 0.15      | 0.15  | 5  | intrinsic消融
#   v21-strong    | 0.05      | 0.30/4°    | 0.25      | 0.25  | 5  | 增强上限
#   v21-z10       | 0.03      | 0.20/3°    | 0.15      | 0.15  | 10 | Z消融
#   v20-baseline  | 0         | 0          | 0         | 0     | 5  | 无增强对照
