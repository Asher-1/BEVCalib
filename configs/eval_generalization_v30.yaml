# V30 Full 泛化评估: dinov2-small 消融矩阵 (32节点训练)
# 严格匹配 batch8_train_all_v30.yaml 的 4 个实验
# 每个实验评估 best_val + ckpt_400 两个 checkpoint
#
# 消融矩阵:
#   G3:       dinov2-small + unfreeze2 + AS=1         ← 部署首选
#   G3-noAS:  dinov2-small + unfreeze2 + AS=0         ← auto_scale 消融
#   G3-DANN:  dinov2-small + unfreeze2 + DANN + AS=1  ← DANN 效果
#   G3-10deg: dinov2-small + unfreeze2 + 10° + AS=1   ← 大扰动消融
#
# 用法:
#   python run_generalization_eval.py --config configs/eval_generalization_v30.yaml --parallel -1

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data/v30"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_v2"
output_dir: "logs/evaluations/generalization_eval_v30"

eval_params:
  angle_range: 5.0
  trans_range: 0.15
  batch_size: 16
  vis_interval: 200
  timeout: 14400
  eval_max_frames_per_seq: 800

models:
  # === G3: dinov2-small + unfreeze2 (部署首选) ===
  - label: "v30-G3-small"
    dir_name: "model_small_5deg_v30_G3_dinov2small_full"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    mode_desc: "G3: dinov2-small + unfreeze2 (deploy, best_val)"

  - label: "v30-G3-small-ckpt400"
    dir_name: "model_small_5deg_v30_G3_dinov2small_full"
    ckpt: "ckpt_400.pth"
    bev_zbound_step: "4.0"
    mode_desc: "G3: dinov2-small + unfreeze2 (deploy, ckpt_400)"

  # === G3-noAS: auto_scale 消融 ===
  - label: "v30-G3-noAS"
    dir_name: "model_small_5deg_v30_G3_dinov2small_noAS"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    mode_desc: "G3-noAS: no auto_scale (best_val)"

  - label: "v30-G3-noAS-ckpt400"
    dir_name: "model_small_5deg_v30_G3_dinov2small_noAS"
    ckpt: "ckpt_400.pth"
    bev_zbound_step: "4.0"
    mode_desc: "G3-noAS: no auto_scale (ckpt_400)"

  # === G3-DANN: DANN 效果 ===
  - label: "v30-G3-dann"
    dir_name: "model_small_5deg_v30_G3_dinov2small_dann"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    mode_desc: "G3-DANN: dinov2-small + DANN (best_val)"

  - label: "v30-G3-dann-ckpt400"
    dir_name: "model_small_5deg_v30_G3_dinov2small_dann"
    ckpt: "ckpt_400.pth"
    bev_zbound_step: "4.0"
    mode_desc: "G3-DANN: dinov2-small + DANN (ckpt_400)"

  # === G3-10deg: 大扰动消融 ===
  - label: "v30-G3-10deg"
    dir_name: "model_small_10deg_v30_G3_dinov2small_10deg"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    mode_desc: "G3-10deg: 10deg perturbation (best_val)"

  - label: "v30-G3-10deg-ckpt400"
    dir_name: "model_small_10deg_v30_G3_dinov2small_10deg"
    ckpt: "ckpt_400.pth"
    bev_zbound_step: "4.0"
    mode_desc: "G3-10deg: 10deg perturbation (ckpt_400)"
