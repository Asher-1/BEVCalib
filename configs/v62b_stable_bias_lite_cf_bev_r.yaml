# V62b-stable-bias-lite: safer follow-up after V62 smoke showed frequent NaN guards
#
# V62 smoke:
#   - completed and dual gate passed, but 4 NaN-guard skips in 4 epochs
#   - best internal MEDW200 stayed at epoch1, later drifted upward
#
# V62b strategy:
#   - keep V60 ckpt15 anchor
#   - keep sqrt balance, but make hard-seq overrides very mild
#   - no MGDA, lower LR/backbone LR, and sharply reduce zero/inject/jac pressure
#   - use smaller perturb/mount-jitter tail to avoid disturbing the V60 sweet spot

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    use_pitch_fusion: 1
    pitch_vertical_bands: 5
    corr_window_mode: adaptive

    use_dla: 1
    use_instance_norm: 0
    use_gated_instance_norm: 1
    gin_channels: 128
    gin_init_gate: 0.35
    gin_gate_reg_weight: 0.01
    gin_gate_reg_target: 0.35

    use_dp_head: 0
    use_hard_route_eval: 0
    dp_gate_deg: 1.5
    route_loss_weight: 0.0
    route_zd_penalty_weight: 0.0
    use_jacg: 1
    jacg_hidden_dim: 64
    bias_path_in_norm: 1
    recovery_path_layer_norm: 1

    backbone_type: swin
    backbone_lr_scale: 0.010
    head_dropout: 0.03
    batch_size: 16
    learning_rate: 1.5e-06
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    no_amp: 1
    data_balance: 2
    seq_weight_overrides: "02:1.05,03:1.15,10:1.05"

    enable_axis_loss: true
    weight_axis_rotation: 0.56
    axis_weights: "2.5,7.2,0.7"
    corr_alignment_weight: 0.25
    corr_alignment_warmup: 4
    pitch_aux_weight: 0.40
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.12
    seq_consistency_start_epoch: 0

    tinit_dropout_prob: 0.04
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 2.5
    zero_perturbation_prob: 0.58
    multi_scale_perturb: "0.5:0.55,1.0:0.34,2.0:0.09,2.5:0.02"
    per_axis_prob: 0.40
    per_axis_weights: "0.40,0.52,0.08"
    symmetric_perturb: 1
    overcorrection_penalty: 2.2
    use_magnitude_head: 1
    magnitude_loss_weight: 0.06

    use_mgda: 0
    mgda_start_epoch: 0
    mgda_include_inject: 0
    mgda_include_photo: 0

    jacobian_loss_weight: 0.015
    jacobian_loss_start_epoch: 0
    jacobian_loss_probe_deg: 1.2
    jacobian_loss_interval: 12

    zero_drift_loss_weight: 0.48
    zero_drift_loss_weight_start: 0.36
    zero_drift_loss_ramp_epochs: 4
    zero_drift_loss_start_epoch: 0
    zero_drift_dedicated_ratio: 0.42

    inject_recovery_loss_weight: 0.04
    inject_recovery_loss_start_epoch: 0
    inject_recovery_magnitude_deg: 1.2
    inject_recovery_dedicated_ratio: 0.01

    use_lsp_loss: 0
    rig_consistency_weight: 0.0
    pose_release_epoch: 0
    freeze_backbone_epoch: 0

    progressive_angle_start: 0.5
    progressive_angle_end: 3.0
    progressive_warmup_epochs: 4

    augment_mount_jitter_prob: 0.03
    augment_mount_jitter_rot_sigma: 0.22
    augment_mount_jitter_trans_sigma: 0.003
    augment_intrinsic: 0.005
    augment_color_jitter: 0.04
    augment_fov_crop_prob: 0.01
    augment_fov_crop_ratio_min: 0.96
    augment_fov_crop_ratio_max: 0.99
    augment_lidar_sparse_prob: 0.005
    augment_lidar_sparse_lines: "32,64"
    augment_lidar_vertical_fov: "-25,15"
    max_pcd_points: 16384
    pose_aware_sampling: true
    max_frames_per_seq: 400

    enable_medw_eval: 1
    enable_jacobian_eval: 1
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.90
    dual_gate_medw_max: 0.145
    enable_jacobian_gate_ckpt: 1
    jacobian_early_stop_min: 0.86
    jacobian_early_stop_patience: 3
    eval_epoches: 2
    save_ckpt_per_epoches: 2
    seed: 42
    no_tensorboard: true

experiments:
  - name: "v62b_stable_bias_lite_smoke"
    description: "V62b smoke: safer low-LR V60 ckpt15 polish"
    dataset: "all"
    version: "v62b_stable_bias_lite_smoke"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 4
      warmup_epochs: 1
      lr_schedule: cosine_warm_restarts
      cosine_T0: 4
      cosine_Tmult: 1
      early_stopping_patience: 999
      eval_epoches: 2
      save_ckpt_per_epoches: 2
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v60_seq_balance_pitch_guard/all_training_data_scratch/checkpoint/ckpt_15.pth"
      dual_gate_medw_max: 0.16

  - name: "v62b_stable_bias_lite_full"
    description: "V62b full: stable low-LR polish toward MEDW400 <= 0.200"
    dataset: "all"
    version: "v62b_stable_bias_lite"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 12
      warmup_epochs: 1
      lr_schedule: cosine_warm_restarts
      cosine_T0: 12
      cosine_Tmult: 1
      early_stopping_patience: 12
      eval_epoches: 2
      save_ckpt_per_epoches: 2
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v60_seq_balance_pitch_guard/all_training_data_scratch/checkpoint/ckpt_15.pth"
      dual_gate_medw_max: 0.145
