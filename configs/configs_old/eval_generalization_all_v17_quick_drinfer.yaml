    version: "v17-weak-pitch15-drinfer"
    mode_desc: "V17: sign_flip(0.15)+perturb(0.10,1.5°)+Pitch1.5"

  # 4. sign-flip + 弱 perturb + Pitch3
  - label: "v17-weak-pitch3 [DrInfer]"
    dir_name: "model_small_5deg_v17_weak_pitch3_quick"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    backend: "drinfer"
    compare_pytorch: true
    max_attn_tokens: 800
    model_name: "bevcalib_fusion_head"
    model_version: "v2"
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v17-weak-pitch3-drinfer"
    mode_desc: "V17: sign_flip(0.15)+perturb(0.10,1.5°)+Pitch3"

  # 5. 8度扰动 + 弱 perturb
  - label: "v17-angle8-weak [DrInfer]"
    dir_name: "model_small_8deg_v17_angle8_weak_quick"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    backend: "drinfer"
    compare_pytorch: true
