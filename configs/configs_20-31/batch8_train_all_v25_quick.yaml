# V25 Refactored Quick: 全量优化实验矩阵 (1N 快速验证)
#
# 与 batch8_train_all_v25.yaml 相同的实验矩阵，但:
#   - nnodes: 1 (单节点 8卡)
#   - max_frames_per_seq: 500 (数据量缩减)
#   - num_epochs: 400 (保持, 数据少所以每 epoch 很快)
#
# 集成所有优化:
#   BUG修复: use_mlp_head=1, backbone_lr_scale=1.0
#   训练优化: backbone_warmup=10, layer_wise_lr_decay=0.65
#   架构增强: Dual-flow Pitch Branch, BEV InstanceNorm
#   域适应: Mount Jitter, Contrastive Extrinsic Embedding
#
# 用法:
#   bash batch_train.sh configs/batch8_train_all_v25_quick.yaml
#   bash batch_train.sh --dry-run configs/batch8_train_all_v25_quick.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1

  params:
    angle_range_deg: 5
    trans_range: 0.15

    batch_size: 16
    learning_rate: 1e-4

    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    node_rank: null
    master_addr: null
    master_port: null
    ddp_auto_scale: 0

    use_compile: false
    no_amp: 1
    rotation_only: true

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.0,5.0,1.0"

    use_mlp_head: 1
    use_geodesic_loss: 0

    drop_path_rate: 0.1
    head_dropout: 0.1

    lr_schedule: step
    warmup_epochs: 5
    backbone_lr_scale: 1.0
    backbone_warmup_epochs: 10
    layer_wise_lr_decay: 0.65
    step_size: 80

    use_pitch_branch: 1
    pitch_aux_weight: 0.3
    bev_instance_norm: 1

    augment_mount_jitter_prob: 0.3
    augment_mount_jitter_rot_sigma: 0.5
    augment_mount_jitter_trans_sigma: 0.01

    use_contrastive_extrinsic: 1
    contrastive_weight: 0.1

    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    per_axis_weights: null

    augment_pitch_sign_flip_prob: 0.15
    augment_pitch_flip_prob: 0.20
    augment_pitch_flip_max_deg: 3.0
    augment_color_jitter: 0.15
    augment_pc_jitter: 0.02
    augment_pc_dropout: 0.05
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0

    pose_aware_sampling: true
    max_frames_per_seq: 500
    num_epochs: 400
    save_ckpt_per_epoches: 50

    early_stopping_patience: 30
    seed: 42

    eval_epoches: 50
    grad_accum_steps: 1

    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"

    fuser_type: "diff"
    cam_drop_prob: 0.0
    cam_drop_mode: "zero"

    foreground: true
    no_tensorboard: true
    tensorboard_port: null

experiments:
  # =========================================================================
  # A1: 全优化 baseline (Z=10, quick)
  # =========================================================================
  - name: "v25r_A1_full_z10_quick"
    description: "A1: All optimizations + Z=10 (primary)"
    dataset: "all"
    version: "v25r_A1_full_z10"
    env:
      BEV_ZBOUND_STEP: 2.0

  # =========================================================================
  # A2: Z=15 全优化 (quick)
  # =========================================================================
  - name: "v25r_A2_full_z15_quick"
    description: "A2: All optimizations + Z=15"
    dataset: "all"
    version: "v25r_A2_full_z15"
    env:
      BEV_ZBOUND_STEP: 1.33

  # =========================================================================
  # B1: 消融 — 无对比学习 (quick)
  # =========================================================================
  - name: "v25r_B1_no_contrastive_quick"
    description: "B1: Ablation — no contrastive head"
    dataset: "all"
    version: "v25r_B1_no_contrastive"
    env:
      BEV_ZBOUND_STEP: 2.0
    params:
      use_contrastive_extrinsic: 0

  # =========================================================================
  # B2: 消融 — 无mount jitter (quick)
  # =========================================================================
  - name: "v25r_B2_no_mount_jitter_quick"
    description: "B2: Ablation — no mount jitter"
    dataset: "all"
    version: "v25r_B2_no_mount_jitter"
    env:
      BEV_ZBOUND_STEP: 2.0
    params:
      augment_mount_jitter_prob: 0.0

  # =========================================================================
  # B3: 消融 — 无BEV InstanceNorm (quick)
  # =========================================================================
  - name: "v25r_B3_no_instnorm_quick"
    description: "B3: Ablation — no BEV InstanceNorm"
    dataset: "all"
    version: "v25r_B3_no_instnorm"
    env:
      BEV_ZBOUND_STEP: 2.0
    params:
      bev_instance_norm: 0

  # =========================================================================
  # C1: 强化Pitch (quick)
  # =========================================================================
  - name: "v25r_C1_strong_pitch_quick"
    description: "C1: Aggressive Pitch (8x weight, 0.5 aux)"
    dataset: "all"
    version: "v25r_C1_strong_pitch"
    env:
      BEV_ZBOUND_STEP: 2.0
    params:
      axis_weights: "1.0,8.0,1.0"
      pitch_aux_weight: 0.5

  # =========================================================================
  # C2: Fine ±1° (quick)
  # =========================================================================
  - name: "v25r_C2_fine_1deg_quick"
    description: "C2: Fine ±1° with all optimizations"
    dataset: "all"
    version: "v25r_C2_fine_1deg"
    env:
      BEV_ZBOUND_STEP: 2.0
    params:
      angle_range_deg: 1
      trans_range: 0.03
      step_size: 60
      augment_pitch_flip_max_deg: 0.8
      augment_pitch_flip_prob: 0.10
      augment_pitch_sign_flip_prob: 0.10

  # =========================================================================
  # C3: Fine ±2° (quick)
  # =========================================================================
  - name: "v25r_C3_fine_2deg_quick"
    description: "C3: Fine ±2° with all optimizations"
    dataset: "all"
    version: "v25r_C3_fine_2deg"
    env:
      BEV_ZBOUND_STEP: 2.0
    params:
      angle_range_deg: 2
      trans_range: 0.06
      step_size: 60
      augment_pitch_flip_max_deg: 1.5
