# V29 Full 泛化评估: F5×E10 组合消融 (32节点训练)
# 模型参数由 evaluate_checkpoint.py 从 checkpoint 自动检测
# 注意: V29 full 训练尚未启动，此配置为 full 训练完成后使用
#
# 用法:
#   python run_generalization_eval.py --config configs/eval_generalization_v29.yaml --parallel -1

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data/v29"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_v2"
output_dir: "logs/evaluations/generalization_eval_v29"

eval_params:
  angle_range: 5.0
  trans_range: 0.15
  batch_size: 16
  vis_interval: 200
  timeout: 7200
  eval_max_frames_per_seq: 400

models:
  - label: "v29-G3-partial-unfreeze"
    dir_name: "model_small_5deg_v29_G3_partial_unfreeze_dinov2"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    mode_desc: "G3: partial unfreeze DINOv2 (last2) + strong jitter"

  - label: "v29-G1-frozen-strong-jitter"
    dir_name: "model_small_5deg_v29_G1_frozen_dinov2_strong_jitter"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    mode_desc: "G1: frozen DINOv2 + strong jitter"

  - label: "v29-G2-frozen-jitter-dann"
    dir_name: "model_small_5deg_v29_G2_frozen_dinov2_jitter_dann"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    mode_desc: "G2: frozen DINOv2 + strong jitter + DANN"

  - label: "v29-G4-e10-query-bev"
    dir_name: "model_small_5deg_v29_G4_e10_query_bev"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    mode_desc: "G4: E10 + Query-BEV (Swin + DANN + strong jitter)"
