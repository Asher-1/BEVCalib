# V29 Quick: F5 (frozen DINOv2 + Query-BEV) × E10 (DANN + strong jitter) 组合消融
#
# 基于 V28-F5 (BEST=0.296°) 和 V27-E10 (BEST=0.321°) 的最佳策略组合
# 目标: 通过策略融合进一步逼近 0.1° 目标
#
# 消融实验矩阵:
#   G1: F5 baseline (frozen DINOv2 + Query-BEV, light jitter)   — 对照组
#   G2: F5 + strong jitter (prob=0.7, sigma=3.0)                — 加强数据增强
#   G3: F5 + strong jitter + strong reg (drop=0.2, head=0.3)    — 加强正则化
#   G4: F5 + strong jitter + DANN (weight=0.15)                 — 加域对抗
#   G5: F5 + strong jitter + strong reg + DANN                  — 完整组合
#   G6: F5 partial unfreeze (last 2 layers) + strong jitter     — 部分解冻
#   G7: E10 baseline (LSS+Swin+DANN+strong jitter)              — 对照组
#   G8: E10 + Query-BEV (替换 LSS)                              — 测试 Query-BEV 对 E10 的影响
#
# Usage:
#   bash batch_train.sh configs/batch8_train_all_v29_quick.yaml
#   bash batch_train.sh --dry-run configs/batch8_train_all_v29_quick.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 3
  retry_delay: 30

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1

  params:
    angle_range_deg: 5
    trans_range: 0.15

    batch_size: 16
    learning_rate: 1e-4

    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    node_rank: null
    master_addr: null
    master_port: null
    ddp_auto_scale: 0

    use_compile: false
    no_amp: 1
    rotation_only: true

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.0,1.0,1.0"
    use_balanced_axis_loss: 1

    use_mlp_head: 0
    use_geodesic_loss: 0

    drop_path_rate: 0.15
    head_dropout: 0.15

    lr_schedule: step
    warmup_epochs: 5
    backbone_lr_scale: 0.3
    backbone_warmup_epochs: 10
    layer_wise_lr_decay: 0.65
    step_size: 80

    use_pitch_branch: 0
    pitch_aux_weight: 0.0
    bev_instance_norm: 0
    use_contrastive_extrinsic: 0
    contrastive_weight: 0.0

    augment_mount_jitter_prob: 0.15
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.01

    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    per_axis_weights: null

    augment_pitch_sign_flip_prob: 0.15
    augment_pitch_flip_prob: 0.20
    augment_pitch_flip_max_deg: 3.0
    augment_color_jitter: 0.15
    augment_pc_jitter: 0.02
    augment_pc_dropout: 0.05
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0

    pose_aware_sampling: true

    max_frames_per_seq: 500
    num_epochs: 400
    save_ckpt_per_epoches: 50

    early_stopping_patience: 30
    eval_epoches: 50

    seed: 42
    grad_accum_steps: 1

    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"

    fuser_type: "diff"
    cam_drop_prob: 0.0
    cam_drop_mode: "zero"

    foreground: true

    domain_adversarial: 0
    domain_adversarial_weight: 0.1
    num_domains: 0

experiments:
  # =========================================================================
  # G1: F5 + strong jitter — E10的核心策略迁移到F5
  # 测试: 强 jitter (E10的关键) 对 frozen DINOv2 backbone 的影响
  # 对照: V28-F5 (BEST=0.296° MEDW400, light jitter)
  # =========================================================================
  - name: "v29_G1_frozen_dinov2_strong_jitter_quick"
    description: "G1: F5 + strong jitter (prob=0.7, sigma=3.0)"
    dataset: "all"
    version: "v29_G1_frozen_dinov2_strong_jitter_quick"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_lr_scale: 0.0
      drop_path_rate: 0.0
      augment_mount_jitter_prob: 0.7
      augment_mount_jitter_rot_sigma: 3.0

  # =========================================================================
  # G2: F5 + strong jitter + DANN — 域对抗 + 冻结 backbone
  # 测试: DANN 梯度只影响 Query-BEV head, 是否有助于降低残余偏差
  # 对照: G1 (不含DANN)
  # =========================================================================
  - name: "v29_G2_frozen_dinov2_jitter_dann_quick"
    description: "G2: F5 + strong jitter + DANN (weight=0.15)"
    dataset: "all"
    version: "v29_G2_frozen_dinov2_jitter_dann_quick"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_lr_scale: 0.0
      drop_path_rate: 0.0
      augment_mount_jitter_prob: 0.7
      augment_mount_jitter_rot_sigma: 3.0
      domain_adversarial: 1
      domain_adversarial_weight: 0.15

  # =========================================================================
  # G3: 部分解冻 DINOv2 (last 2 layers) + strong jitter
  # 测试: 解冻最后2层能否在保留域不变性的同时提升任务精度
  # 对照: G1 (全冻结), V28-F3 (全解冻, BEST=1.288°)
  # =========================================================================
  - name: "v29_G3_partial_unfreeze_dinov2_quick"
    description: "G3: partial unfreeze DINOv2 (last2) + strong jitter"
    dataset: "all"
    version: "v29_G3_partial_unfreeze_dinov2_quick"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_freeze_layers: "0:-2"
      backbone_lr_scale: 0.01
      drop_path_rate: 0.1
      head_dropout: 0.2
      augment_mount_jitter_prob: 0.7
      augment_mount_jitter_rot_sigma: 3.0

  # =========================================================================
  # G4: E10 + Query-BEV (替换 LSS, 保持 Swin backbone + DANN)
  # 测试: 同时获得 Query-BEV 的无深度偏差 + E10 的域对抗优势
  # 对照: V27-E10 (BEST=0.321° LSS+Swin), V28-F1 (BEST=0.408° Query+Swin)
  # =========================================================================
  - name: "v29_G4_e10_query_bev_quick"
    description: "G4: E10 + Query-BEV (replace LSS, keep Swin + DANN)"
    dataset: "all"
    version: "v29_G4_e10_query_bev_quick"
    params:
      cam2bev_mode: "query"
      augment_mount_jitter_prob: 0.7
      augment_mount_jitter_rot_sigma: 3.0
      drop_path_rate: 0.2
      head_dropout: 0.3
      domain_adversarial: 1
      domain_adversarial_weight: 0.15
