# V30 Optimized Quick (1 node): dinov2-small 消融实验
#
# 决策依据:
#   dinov2-base backbone 大 3.9x (86.6M vs 22.1M), 泛化仅好 5.4%
#   无 DANN 时 base (0.107°) 比 small (0.092°) 差 16% (过拟合)
#   800 帧评估确认: G3-small (0.103°) 持续优于 H8-base (0.110°)
#   结论: dinov2-small 是部署最佳选择, 淘汰 dinov2-base
#
# 实验 (3组):
#   G3:       dinov2-small + unfreeze2              — 部署首选 (V29-G3 配方)
#   G3-DANN:  dinov2-small + unfreeze2 + DANN       — DANN 效果验证
#   G3-10deg: dinov2-small + unfreeze2 + 10° 扰动   — 大扰动消融
#
# Usage:
#   bash batch_train.sh configs/batch8_train_all_v30_opt_quick.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 3
  retry_delay: 30

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1

  params:
    angle_range_deg: 5
    trans_range: 0.15

    batch_size: 16
    learning_rate: 1e-4

    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    node_rank: null
    master_addr: null
    master_port: null
    ddp_auto_scale: 0

    use_compile: false
    no_amp: 1
    rotation_only: true

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.0,1.0,1.0"
    use_balanced_axis_loss: 1

    use_mlp_head: 0
    use_geodesic_loss: 0

    drop_path_rate: 0.15
    head_dropout: 0.15

    lr_schedule: step
    warmup_epochs: 5
    backbone_lr_scale: 0.3
    backbone_warmup_epochs: 10
    layer_wise_lr_decay: 0.65
    step_size: 80

    use_pitch_branch: 0
    pitch_aux_weight: 0.0
    bev_instance_norm: 0
    use_contrastive_extrinsic: 0
    contrastive_weight: 0.0

    augment_mount_jitter_prob: 0.15
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.01

    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    per_axis_weights: null

    augment_pitch_sign_flip_prob: 0.15
    augment_pitch_flip_prob: 0.20
    augment_pitch_flip_max_deg: 3.0
    augment_color_jitter: 0.15
    augment_pc_jitter: 0.02
    augment_pc_dropout: 0.05
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0

    pose_aware_sampling: true

    max_frames_per_seq: 500
    num_epochs: 400
    save_ckpt_per_epoches: 50

    early_stopping_patience: 30
    eval_epoches: 50

    seed: 42
    grad_accum_steps: 1

    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"

    fuser_type: "diff"
    cam_drop_prob: 0.0
    cam_drop_mode: "zero"

    foreground: true

    domain_adversarial: 0
    domain_adversarial_weight: 0.1
    num_domains: 0

experiments:
  # =========================================================================
  # G3-full: dinov2-small + unfreeze2 — V29-G3 配方 (部署首选)
  # Quick BEST (V29-G3): 0.092° (MEDW400)
  # 目标: 确认 G3 配方在 V30 参数体系下的表现
  # =========================================================================
  - name: "v30_opt_G3_dinov2small_quick"
    description: "G3-full: dinov2-small + unfreeze2 + strong jitter (deploy candidate)"
    dataset: "all"
    version: "v30_opt_G3_dinov2small_quick"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_freeze_layers: "0:-2"
      backbone_lr_scale: 0.01
      drop_path_rate: 0.1
      head_dropout: 0.2
      augment_mount_jitter_prob: 0.7
      augment_mount_jitter_rot_sigma: 3.0

  # =========================================================================
  # G3-DANN: dinov2-small + unfreeze2 + DANN — 填补关键缺失数据
  # 目标: DANN 对 dinov2-small + unfreeze2 是否也有效 (目前只有 frozen 数据)
  # 对比 H8: 隔离 backbone size 效果 (base vs small, 都有 DANN)
  # =========================================================================
  - name: "v30_opt_G3_dinov2small_dann_quick"
    description: "G3-DANN: dinov2-small + unfreeze2 + DANN (ablation)"
    dataset: "all"
    version: "v30_opt_G3_dinov2small_dann_quick"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_freeze_layers: "0:-2"
      backbone_lr_scale: 0.01
      drop_path_rate: 0.1
      head_dropout: 0.2
      augment_mount_jitter_prob: 0.7
      augment_mount_jitter_rot_sigma: 3.0
      domain_adversarial: 1
      domain_adversarial_weight: 0.15

  # =========================================================================
  # G3-10deg: dinov2-small + unfreeze2 + angle_range=10° — 大扰动消融
  # 假设: 10° 训练 → 5° 评估时预测更鲁棒
  # 验证: 单帧精度上限 (~2.25°) 是否因更大训练范围而降低
  # =========================================================================
  - name: "v30_opt_G3_dinov2small_10deg_quick"
    description: "G3-10deg: dinov2-small + unfreeze2 + 10deg perturbation"
    dataset: "all"
    version: "v30_opt_G3_dinov2small_10deg_quick"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_freeze_layers: "0:-2"
      backbone_lr_scale: 0.01
      drop_path_rate: 0.1
      head_dropout: 0.2
      augment_mount_jitter_prob: 0.7
      augment_mount_jitter_rot_sigma: 3.0
      angle_range_deg: 10
