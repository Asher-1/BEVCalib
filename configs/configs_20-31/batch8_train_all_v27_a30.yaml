# V27: Vehicle-agnostic calibration — domain-gap mitigation experiment matrix
#
# Root-cause context (RCA summary):
#   - V24-B baseline: ~0.678° total rotation error on test (~0.52° Pitch); best generalization seen.
#   - V25r stack (MLP head, Pitch 5× weight, BEV InstanceNorm, contrastive extrinsic) hurt
#     generalization: memorizes installation-specific cues instead of universal geometry.
#   - Train data already spans 21 sequences / 15+ mounts; gap is domain shift, not coverage.
#   - Same-vehicle test (e.g. Seq 09) reaches ~0.061° Pitch → capacity is fine; objective/aug must
#     discourage vehicle-specific shortcuts.
#
# Design principles (this file):
#   1. Architectural baseline = proven V24-B generalization: fuser_type=diff, Linear head
#      (use_mlp_head=0).
#   2. Strong mount jitter when enabled: prob=0.5, rot_sigma=2.0° (simulate diverse rigid installs).
#   3. BalancedAxisLoss experiments: enable_axis_loss=true, use_balanced_axis_loss=1,
#      axis_weights=1.0,1.0,1.0 — avoids Pitch-heavy loss that paired with V25r MLP hurt OOD Pitch.
#   4. Strong regularization where noted: drop_path_rate=0.2, head_dropout=0.3 — fights backbone/head
#      memorization when combined with domain-style augmentation.
#   5. Explicitly OFF (V25r overfitting suspects): use_pitch_branch=0, bev_instance_norm=0,
#      use_contrastive_extrinsic=0.
#   6. Conservative backbone LR: backbone_lr_scale=0.5 — slows ViT/feature overfitting to train IDs.
#
# Eight experiments isolate: pure V24-B reproduction → balanced loss → mount jitter → combine →
# regularization → extra aug → stronger jitter → Z-resolution (Z=10) on the strongest recipe base.
#
# Usage:
#   bash batch_train.sh configs/batch8_train_all_v27.yaml
#   bash batch_train.sh --dry-run configs/batch8_train_all_v27.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 3
  retry_delay: 30

defaults:
  env:
    # Z=5 coarse BEV (BEV_ZBOUND_STEP=4.0); E8 overrides to Z=10 (step 2.0), matching prior batch configs.
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1

  params:
    angle_range_deg: 5
    trans_range: 0.15

    batch_size: 8
    learning_rate: 1e-4

    use_ddp: true
    ddp_gpus: 8
    nnodes: 32
    node_rank: null
    master_addr: null
    master_port: null
    ddp_auto_scale: 0

    use_compile: false
    no_amp: 1
    rotation_only: true

    # --- Loss (axis loss on; balanced loss toggled per experiment E1 vs E2+) ---
    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.0,1.0,1.0"
    use_balanced_axis_loss: 0

    use_mlp_head: 0
    use_geodesic_loss: 0

    # Mild regularization for E1–E4 (closer to historical V24-B-style training); E5+ override.
    drop_path_rate: 0.1
    head_dropout: 0.1

    lr_schedule: step
    warmup_epochs: 5
    backbone_lr_scale: 0.5
    backbone_warmup_epochs: 10
    layer_wise_lr_decay: 0.65
    step_size: 80

    use_pitch_branch: 0
    pitch_aux_weight: 0.0
    bev_instance_norm: 0
    use_contrastive_extrinsic: 0
    contrastive_weight: 0.0

    # Mount jitter: sigma chosen for when prob>0; E1/E2 keep prob=0 (no jitter).
    augment_mount_jitter_prob: 0.0
    augment_mount_jitter_rot_sigma: 2.0
    augment_mount_jitter_trans_sigma: 0.01

    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    per_axis_weights: null

    augment_pitch_sign_flip_prob: 0.15
    augment_pitch_flip_prob: 0.20
    augment_pitch_flip_max_deg: 3.0
    augment_color_jitter: 0.15
    augment_pc_jitter: 0.02
    augment_pc_dropout: 0.05
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0

    pose_aware_sampling: true
    max_frames_per_seq: 10000
    num_epochs: 400
    save_ckpt_per_epoches: 50

    early_stopping_patience: 30
    seed: 42

    eval_epoches: 50
    grad_accum_steps: 1

    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"

    fuser_type: "diff"
    cam_drop_prob: 0.0
    cam_drop_mode: "zero"

    foreground: true
    no_tensorboard: true
    tensorboard_port: null

    domain_adversarial: 0
    domain_adversarial_weight: 0.1
    num_domains: 0

experiments:
  # ===================== 优先级: 最关键实验优先训练 =====================
  #
  # 训练顺序策略:
  #   1. E5 — 核心recipe (balanced + jitter + 强正则)，最可能超越V24-B的非DANN方案
  #   2. E9 — E5 + DANN，隔离域对抗训练的独立贡献
  #   3. E10 — 最强组合 (强jitter + DANN)，理论最优
  #   4. E1 — V24-B基线复现，用于对比
  #   5-10 — 消融实验，按信息量排序

  # =========================================================================
  # [优先1] E5: BalancedAxisLoss + mount jitter + 强正则 — 核心域泛化recipe
  # =========================================================================
  - name: "v27_E5_balanced_mount_strong_reg"
    description: "E5: BalancedAxis + mount jitter(p=0.5 σ=2.0) + drop_path=0.2 head_dropout=0.3"
    dataset: "all"
    version: "v27_E5_balanced_mount_strong_reg"
    params:
      use_balanced_axis_loss: 1
      augment_mount_jitter_prob: 0.5
      augment_mount_jitter_rot_sigma: 2.0
      drop_path_rate: 0.2
      head_dropout: 0.3

  # =========================================================================
  # [优先2] E9: E5 + DANN — 域对抗训练，梯度反转迫使域不变特征
  # =========================================================================
  - name: "v27_E9_dann_balanced_mount_reg"
    description: "E9: E5 + DANN (domain_adversarial=1, weight=0.1)"
    dataset: "all"
    version: "v27_E9_dann_balanced_mount_reg"
    params:
      use_balanced_axis_loss: 1
      augment_mount_jitter_prob: 0.5
      augment_mount_jitter_rot_sigma: 2.0
      drop_path_rate: 0.2
      head_dropout: 0.3
      domain_adversarial: 1
      domain_adversarial_weight: 0.1

  # =========================================================================
  # [优先3] E10: E7 + DANN — 最强jitter + DANN (最大域泛化推力)
  # =========================================================================
  - name: "v27_E10_dann_very_strong_jitter"
    description: "E10: E7 + DANN (prob=0.7 sigma=3.0 + DANN weight=0.15)"
    dataset: "all"
    version: "v27_E10_dann_very_strong_jitter"
    params:
      use_balanced_axis_loss: 1
      augment_mount_jitter_prob: 0.7
      augment_mount_jitter_rot_sigma: 3.0
      drop_path_rate: 0.2
      head_dropout: 0.3
      domain_adversarial: 1
      domain_adversarial_weight: 0.15

  # =========================================================================
  # [优先4] E1: V24-B基线复现 — 验证~0.678°基线
  # =========================================================================
  - name: "v27_E1_v24b_repro"
    description: "E1: V24-B reproduction baseline (no BalancedAxisLoss, no mount jitter)"
    dataset: "all"
    version: "v27_E1_v24b_repro"

  # ===================== 以下为消融实验 =====================

  # =========================================================================
  # E3: V24-B + 仅mount jitter — 隔离jitter的独立贡献
  # =========================================================================
  - name: "v27_E3_strong_mount_jitter_only"
    description: "E3: V24-B + mount jitter prob=0.5 rot_sigma=2.0 (no BalancedAxisLoss)"
    dataset: "all"
    version: "v27_E3_strong_mount_jitter_only"
    params:
      augment_mount_jitter_prob: 0.5
      augment_mount_jitter_rot_sigma: 2.0

  # =========================================================================
  # E4: BalancedAxisLoss + mount jitter (无强正则) — 对比E5看正则化效果
  # =========================================================================
  - name: "v27_E4_balanced_plus_mount"
    description: "E4: BalancedAxisLoss + strong mount jitter (prob=0.5 sigma=2.0)"
    dataset: "all"
    version: "v27_E4_balanced_plus_mount"
    params:
      use_balanced_axis_loss: 1
      augment_mount_jitter_prob: 0.5
      augment_mount_jitter_rot_sigma: 2.0

  # =========================================================================
  # E7: E5 + 超强mount jitter — 对比E10看DANN vs 纯jitter
  # =========================================================================
  - name: "v27_E7_very_strong_mount_jitter"
    description: "E7: E5 + mount jitter prob=0.7 rot_sigma=3.0"
    dataset: "all"
    version: "v27_E7_very_strong_mount_jitter"
    params:
      use_balanced_axis_loss: 1
      augment_mount_jitter_prob: 0.7
      augment_mount_jitter_rot_sigma: 3.0
      drop_path_rate: 0.2
      head_dropout: 0.3

  # =========================================================================
  # E2: 仅BalancedAxisLoss — 隔离loss的独立贡献
  # =========================================================================
  - name: "v27_E2_balanced_axis_only"
    description: "E2: V24-B + BalancedAxisLoss only (axis_weights 1,1,1)"
    dataset: "all"
    version: "v27_E2_balanced_axis_only"
    params:
      use_balanced_axis_loss: 1

  # =========================================================================
  # E6: E5 + 额外数据增强 — 测试传感器增强对域泛化的效果
  # =========================================================================
  - name: "v27_E6_extra_augmentation"
    description: "E6: E5 + color_jitter=0.3 pc_jitter=0.05"
    dataset: "all"
    version: "v27_E6_extra_augmentation"
    params:
      use_balanced_axis_loss: 1
      augment_mount_jitter_prob: 0.5
      augment_mount_jitter_rot_sigma: 2.0
      drop_path_rate: 0.2
      head_dropout: 0.3
      augment_color_jitter: 0.3
      augment_pc_jitter: 0.05

  # =========================================================================
  # E8: E5 + Z=10 — 测试Z分辨率对域泛化的影响
  # =========================================================================
  - name: "v27_E8_z10_balanced_mount_reg"
    description: "E8: Same as E5 with Z=10 (BEV_ZBOUND_STEP=2.0)"
    dataset: "all"
    version: "v27_E8_z10_balanced_mount_reg"
    env:
      BEV_ZBOUND_STEP: 2.0
    params:
      use_balanced_axis_loss: 1
      augment_mount_jitter_prob: 0.5
      augment_mount_jitter_rot_sigma: 2.0
      drop_path_rate: 0.2
      head_dropout: 0.3

# =============================================================================
# Quick comparison matrix
# =============================================================================
#
# | Exp | BalancedAxis | Mount jitter      | drop_path / head_do | DANN    | Extra              | Z   |
# |-----|--------------|-------------------|-----------------------|---------|--------------------|-----|
# | E1  | off          | off               | 0.1 / 0.1             | off     | —                  | 5   |
# | E2  | on           | off               | 0.1 / 0.1             | off     | —                  | 5   |
# | E3  | off          | p=0.5 σ=2.0       | 0.1 / 0.1             | off     | —                  | 5   |
# | E4  | on           | p=0.5 σ=2.0       | 0.1 / 0.1             | off     | —                  | 5   |
# | E5  | on           | p=0.5 σ=2.0       | 0.2 / 0.3             | off     | —                  | 5   |
# | E6  | on           | p=0.5 σ=2.0       | 0.2 / 0.3             | off     | color/pc aug ↑     | 5   |
# | E7  | on           | p=0.7 σ=3.0       | 0.2 / 0.3             | off     | —                  | 5   |
# | E8  | on           | p=0.5 σ=2.0       | 0.2 / 0.3             | off     | —                  | 10  |
# | E9  | on           | p=0.5 σ=2.0       | 0.2 / 0.3             | w=0.10  | —                  | 5   |
# | E10 | on           | p=0.7 σ=3.0       | 0.2 / 0.3             | w=0.15  | —                  | 5   |
#
# Readouts:
#   E1 vs E2       → balanced loss alone
#   E1 vs E3       → mount jitter alone (same standard axis loss as V24-B track)
#   E3 vs E4       → adding balanced loss on top of jitter
#   E4 vs E5       → regularization under jitter+balanced
#   E5 vs E6       → sensory augmentation on top of E5
#   E5 vs E7       → jitter strength at fixed reg
#   E5 vs E8       → vertical resolution at fixed recipe
#   E5 vs E9       → DANN on top of E5 (domain invariance via gradient reversal)
#   E7 vs E10      → DANN on top of strongest jitter (maximum domain invariance)
