# V30 Quick 泛化评估: dinov2-base backbone (单机训练, 9组 + 2基线)
# 模型参数由 evaluate_checkpoint.py 从 checkpoint 自动检测
# 注意: H5, H6, H7 尚未训练，评估时会自动跳过
#
# 用法:
#   python run_generalization_eval.py --config configs/eval_generalization_v30_quick.yaml --parallel -1

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data/v30_quick"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_v2"
output_dir: "logs/evaluations/generalization_eval_v30_quick"

eval_params:
  angle_range: 5.0
  trans_range: 0.15
  batch_size: 16
  vis_interval: 200
  timeout: 7200
  eval_max_frames_per_seq: 400

models:
