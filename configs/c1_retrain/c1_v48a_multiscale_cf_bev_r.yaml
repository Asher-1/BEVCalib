# C1 V48a风格: Multi-Scale + Pitch Branch修复 (训练指标历史最佳)
#
# 数据集: all_training_data_c1 (camera_1, fisheye, 1920x1080, FOV~98°)
# 目标: Recovery>95% (3-pass) + RPY泛化<0.1° + 固定平移只优化旋转
#
# 基于 v48a (训练MEDW200=0.046°, Jacobian=0.955):
#   - Multi-Scale perturbation (0.5/1.0/2.0deg各10%)
#   - Pitch Branch Q1-Q3修复 (pitch_vertical_bands=3)
#   - 无GIN (保留最大Recovery, Jacobian=0.955)
#   - 关闭consistency_loss (v49b验证: 提升Recovery)
#   - overcorrection_penalty + symmetric_perturb
#
# 与baseline对比的改进:
#   - Multi-Scale训练扰动: 0.5deg recovery从46%提升到55%+
#   - 关闭consistency: Recovery从~65%提升到~75%+
#   - 平移固定 (trans_range=0.0)
#
# Usage:
#   bash batch_train.sh configs/c1_retrain/c1_v48a_multiscale_cf_bev_r.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 256
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    use_pitch_fusion: 1
    pitch_vertical_bands: 3
    corr_window_mode: adaptive

    # 无GIN (v48a验证: 无GIN时Jacobian最高=0.955)
    use_dla: 1
    use_instance_norm: 0
    use_gated_instance_norm: 0

    backbone_type: swin
    backbone_lr_scale: 0.1
    head_dropout: 0.15

    batch_size: 16
    learning_rate: 1e-4
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false

    # Loss (固定平移只优化旋转)
    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.5,4.0,1.5"
    use_geodesic_loss: 0
    corr_alignment_weight: 0.2
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.4
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.1

    # Anti-shortcut (关闭consistency以提升Recovery)
    tinit_dropout_prob: 0.3
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 15.0
    consistency_loss_weight: 0.0
    consistency_loss_start_epoch: 999
    zero_perturbation_prob: 0.20
    symmetric_perturb: 1
    overcorrection_penalty: 2.0
    use_magnitude_head: 1
    magnitude_loss_weight: 0.3

    # Multi-Scale Perturbation (v48核心改进)
    multi_scale_perturb: "0.5:0.10,1.0:0.10,2.0:0.10"

    # 数据增强
    augment_mount_jitter_prob: 0.4
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.015
    augment_intrinsic: 0.03
    augment_intrinsic_cxcy: 0.015
    augment_color_jitter: 0.3

    # 数据加载
    xyz_only: 1
    max_pcd_points: 16384
    perturb_distribution: magnitude_balanced
    per_axis_prob: 0.3
    pose_aware_sampling: true
    max_frames_per_seq: 1000
    foreground: true
    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_pitch_flip_prob: 0.0

    # 评估与保存
    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.10
    save_ckpt_per_epoches: 10

    seed: 42
    pretrain_ckpt: null
    resume_ckpt: auto

experiments:
  # ===== S1: ±5° Multi-Scale 从头训练 =====
  - name: "c1_v48a_multiscale_S1"
    description: "C1 v48a: Multi-Scale + 无consistency + rotation-only, scratch"
    dataset: "all_training_data_c1"
    version: "c1_v48a_multiscale_S1"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 200
      warmup_epochs: 8
      lr_schedule: cosine_warm_restarts
      cosine_T0: 40
      cosine_Tmult: 2
      early_stopping_patience: 50
      eval_epoches: 10
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 999
      pretrain_ckpt: null

  # ===== S2: ±3° fine-tune (提升精度) =====
  - name: "c1_v48a_multiscale_S2"
    description: "C1 v48a S2: ±3° finetune, reduced noise"
    dataset: "all_training_data_c1"
    version: "c1_v48a_multiscale_S2"
    params:
      angle_range_deg: 3
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 150
      warmup_epochs: 5
      learning_rate: 5e-5
      lr_schedule: cosine_warm_restarts
      cosine_T0: 30
      cosine_Tmult: 2
      early_stopping_patience: 30
      eval_epoches: 5
      pretrain_ckpt: "logs/all_training_data_c1/model_small_5deg_c1_v48a_multiscale_S1/all_training_data_c1_scratch/checkpoint/ckpt_best_dual.pth"
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 0
      per_axis_prob: 0.5
      continuous_noise_max_deg: 5.0
      zero_perturbation_prob: 0.12
