# V70.1 泛化评估配置
# 部署目标: Genuine Recovery(iter3) >= 95% + ZD < 0.30° + MEDW400 < 0.25°
#
# Usage (推荐 — 每序列400帧 + 多卡并行主评估, ~2h):
#   python run_generalization_eval.py --config configs/c1_retrain/eval_generalization_c1_v70.1.yaml --parallel -1 --generalization_diag --cf_bev_r_iter_steps 3 --eval_max_frames_per_seq 400
# 补跑 gdiag (主评估已有, 串行 ~4h/模型):
#   bash tools/run_v70.1_gdiag_retry.sh
# 或: python run_generalization_eval.py --config ... --gdiag_only --parallel 1 --generalization_diag --cf_bev_r_iter_steps 3 --eval_max_frames_per_seq 400

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data_c1"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_c1"
output_dir: "logs/evaluations/generalization_c1_v70.1"
eval_script: "evaluate_checkpoint.py"

eval_params:
  angle_range: 5.0
  trans_range: 0.0
  batch_size: 8
  vis_interval: 99999
  timeout: 14400
  eval_max_frames_per_seq: 400
  shortcut_diag: false
  generalization_diag: true
  gdiag_inject_deg: 2.0
  cf_bev_r_iter_steps: 3

models:
  - label: "c1-v70.1-S4Z-best-dual-iter3"
    dir_name: "model_small_5deg_c1_v70.1_corr_domain_S4Z"
    ckpt: "ckpt_best_dual.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    cf_bev_r_iter_steps: 3
    mode_desc: "V70.1 S4Z dual gate (deploy primary)"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540

  - label: "c1-v70.1-S4Z-best-recovery-iter3"
    dir_name: "model_small_5deg_c1_v70.1_corr_domain_S4Z"
    ckpt: "ckpt_best_recovery.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    cf_bev_r_iter_steps: 3
    mode_desc: "V70.1 S4Z recovery gate (inject path)"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540

  - label: "c1-v70.1-S4Z-best-zd-iter0"
    dir_name: "model_small_5deg_c1_v70.1_corr_domain_S4Z"
    ckpt: "ckpt_best_zd.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    cf_bev_r_iter_steps: 0
    mode_desc: "V70.1 S4Z ZD gate (zero-drift path)"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540

  - label: "c1-v70.1-S4R-best-dual-iter3"
    dir_name: "model_small_5deg_c1_v70.1_corr_domain_S4R"
    ckpt: "ckpt_best_dual.pth"
    bev_zbound_step: "4.0"
