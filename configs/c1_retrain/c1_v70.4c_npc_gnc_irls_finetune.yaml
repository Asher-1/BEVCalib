# V70.4c: Full classical GNC-GM fidelity (P1) on top of V70.4b NPC-aligned formula.
#
# Delta vs V70.4b:
#   - gnc_use_irls: 1          → NPC GNC_GM_weight * r^2 (corrector-weighted LS)
#   - gnc_mu_adaptive_init: 1  → mu0 = min(2*max(r_init^2)/c, cap) per batch
#   - gnc_schedule: npc_factor → mu /= gnc_factor each epoch (NPC outer loop)
#   - gnc_mu_end: 1.0          → NPC stop criterion (mu < 1)
#
# NOT in scope (requires separate V70.5 research track):
#   - NPC PPO predictor-corrector policy (RL adaptive step/tol)
#   - Multi-iteration GN inner corrector at train/inference time
#
# Launch:
#   bash batch_train.sh configs/c1_retrain/c1_v70.4c_npc_gnc_irls_finetune.yaml
#
# Eval:
#   python run_generalization_eval.py \
#     --config configs/c1_retrain/eval_generalization_c1_v70.4c.yaml \
#     --parallel -1 --eval_max_frames_per_seq 400

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180

  params:
    fusion_backend: paper_explicit_bev
    rotation_only: true
    target_width: 960
    target_height: 540
    backbone_lr_scale: 0.2
    head_dropout: 0.1
    paper_feat_dim: 128
    paper_n_groups: 256
    paper_knn: 8
    paper_sim_layers: 3
    paper_depth_bins: 16

    batch_size: 8
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    no_amp: 1
    optimizer: adam
    wd: 0.0
    use_compile: false

    val_split_mode: group
    val_holdout_ratio: 0.2
    val_holdout_sequences: "03,07,11,20,22"

    enable_axis_loss: false
    weight_axis_rotation: 0.0
    axis_weights: "2.0,1.0,2.0"
    use_geodesic_loss: 0
    quat_norm_weight: 0.5

    angle_range_deg: 5
    eval_angle_range_deg: 5
    rotation_target_definition: per_axis
    trans_range: 0.0
    symmetric_perturb: 1
    perturb_distribution: uniform
    multi_scale_perturb: "0.5:0.35,1.0:0.25,2.0:0.25,3.0:0.10,5.0:0.05"
    per_axis_prob: 0.5
    per_axis_weights: "2.0,1.0,2.0"

    augment_mount_jitter_prob: 0.7
    augment_mount_jitter_rot_sigma: 4.0
    augment_mount_jitter_trans_sigma: 0.0
    augment_color_jitter: 0.25
    augment_intrinsic: 0.0

    xyz_only: 1
    max_pcd_points: 40960
    max_frames_per_seq: 500
    pose_aware_sampling: true

    zero_perturbation_prob: 0.05
    zero_drift_dedicated_ratio: 0.35
    zero_drift_loss_weight: 0.40
    zero_drift_loss_weight_start: 0.08
    zero_drift_loss_ramp_epochs: 12
    zero_drift_loss_start_epoch: 1
    zero_drift_loss_margin_deg: 0.05

    inject_recovery_loss_weight: 0.50
    inject_recovery_loss_start_epoch: 1
    inject_recovery_magnitude_deg: 2.0
    inject_recovery_dedicated_ratio: 0.25

    # --- V70.4c: classical GNC-GM full fidelity (NPC Environment parity) ---
    enable_gnc_loss: 1
    gnc_noise_bound_deg: 0.05
    gnc_use_irls: 1
    gnc_mu_adaptive_init: 1
    gnc_factor: 1.4
    gnc_mu_cap: 1000000
    gnc_mu_end: 1.0
    gnc_schedule: "npc_factor"
    gnc_start_epoch: 1
    gnc_on_paper_rotation: 1
    gnc_on_inject_recovery: 1
    gnc_axis_weights: "2.0,1.0,2.0"
    # fallback if adaptive init disabled; kept for logging compatibility
    gnc_mu_start_deg: 2.0
    gnc_mu_end_deg: 0.05
    gnc_anneal_epochs: 80

    medw_early_stop_patience: 4
    medw_early_stop_min_delta_deg: 0.005

    enable_medw_eval: 1
    enable_jacobian_eval: 1
    enable_inject_recovery_eval: 1
    inject_recovery_eval_deg: 2.0
    inject_recovery_eval_batches: 0
    jacobian_eval_angle_deg: 2.0
    jacobian_eval_batches: 0
    jacobian_eval_n_probes: 5
    medw_eval_max_frames: 400

    enable_dual_gate_ckpt: 1
    enable_recovery_gate_ckpt: 1
    enable_zd_gate_ckpt: 1
    dual_gate_inject_recovery_min: 95.0
    dual_gate_signed_slope_min: 0.80
    dual_gate_zd_max: 0.10
    dual_gate_jacobian_min: 0.80
    dual_gate_medw_max: 0.10

    data_balance: 1
    use_mgda: 0
    no_tensorboard: true
    enable_vis: 0
    enable_ckpt_eval: 0
    save_ckpt_per_epoches: 20
    seed: 42
    resume_ckpt: auto

experiments:
  - name: "c1_v70.4c_npc_gnc_irls_finetune"
    description: "V70.4c: NPC classical GNC (IRLS + adaptive mu0 + factor schedule)"
    dataset: "all_training_data_c1"
    version: "c1_v70.4c_npc_gnc_irls_finetune"
    params:
      num_epochs: 60
      warmup_epochs: 2
      learning_rate: 1.5e-5
      lr_schedule: cosine_warm_restarts
      cosine_T0: 30
      cosine_Tmult: 2
      early_stopping_patience: 20
      eval_epoches: 5

      pretrain_ckpt: "logs/all_training_data_c1/model_small_5deg_c1_v70.2_fix1_paper_explicit_bev_group_holdout/all_training_data_c1_scratch/checkpoint/ckpt_best_medw.pth"
      pretrain_ckpt_fallback: "logs/all_training_data_c1/model_small_5deg_c1_v70.2_fix1_paper_explicit_bev_group_holdout/all_training_data_c1_scratch/checkpoint/ckpt_best_val.pth"
