# C1 Baseline: v45c 风格 (BEVCalib官方架构baseline)
#
# 数据集: all_training_data_c1 (camera_1, fisheye, 1920x1080, FOV~98°)
# 目标: Recovery>95% (3-pass) + RPY泛化<0.1° + 固定平移只优化旋转
#
# 基于之前排名最佳泛化配置 v45c (GenRec=68.8%, GS=0.532, 3-pass=91%):
#   - cf_n_groups=256 (finer spatial resolution)
#   - 无GIN (保留最大Recovery能力)
#   - DLA + PitchFusion
#   - rotation_only (固定平移)
#
# 新数据优势:
#   - camera_1 水平FOV=97.7° vs 旧长焦15.2° → 6.4x更宽
#   - 点云利用率从~10%提升到~85%
#   - Roll角观测性极大增强
#   - 更多有效训练样本
#
# Usage:
#   bash batch_train.sh configs/c1_retrain/c1_baseline_v45c_cf_bev_r.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    # 网络结构 (BEVCalib 官方 CF-BEV-R baseline)
    cf_feat_dim: 256
    cf_n_groups: 256
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    corr_window_mode: adaptive

    # v45c: DLA + PitchFusion, 无 InstanceNorm/GIN
    use_dla: 1
    use_pitch_fusion: 1
    use_instance_norm: 0
    use_gated_instance_norm: 0

    backbone_type: swin
    backbone_lr_scale: 0.1
    head_dropout: 0.15

    batch_size: 16
    learning_rate: 1e-4
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false

    # Loss: 固定平移只优化旋转
    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.5,4.0,1.5"
    use_geodesic_loss: 0
    corr_alignment_weight: 0.2
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.4
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.1

    # Anti-shortcut
    tinit_dropout_prob: 0.3
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 15.0
    consistency_loss_weight: 0.5
    consistency_loss_start_epoch: 10
    zero_perturbation_prob: 0.15

    # 数据增强
    augment_mount_jitter_prob: 0.4
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.015
    augment_intrinsic: 0.03
    augment_intrinsic_cxcy: 0.015
    augment_color_jitter: 0.3

    # 数据加载
    xyz_only: 1
    max_pcd_points: 16384
    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    pose_aware_sampling: true
    max_frames_per_seq: 1000
    foreground: true
    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_pitch_flip_prob: 0.0

    # 评估与保存
    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.10
    save_ckpt_per_epoches: 10

    seed: 42
    pretrain_ckpt: null
    resume_ckpt: auto

experiments:
  # ===== S1: ±5° 从头训练 (c1数据 baseline, 已完成 150ep) =====
  - name: "c1_baseline_v45c_S1"
    description: "C1 Baseline v45c S1: ±5° scratch, cf_n_groups=256, rotation-only"
    dataset: "all_training_data_c1"
    version: "c1_baseline_v45c_S1"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 150
      warmup_epochs: 8
      lr_schedule: cosine_warm_restarts
      cosine_T0: 40
      cosine_Tmult: 2
      early_stopping_patience: 50
      eval_epoches: 10
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 999
      zero_perturbation_prob: 0.10
      pretrain_ckpt: null

  # ===== S2: ±3° fine-tune =====
  - name: "c1_baseline_v45c_S2"
    description: "C1 Baseline v45c S2: ±3° finetune from S1"
    dataset: "all_training_data_c1"
    version: "c1_baseline_v45c_S2"
    params:
      angle_range_deg: 3
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 120
      warmup_epochs: 5
      learning_rate: 5e-5
      lr_schedule: cosine_warm_restarts
      cosine_T0: 30
      cosine_Tmult: 2
      early_stopping_patience: 30
      eval_epoches: 5
      pretrain_ckpt: "logs/all_training_data_c1/model_small_5deg_c1_baseline_v45c_S1/all_training_data_c1_scratch/checkpoint/ckpt_best_val.pth"
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 0
      per_axis_prob: 0.5
      continuous_noise_max_deg: 5.0
      zero_perturbation_prob: 0.12
