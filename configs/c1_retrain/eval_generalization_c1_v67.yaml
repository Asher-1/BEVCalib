# V67 泛化评估配置
# 字段格式: label + dir_name + ckpt (模板: eval_generalization_c1_v62.yaml)

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data_c1"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_c1"
output_dir: "logs/evaluations/generalization_c1_v67"
eval_script: "evaluate_checkpoint.py"

eval_params:
  angle_range: 5.0
  trans_range: 0.0
  batch_size: 8
  vis_interval: 200
  timeout: 7200
  shortcut_diag: false
  generalization_diag: true

models:
  # V67: 迭代监督 + 域增强 + V62 warm-start (200ep)
  - label: "c1-v67-iter-domain-S1-best-dual"
    dir_name: "model_small_5deg_c1_v67_iterative_domain_S1"
    ckpt: "ckpt_best_dual.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V67 Iterative+Domain (best-dual)"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540

  - label: "c1-v67-iter-domain-S1-best-medw"
    dir_name: "model_small_5deg_c1_v67_iterative_domain_S1"
    ckpt: "ckpt_best_medw.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V67 Iterative+Domain (best-medw)"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540

  - label: "c1-v67-iter-domain-S1-last"
    dir_name: "model_small_5deg_c1_v67_iterative_domain_S1"
    ckpt: "ckpt_200.pth"
    ckpt_fallback: ["ckpt_best_dual.pth", "ckpt_best_medw.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V67 Iterative+Domain (last ep200)"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540

  # Baseline: V62 for comparison
  - label: "c1-v62-baseline"
    dir_name: "model_small_5deg_c1_v62_pure_recovery_S1"
    ckpt: "ckpt_best_dual.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V62 baseline (warm-start source)"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540
