# C1 V62: Pure Recovery (追求 Recovery>95%, 不添加 Zero-Drift Loss)
#
# 数据集: all_training_data_c1 (camera_1, fisheye, 1920x1080, FOV~98°)
# 目标: Genuine Recovery > 95%, 暂不约束 ZeroDrift
#
# ========================================================================
# 设计思路
# ========================================================================
#
# 核心数据支持:
#   - V60 原版(640×360): Recovery=79%, 但无 ZD 约束
#   - V48a HiRes(960×540): Recovery=72% (V48a架构)
#   - 高分辨率 Recovery 相对提升 +44% (V48a 640→960)
#   - V61: Recovery=22.7% — 因 zero_drift_loss=0.5 抑制了矫正输出
#
# V62 策略: "纯矫正力" — 不加任何 Zero-Drift 约束
#   1. 960×540 高分辨率 (0.1° ≈ 0.73px, 可检测)
#   2. sim_loss_weight=2.5 (论文级强对应关系监督, 比V61更强)
#   3. sim_n_layers=3 (论文对齐)
#   4. zero_perturbation_prob=0.05 (仅极少零扰动, 不干扰学习)
#   5. 无 zero_drift_loss (核心差异!)
#   6. overcorrection_penalty=0.5 (大幅降低, 允许模型充分矫正)
#   7. 250 epochs 充分训练
#   8. continuous_noise_max_deg=5.0 (减少噪声, 让输入更"真实")
#
# 预期: 高分辨率 + 强sim_loss + 无ZD约束 → Recovery > 90%
# 风险: ZeroDrift 可能较高 (>0.3°), 后续可通过后处理或轻微约束解决
#
# Usage:
#   bash batch_train.sh configs/c1_retrain/c1_v62_pure_recovery_cf_bev_r.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    # === 网络结构 (V48a 最优基座) ===
    cf_feat_dim: 256
    cf_n_groups: 256
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    corr_window_mode: adaptive

    # DLA + Pitch Branch
    use_dla: 1
    use_pitch_fusion: 1
    use_instance_norm: 0
    use_gated_instance_norm: 0

    # === V62: 最强 Similarity Loss (追求极致矫正) ===
    use_sim_loss: 1
    sim_loss_weight: 2.5
    sim_loss_warmup: 5
    sim_loss_soft_radius: 0.0
    sim_n_layers: 3
    use_registry_token: 1
    use_fov_cls_loss: 1
    fov_cls_weight: 0.5
    use_3d_pos_encoding: 1
    pos_enc_depth_bins: 16
    use_coarse_refine: 0
    coarse_refine_detach_epoch: 30

    # === 高分辨率输入 (960×540) ===
    target_width: 960
    target_height: 540

    # === 训练参数 ===
    backbone_type: swin
    backbone_lr_scale: 0.1
    head_dropout: 0.1

    batch_size: 8
    learning_rate: 1e-4
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false

    # Loss
    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.5,4.0,1.5"
    use_geodesic_loss: 0
    corr_alignment_weight: 0.3
    corr_alignment_warmup: 10
    pitch_aux_weight: 0.3
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.0
    consistency_loss_weight: 0.0
    consistency_loss_start_epoch: 999

    # Multi-Scale Perturbation
    multi_scale_perturb: "0.5:0.10,1.0:0.10,2.0:0.10"
    symmetric_perturb: 1

    # === V62: 无 Zero-Drift 约束 (追求纯矫正力) ===
    zero_perturbation_prob: 0.05
    zero_drift_loss_weight: 0.0
    zero_drift_loss_start_epoch: 999
    zero_drift_loss_ramp_epochs: 1
    zero_drift_loss_weight_start: 0.0

    # Anti-shortcut (大幅降低, 允许充分矫正)
    tinit_dropout_prob: 0.3
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 5.0
    overcorrection_penalty: 0.5

    # Augmentation
    augment_mount_jitter_prob: 0.3
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.01
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0
    augment_color_jitter: 0.15

    # Data loading
    xyz_only: 1
    max_pcd_points: 16384
    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    pose_aware_sampling: true
    max_frames_per_seq: 500
    foreground: true
    pitch_vertical_bands: 3

    # Eval & save
    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.10
    save_ckpt_per_epoches: 10

    seed: 42
    pretrain_ckpt: null
    resume_ckpt: auto

experiments:
  # ===== S1: ±5° 纯矫正力训练 =====
  - name: "c1_v62_pure_recovery_S1"
    description: "C1 V62: HiRes960 + SimLoss2.5(3L) + No-ZD + low-OC"
    dataset: "all_training_data_c1"
    version: "c1_v62_pure_recovery_S1"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 250
      warmup_epochs: 10
      lr_schedule: cosine_warm_restarts
      cosine_T0: 50
      cosine_Tmult: 2
      early_stopping_patience: 60
      eval_epoches: 10
      rocr_detach_epochs: 999
      pretrain_ckpt: null

  # ===== S2: ±3° fine-tune =====
  - name: "c1_v62_pure_recovery_S2"
    description: "C1 V62 S2: ±3° finetune, pure recovery"
    dataset: "all_training_data_c1"
    version: "c1_v62_pure_recovery_S2"
    params:
      angle_range_deg: 3
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 120
      warmup_epochs: 5
      learning_rate: 5e-5
      lr_schedule: cosine_warm_restarts
      cosine_T0: 30
      cosine_Tmult: 2
      early_stopping_patience: 30
      eval_epoches: 5
      rocr_detach_epochs: 999
      per_axis_prob: 0.5
      continuous_noise_max_deg: 3.0
      overcorrection_penalty: 0.5
      pretrain_ckpt: "logs/all_training_data_c1/model_small_5deg_c1_v62_pure_recovery_S1/all_training_data_c1_scratch/checkpoint/ckpt_best_val.pth"

  # ===== S3: ±1.5° precision =====
  - name: "c1_v62_pure_recovery_S3"
    description: "C1 V62 S3: ±1.5° precision push"
    dataset: "all_training_data_c1"
    version: "c1_v62_pure_recovery_S3"
    params:
      angle_range_deg: 1.5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 80
      warmup_epochs: 3
      learning_rate: 2e-5
      lr_schedule: cosine_warm_restarts
      early_stopping_patience: 25
      eval_epoches: 3
      rocr_detach_epochs: 999
      per_axis_prob: 0.5
      continuous_noise_max_deg: 2.0
      overcorrection_penalty: 0.3
      pretrain_ckpt: "logs/all_training_data_c1/model_small_3deg_c1_v62_pure_recovery_S2/all_training_data_c1_scratch/checkpoint/ckpt_best_val.pth"

  # ===== S4: ±0.5° micro-precision (追求 95%+ Recovery) =====
  - name: "c1_v62_pure_recovery_S4"
    description: "C1 V62 S4: ±0.5° micro-precision for 95%+ Recovery"
    dataset: "all_training_data_c1"
    version: "c1_v62_pure_recovery_S4"
    params:
      angle_range_deg: 0.5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 60
      warmup_epochs: 2
      learning_rate: 5e-6
      lr_schedule: cosine_warm_restarts
      cosine_T0: 20
      cosine_Tmult: 2
      early_stopping_patience: 20
      eval_epoches: 3
      rocr_detach_epochs: 999
      per_axis_prob: 0.7
      continuous_noise_max_deg: 0.8
      overcorrection_penalty: 0.0
      multi_scale_perturb: "0.1:0.30,0.3:0.30,0.5:0.40"
      pretrain_ckpt: "logs/all_training_data_c1/model_small_1.5deg_c1_v62_pure_recovery_S3/all_training_data_c1_scratch/checkpoint/ckpt_best_val.pth"
