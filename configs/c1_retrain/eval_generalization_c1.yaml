    dir_name: "model_small_5deg_c1_v48a_multiscale_S1"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "C1 V48a S1: Multi-Scale + 无consistency (best-val ep121)"
    pitch_vertical_bands: 3

