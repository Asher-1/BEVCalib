# C1 全量模型泛化评估配置
#
# 评估 all_training_data_c1 上训练的所有模型在 test_data_c1 上的泛化性能
#
# 用法:
#   python run_generalization_eval.py --config configs/c1_retrain/eval_generalization_c1.yaml --parallel -1 --eval_max_frames_per_seq 400
#   python run_generalization_eval.py --config configs/c1_retrain/eval_generalization_c1.yaml --generalization_diag --parallel -1 --eval_max_frames_per_seq 400

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data_c1"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_c1"
output_dir: "logs/evaluations/generalization_c1_all"
eval_script: "evaluate_checkpoint.py"

eval_params:
  angle_range: 5.0
  trans_range: 0.0
  batch_size: 8
  vis_interval: 200
  timeout: 7200
  shortcut_diag: false
  generalization_diag: true

