# V62 关键模型泛化评估 (精简版 - 只评估最有潜力的模型)
# 目标: 快速确定 Recovery 最佳候选

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data_c1"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_c1"
output_dir: "logs/evaluations/generalization_c1_v62"
eval_script: "evaluate_checkpoint.py"

eval_params:
  angle_range: 5.0
  trans_range: 0.0
  batch_size: 8
  vis_interval: 200
  timeout: 7200
  shortcut_diag: false
  generalization_diag: true

models:
  # S1-best-dual: 高 Jacobian=0.97 (强矫正力)
  - label: "c1-v62-S1-best-dual"
    dir_name: "model_small_5deg_c1_v62_pure_recovery_S1"
    ckpt: "ckpt_best_dual.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V62 S1 best-dual (Jac=0.97, MEDW=0.117°)"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540

  # S3-best-dual: 高 Jacobian=0.935 + 最佳 MEDW=0.074°
  - label: "c1-v62-S3-best-dual"
    dir_name: "model_small_1.5deg_c1_v62_pure_recovery_S3"
    ckpt: "ckpt_best_dual.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V62 S3 best-dual (Jac=0.935, MEDW=0.074°)"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540

  # S3-best-val: S3 的 best validation checkpoint
  - label: "c1-v62-S3-best-val"
    dir_name: "model_small_1.5deg_c1_v62_pure_recovery_S3"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V62 S3 best-val"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540

  # S4-best-val: 微精细训练
  - label: "c1-v62-S4-best-val"
    dir_name: "model_small_0.5deg_c1_v62_pure_recovery_S4"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V62 S4 best-val (±0.5° micro-precision)"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540
