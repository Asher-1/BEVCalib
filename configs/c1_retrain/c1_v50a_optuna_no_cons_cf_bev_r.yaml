# C1 V50a风格: Optuna最优超参 + 关闭consistency (Recovery优化)
#
# 数据集: all_training_data_c1 (camera_1, fisheye, 1920x1080, FOV~98°)
# 目标: Recovery>95% (3-pass) + RPY泛化<0.1° + 固定平移只优化旋转
#
# 基于 v50a (Optuna T32搜索最优超参):
#   - 完全关闭consistency loss (根因分析#1: consistency杀Recovery)
#   - Optuna搜索出的最优lr/dropout/axis_weights
#   - magnitude_balanced扰动分布
#   - quat_bias_reset_alpha=0.1 (防止旋转头bias固化)
#   - pitch_vertical_bands=5 (增强垂直空间感知)
#
# Usage:
#   bash batch_train.sh configs/c1_retrain/c1_v50a_optuna_no_cons_cf_bev_r.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    use_pitch_fusion: 1
    pitch_vertical_bands: 5
    corr_window_mode: adaptive

    use_dla: 1
    use_instance_norm: 0
    use_gated_instance_norm: 0
    gin_channels: 0
    gin_gate_reg_weight: 0.0

    backbone_type: swin
    backbone_lr_scale: 0.1
    head_dropout: 0.05
    batch_size: 16
    learning_rate: 4.0e-05
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.5,5.5,1.5"
    use_geodesic_loss: 0
    corr_alignment_weight: 0.2
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.3
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.1

    # 完全关闭consistency (核心: 解除Recovery限制)
    tinit_dropout_prob: 0.5
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 15.0
    consistency_loss_weight: 0.0
    consistency_loss_start_epoch: 999
    zero_perturbation_prob: 0.15
    symmetric_perturb: 1
    overcorrection_penalty: 1.5
    use_magnitude_head: 1
    magnitude_loss_weight: 0.3
    multi_scale_perturb: "0.5:0.20,1.0:0.05,2.0:0.05"
    quat_bias_reset_alpha: 0.1

    augment_mount_jitter_prob: 0.4
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.015
    augment_intrinsic: 0.03
    augment_intrinsic_cxcy: 0.015
    augment_color_jitter: 0.3

    xyz_only: 1
    max_pcd_points: 16384
    perturb_distribution: magnitude_balanced
    per_axis_prob: 0.4
    pose_aware_sampling: true
    max_frames_per_seq: 500
    foreground: true
    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_pitch_flip_prob: 0.0

    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.1
    save_ckpt_per_epoches: 10

    seed: 42
    resume_ckpt: auto

experiments:
  # ===== v50a风格: Optuna超参 + 无consistency =====
  - name: "c1_v50a_optuna_no_cons_S1"
    description: "C1 v50a: Optuna超参 + 无consistency, rotation-only, scratch"
    dataset: "all_training_data_c1"
    version: "c1_v50a_optuna_no_cons_S1"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 150
      warmup_epochs: 6
      lr_schedule: cosine_warm_restarts
      cosine_T0: 40
      cosine_Tmult: 2
      early_stopping_patience: 50
      eval_epoches: 10
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 999
      conditional_consistency_threshold: 0.0
      pretrain_ckpt: null
