# C1 精选模型泛化评估配置
#
# 包含: V48a Hi-Res 960×540, V48a Multi-Scale, V60 Implicit Alignment
#
# 用法:
#   python run_generalization_eval.py --config configs/c1_retrain/eval_generalization_c1_selected.yaml --parallel -1
#   python run_generalization_eval.py --config configs/c1_retrain/eval_generalization_c1_selected.yaml --parallel -1 --generalization_diag

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data_c1"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_c1"
output_dir: "logs/evaluations/generalization_c1_selected"
eval_script: "evaluate_checkpoint.py"

eval_params:
  angle_range: 5.0
  trans_range: 0.0
  batch_size: 8
  vis_interval: 200
  timeout: 7200
  shortcut_diag: false
  generalization_diag: true

models:

  # ========================================================================
  # V48a Hi-Res 960×540 (分辨率提升, 0.1°≈0.73px)
  # ========================================================================

  - label: "c1-v48a-hires-S1-best-val"
    dir_name: "model_small_5deg_c1_v48a_hires_960x540_S1"
    ckpt: "ckpt_best_val.pth"
    ckpt_fallback: ["ckpt_best_medw.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "C1 V48a Hi-Res 960x540 S1 (best-val)"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540

  - label: "c1-v48a-hires-S1-best-medw"
    dir_name: "model_small_5deg_c1_v48a_hires_960x540_S1"
