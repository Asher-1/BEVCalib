# V65 Max Recovery 泛化评估 + V62-S1 对比

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data_c1"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_c1"
output_dir: "logs/evaluations/generalization_c1_v65"
eval_script: "evaluate_checkpoint.py"

eval_params:
  angle_range: 5.0
  trans_range: 0.0
  batch_size: 8
  vis_interval: 200
  timeout: 7200
  shortcut_diag: false
  generalization_diag: true

models:
  # V65 best checkpoints
  - label: "c1-v65-S1-best-val"
    dir_name: "model_small_5deg_c1_v65_max_recovery_S1"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V65 S1: sim=3.5, yaw_w=2.5, 350ep warm-start (best-val)"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540

  - label: "c1-v65-S1-best-medw"
    dir_name: "model_small_5deg_c1_v65_max_recovery_S1"
    ckpt: "ckpt_best_medw.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V65 S1: sim=3.5 (best-medw)"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540

  # V62-S1 对比 baseline (重新评估确保可比性)
  - label: "c1-v62-S1-best-dual"
    dir_name: "model_small_5deg_c1_v62_pure_recovery_S1"
    ckpt: "ckpt_best_dual.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V62 S1 best-dual (baseline, Jac=0.97)"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540
