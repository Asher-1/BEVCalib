# V67: 迭代监督 + 域增强 + V62 warm-start
#
# 目标: inject 3° + 3次迭代 → Recovery > 95% on test_data_c1
#
# ========================================================================
# 设计思路
# ========================================================================
# 
# 核心问题定位:
#   V62 在训练集 Jacobian=0.97 但测试集迭代推理 Recovery 仅 31%
#   原因: domain gap 导致模型在 OOD 场景的校正增益(Jacobian)下降
#   D类trips (00,04,06,11) ZD 小但迭代校正失效
#
# V67 策略: "迭代监督 + 域增强"
#   1. 迭代监督: 训练时做 2 轮迭代 forward，每轮都计算 loss
#      - 让模型学会"对自己的输出继续精细校正"
#      - 解决: 模型只学了 init→GT, 没学 pred→GT (精细校正)
#   2. 域增强: 更激进的 color/style augmentation
#      - 减少训练/测试视觉域差异
#   3. warm-start from V62: 不从零开始，利用 V62 已有能力
#
# 预期: 迭代监督让模型在 OOD 场景也能多轮校正
#
# Usage:
#   bash batch_train.sh configs/c1_retrain/c1_v67_iterative_domain_cf_bev_r.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    # === 网络结构 (CF-BEV-R, same as V62) ===
    cf_feat_dim: 256
    cf_n_groups: 256
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    corr_window_mode: adaptive

    use_dla: 1
    use_pitch_fusion: 1
    use_instance_norm: 0
    use_gated_instance_norm: 0

    # === V67 核心: 迭代监督 ===
    iterative_refine: 2
    iterative_refine_weight: 0.3
    iterative_refine_start_epoch: 5

    # === V67: Jacobian 直接监督 (J→1.0) ===
    jacobian_loss_weight: 0.2
    jacobian_loss_start_epoch: 10
    jacobian_loss_probe_deg: 2.0
    jacobian_loss_interval: 4
    jacobian_loss_axis_weights: "1.0,1.5,1.5"

    # === Similarity Loss (moderate) ===
    use_sim_loss: 1
    sim_loss_weight: 2.5
    sim_loss_warmup: 5
    sim_loss_soft_radius: 0.0
    sim_n_layers: 3
    use_registry_token: 1
    use_fov_cls_loss: 1
    fov_cls_weight: 0.5
    use_3d_pos_encoding: 1
    pos_enc_depth_bins: 16
    use_coarse_refine: 0

    # === 分辨率 ===
    target_width: 960
    target_height: 540

    # === Backbone (SwinT) ===
    backbone_type: swin
    backbone_lr_scale: 0.05
    head_dropout: 0.1

    # === DDP 8卡 ===
    batch_size: 8
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false

    # === 损失函数 ===
    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.5,4.0,2.5"
    use_geodesic_loss: 1
    corr_alignment_weight: 0.3
    corr_alignment_warmup: 10
    pitch_aux_weight: 0.3
    quat_norm_weight: 0.5
    overcorrection_penalty: 0.0

    # === V67: 更强域增强 ===
    augment_color_jitter: 0.4
    augment_mount_jitter_prob: 0.5
    augment_mount_jitter_rot_sigma: 3.0
    augment_mount_jitter_trans_sigma: 0.02

    # === 扰动 (多尺度, 偏向小角度) ===
    multi_scale_perturb: "0.5:0.20,1.0:0.20,2.0:0.25,3.0:0.20,5.0:0.15"
    symmetric_perturb: 1
    per_axis_prob: 0.5
    per_axis_weights: "1.0,1.5,1.5"
    perturb_distribution: uniform
    zero_perturbation_prob: 0.08
    tinit_dropout_prob: 0.3
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 3.0

    # === 数据 ===
    xyz_only: 1
    max_pcd_points: 16384
    max_frames_per_seq: 500
    foreground: true
    pitch_vertical_bands: 3

    # === 评估 & checkpoint ===
    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.93
    dual_gate_medw_max: 0.06
    save_ckpt_per_epoches: 10

    seed: 42
    resume_ckpt: auto

experiments:
  - name: "c1_v67_quick20_S1"
    description: "V67 快速验证: 20ep, 看 Jacobian 是否提升"
    dataset: "all_training_data_c1"
    version: "c1_v67_quick20_S1"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 20
      warmup_epochs: 2
      learning_rate: 5e-5
      lr_schedule: cosine_warm_restarts
      cosine_T0: 10
      cosine_Tmult: 2
      early_stopping_patience: 999
      eval_epoches: 5
      pretrain_ckpt: "logs/all_training_data_c1/model_small_5deg_c1_v62_pure_recovery_S1/all_training_data_c1_scratch/checkpoint/ckpt_best_dual.pth"
