# C1 V8精神: 纯净基座 (最小化改动, 验证网络结构本身能力)
#
# 数据集: all_training_data_c1 (camera_1, fisheye, 1920x1080, FOV~98°)
# 目标: Recovery>95% (3-pass) + RPY泛化<0.1° + 固定平移只优化旋转
#
# V8设计哲学: "最简单的往往最好"
#   原始V8: Linear head + quaternion + StepLR + 无aug = ALL冠军 (泛化0.494°)
#   当时V8的关键发现: 减少tricks,依赖纯粹的网络学习能力
#
# 本配置: CF-BEV-R架构 + V8精神的训练策略
#   - 无GIN, 无InstanceNorm (保持最大扰动敏感性)
#   - 无multi-scale, 无magnitude_head (最纯净)
#   - 无overcorrection, 无symmetric_perturb
#   - Step schedule (V8验证过最稳定)
#   - 适中consistency (V44风格, 保证Recovery真实)
#   - 最少augmentation (仅mount_jitter)
#   - cf_n_groups=128 (原始设置, 不追求更多groups)
#
# Usage:
#   bash batch_train.sh configs/c1_retrain/c1_v8_pure_baseline_cf_bev_r.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    # 网络结构: 最基础的CF-BEV-R
    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    corr_window_mode: adaptive

    # 无任何归一化trick
    use_dla: 1
    use_pitch_fusion: 1
    use_instance_norm: 0
    use_gated_instance_norm: 0

    backbone_type: swin
    backbone_lr_scale: 0.1
    head_dropout: 0.1

    batch_size: 16
    learning_rate: 1e-4
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false

    # Loss: 简洁配置
    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.5,4.0,1.5"
    use_geodesic_loss: 0
    corr_alignment_weight: 0.2
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.3
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.1

    # Anti-shortcut: 标准配置
    tinit_dropout_prob: 0.3
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 15.0
    consistency_loss_weight: 0.5
    consistency_loss_start_epoch: 5
    zero_perturbation_prob: 0.15

    # 最少augmentation (V8精神: 少即是多)
    augment_mount_jitter_prob: 0.3
    augment_mount_jitter_rot_sigma: 1.0
    augment_mount_jitter_trans_sigma: 0.01
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0
    augment_color_jitter: 0.0

    # 数据加载
    xyz_only: 1
    max_pcd_points: 16384
    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    pose_aware_sampling: true
    max_frames_per_seq: 1000
    foreground: true
    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_pitch_flip_prob: 0.0

    # 评估与保存
    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.10
    save_ckpt_per_epoches: 10

    seed: 42
    pretrain_ckpt: null
    resume_ckpt: auto

experiments:
  # ===== S1: ±5° Step Schedule (V8验证过最稳定) =====
  - name: "c1_v8_pure_baseline_S1"
    description: "C1 V8 pure baseline: step schedule, minimal aug, rotation-only"
    dataset: "all_training_data_c1"
    version: "c1_v8_pure_baseline_S1"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 150
      warmup_epochs: 5
      lr_schedule: step
      step_size: 40
      early_stopping_patience: 50
      eval_epoches: 10
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 5
      pretrain_ckpt: null

  # ===== S2: ±3° fine-tune =====
  - name: "c1_v8_pure_baseline_S2"
    description: "C1 V8 pure baseline S2: ±3° finetune"
    dataset: "all_training_data_c1"
    version: "c1_v8_pure_baseline_S2"
    params:
      angle_range_deg: 3
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 100
      warmup_epochs: 3
      learning_rate: 5e-5
      lr_schedule: step
      step_size: 30
      early_stopping_patience: 30
      eval_epoches: 5
      pretrain_ckpt: "logs/all_training_data_c1/model_small_5deg_c1_v8_pure_baseline_S1/all_training_data_c1_scratch/checkpoint/ckpt_best_val.pth"
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 0
      per_axis_prob: 0.5
      continuous_noise_max_deg: 5.0
      zero_perturbation_prob: 0.12
