# V66 DINOv2 泛化评估 + V62 baseline 对比

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data_c1"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_c1"
output_dir: "logs/evaluations/generalization_c1_v66"
eval_script: "evaluate_checkpoint.py"

eval_params:
  angle_range: 5.0
  trans_range: 0.0
  batch_size: 4
  vis_interval: 200
  timeout: 7200
  shortcut_diag: false
  generalization_diag: true

models:
  # V66 DINOv2 best checkpoints
  - label: "c1-v66-dinov2-best-dual"
    dir_name: "model_small_5deg_c1_v66_dinov2_hires_S1"
    ckpt: "ckpt_best_dual.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V66 DINOv2-Small 1280x720 bs12 (best-dual, Ep281)"
    pitch_vertical_bands: 3
    target_width: 1280
    target_height: 720

  - label: "c1-v66-dinov2-best-medw"
    dir_name: "model_small_5deg_c1_v66_dinov2_hires_S1"
    ckpt: "ckpt_best_medw.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V66 DINOv2-Small 1280x720 (best-medw)"
    pitch_vertical_bands: 3
    target_width: 1280
    target_height: 720

  - label: "c1-v66-dinov2-last"
    dir_name: "model_small_5deg_c1_v66_dinov2_hires_S1"
    ckpt: "ckpt_300.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V66 DINOv2-Small 1280x720 (last epoch 300)"
    pitch_vertical_bands: 3
    target_width: 1280
    target_height: 720

  # V62-S1 baseline
  - label: "c1-v62-S1-best-dual"
    dir_name: "model_small_5deg_c1_v62_pure_recovery_S1"
    ckpt: "ckpt_best_dual.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V62 SwinT 960x540 (baseline, Jac=0.97)"
    pitch_vertical_bands: 3
    target_width: 960
    target_height: 540
