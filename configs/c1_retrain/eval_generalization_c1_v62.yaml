  - label: "c1-v62-S4-best-dual"
    dir_name: "model_small_0.5deg_c1_v62_pure_recovery_S4"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_medw.pth", "ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
