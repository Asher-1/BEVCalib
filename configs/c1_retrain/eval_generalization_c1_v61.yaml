# C1 V61 Balanced (Recovery + Zero-Drift) 泛化评估配置
#
# 评估 V61 三阶段模型在 test_data_c1 上的泛化性能
# 对比原 V60 和 V60-ZD 系列, 验证 "平衡" 策略效果
#
# 用法:
#   python run_generalization_eval.py --config configs/c1_retrain/eval_generalization_c1_v61.yaml --parallel -1 --eval_max_frames_per_seq 400

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data_c1"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_c1"
output_dir: "logs/evaluations/generalization_c1_v61"
eval_script: "evaluate_checkpoint.py"

eval_params:
  angle_range: 5.0
  trans_range: 0.0
  batch_size: 8
  vis_interval: 200
  timeout: 7200
  shortcut_diag: false
  generalization_diag: true

models:

  # ========================================================================
  # V61 S1 (±5°, HiRes 960×540 + Balanced)
  # ========================================================================

  - label: "c1-v61-S1-best-val"
    dir_name: "model_small_5deg_c1_v61_balanced_S1"
    ckpt: "ckpt_best_val.pth"
    ckpt_fallback: ["ckpt_best_medw.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "C1 V61 S1: HiRes960+SimLoss2.0(3L)+mild-ZD (best-val)"
    pitch_vertical_bands: 3
    use_sim_loss: 1
    use_registry_token: 1
    use_3d_pos_encoding: 1
    use_fov_cls_loss: 1
    target_width: 960
    target_height: 540

  - label: "c1-v61-S1-best-medw"
    dir_name: "model_small_5deg_c1_v61_balanced_S1"
    ckpt: "ckpt_best_medw.pth"
