# V70.3: ZD + inject-recovery finetune on V70.2 paper Explicit-BEV best-medw.
#
# Goal: close OOD acceptance gap (Genuine Rec >=95%, ZD <=0.10°) without full retrain.
# Warm-start: v70.2 fix1 ckpt_best_medw (ep521).
#
# Launch:
#   bash batch_train.sh configs/c1_retrain/c1_v70.3_zd_recovery_finetune.yaml
#
# Eval after checkpoints exist:
#   python run_generalization_eval.py \
#     --config configs/c1_retrain/eval_generalization_c1_v70.3.yaml \
#     --parallel -1 --eval_max_frames_per_seq 400

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180

  params:
    fusion_backend: paper_explicit_bev
    rotation_only: true
    target_width: 960
    target_height: 540
    backbone_lr_scale: 0.5
    head_dropout: 0.1
    paper_feat_dim: 128
    paper_n_groups: 256
    paper_knn: 8
    paper_sim_layers: 3
    paper_depth_bins: 16

    batch_size: 8
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    no_amp: 1
    optimizer: adam
    wd: 0.0
    use_compile: false

    val_split_mode: group
    val_holdout_ratio: 0.2
    val_holdout_sequences: "03,07,11,20,22"

    enable_axis_loss: false
    weight_axis_rotation: 0.0
    axis_weights: "1.0,1.0,1.0"
    use_geodesic_loss: 0
    quat_norm_weight: 0.5

    angle_range_deg: 5
    eval_angle_range_deg: 5
    rotation_target_definition: per_axis
    trans_range: 0.0
    symmetric_perturb: 1
    perturb_distribution: uniform
    multi_scale_perturb: "0.5:0.25,1.0:0.25,2.0:0.30,3.0:0.15,5.0:0.05"
    per_axis_prob: 0.5
    per_axis_weights: "1.0,1.0,1.0"

    augment_mount_jitter_prob: 0.7
    augment_mount_jitter_rot_sigma: 4.0
    augment_mount_jitter_trans_sigma: 0.0
    augment_color_jitter: 0.25
    augment_intrinsic: 0.0

    xyz_only: 1
    max_pcd_points: 40960
    max_frames_per_seq: 500
    pose_aware_sampling: true

    # --- V70.3 core: align training loss with OOD acceptance gate ---
    zero_perturbation_prob: 0.05
    zero_drift_dedicated_ratio: 0.20
    zero_drift_loss_weight: 0.30
    zero_drift_loss_weight_start: 0.05
    zero_drift_loss_ramp_epochs: 10
    zero_drift_loss_start_epoch: 1
    zero_drift_loss_margin_deg: 0.08

    inject_recovery_loss_weight: 0.50
    inject_recovery_loss_start_epoch: 1
    inject_recovery_magnitude_deg: 2.0
    inject_recovery_dedicated_ratio: 0.25

    enable_medw_eval: 1
    enable_jacobian_eval: 1
    enable_inject_recovery_eval: 1
    inject_recovery_eval_deg: 2.0
    inject_recovery_eval_batches: 0
    jacobian_eval_angle_deg: 2.0
    jacobian_eval_batches: 0
    jacobian_eval_n_probes: 5
    medw_eval_max_frames: 400

    enable_dual_gate_ckpt: 1
    enable_recovery_gate_ckpt: 1
    enable_zd_gate_ckpt: 1
    dual_gate_inject_recovery_min: 95.0
    dual_gate_signed_slope_min: 0.80
    dual_gate_zd_max: 0.10
    dual_gate_jacobian_min: 0.80
    dual_gate_medw_max: 0.10

    data_balance: 1
    use_mgda: 0
    no_tensorboard: true
    enable_vis: 0
    enable_ckpt_eval: 0
    save_ckpt_per_epoches: 20
    seed: 42
    resume_ckpt: auto

experiments:
  - name: "c1_v70.3_zd_recovery_finetune"
    description: "V70.3: v70.2 best-medw finetune + ZD loss + inject-recovery loss"
    dataset: "all_training_data_c1"
    version: "c1_v70.3_zd_recovery_finetune"
    params:
      num_epochs: 200
      warmup_epochs: 2
      learning_rate: 3.0e-5
      lr_schedule: cosine_warm_restarts
      cosine_T0: 50
      cosine_Tmult: 2
      early_stopping_patience: 60
      eval_epoches: 10

      pretrain_ckpt: "logs/all_training_data_c1/model_small_5deg_c1_v70.2_fix1_paper_explicit_bev_group_holdout/all_training_data_c1_scratch/checkpoint/ckpt_best_medw.pth"
      pretrain_ckpt_fallback: "logs/all_training_data_c1/model_small_5deg_c1_v70.2_fix1_paper_explicit_bev_group_holdout/all_training_data_c1_scratch/checkpoint/ckpt_best_val.pth"
