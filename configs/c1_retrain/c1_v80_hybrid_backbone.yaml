# C1 V80: Hybrid Backbone — DINOv2 全局语义 + 高分辨率细节分支
#
# 数据集: all_training_data_c1 (camera_1, fisheye, 1920x1080, FOV~98°)
#
# ========================================================================
# 设计思路
# ========================================================================
#
# 核心矛盾 (来自全量训练历史审查):
#   - V66 DINOv2: Gen BEST=0.14° (最优单帧泛化), 但迭代 Recovery=16% (最差)
#   - V62 SwinT:  Gen BEST=0.21°, 迭代 Recovery=31% (较好)
#   - 根因: DINOv2 patch_size=14, 1° 旋转仅产生 2-5px 位移, 小角度"失明"
#
# V80 策略: "双分辨率特征融合"
#   1. DINOv2-Small 主分支 (1280×720): 全局语义, 域无关特征
#   2. 高分辨率细节分支 (1920×1080 → 480×270 FPN): 捕获小角度精细位移
#   3. 双分支特征通过 CrossAttention 融合
#   4. 冻结 DINOv2 前 10 层, 仅微调最后 2 层 + 细节分支全量训练
#   5. 配合 curriculum 训练: S1(±5°) → S2(±3°) → S3(±1.5°)
#
# 预期:
#   - 单帧泛化: 保持 DINOv2 的 0.14° 水平 (域无关特征)
#   - 迭代恢复: 提升至 >50% (高分辨率细节分支提供小角度灵敏度)
#   - Gen BEST: 0.08°-0.12°
#
# 显存估算: ~40GB/卡 (L20 46GB 可承受)
#   - DINOv2 1280×720: ~12GB
#   - HR branch 1920×1080: ~10GB
#   - CF-BEV-R fusion: ~8GB
#   - bs=8/卡 × 8卡 = 有效 batch 64
#
# Usage:
#   bash batch_train.sh configs/c1_retrain/c1_v80_hybrid_backbone.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    # === V80: 混合 Backbone ===
    backbone_type: "dinov2"
    backbone_variant: "dinov2-small"
    freeze_backbone: 1
    backbone_freeze_layers: "0:-2"
    backbone_lr_scale: 0.05

    # V80 新增: 高分辨率细节分支
    use_hr_detail_branch: 1
    hr_detail_input_width: 1920
    hr_detail_input_height: 1080
    hr_detail_feat_dim: 128
    hr_detail_fpn_out_channels: 256
    hr_detail_fusion_layer: 2

    # === CF-BEV-R 网络结构 ===
    cf_feat_dim: 256
    cf_n_groups: 256
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    corr_window_mode: adaptive

    # DLA + Pitch Branch
    use_dla: 1
    use_pitch_fusion: 1
    use_instance_norm: 0
    use_gated_instance_norm: 0

    # === 损失函数 ===
    axis_weights: "1.5,4.0,2.5"
    weight_axis_rotation: 0.6
    use_geodesic_loss: 1
    head_dropout: 0.08
    overcorrection_penalty: 0.3

    # Correlation alignment
    corr_alignment_weight: 0.3
    corr_alignment_warmup: 10

    # V80: Similarity Loss (跨分支对应关系)
    use_sim_loss: 1
    sim_loss_weight: 1.5
    sim_loss_warmup: 10
    sim_n_layers: 3
    use_registry_token: 1
    use_3d_pos_encoding: 1
    pos_enc_depth_bins: 16

    # === 训练参数 ===
    batch_size: 8
    num_epochs: 300
    learning_rate: 0.0004
    lr_schedule: cosine_warm_restarts
    cosine_T0: 100
    cosine_Tmult: 2
    warmup_epochs: 10

    # DDP 多卡
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false

    # 分辨率 (DINOv2 主分支 1280x720)
    target_width: 1280
    target_height: 720
    xyz_only: 1

    # 扰动
    angle_range_deg: 5
    trans_range: 0.0
    multi_scale_perturb: "0.5:0.15,1.0:0.15,2.0:0.20,3.0:0.20,5.0:0.30"
    symmetric_perturb: 1
    per_axis_prob: 0.4
    per_axis_weights: "1.0,1.5,1.5"
    perturb_distribution: uniform
    zero_perturbation_prob: 0.05
    continuous_noise_max_deg: 3.0

    # 数据增强
    tinit_dropout_prob: 0.3
    continuous_tinit_noise: 1
    augment_mount_jitter_prob: 0.3
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.01
    augment_color_jitter: 0.15

    # 数据
    max_frames_per_seq: 500
    max_pcd_points: 16384
    foreground: true
    pitch_vertical_bands: 3

    # 评估 & checkpoint
    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.10
    save_ckpt_per_epoches: 10

    seed: 42
    pretrain_ckpt: null
    resume_ckpt: auto

experiments:
  # ===== S1: ±5° 基础训练 =====
  - name: "c1_v80_hybrid_S1"
    description: "V80: DINOv2 + HR Detail Branch, ±5°, bs8, 8卡DDP, 300ep"
    dataset: "all_training_data_c1"
    version: "c1_v80_hybrid_S1"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 300
      early_stopping_patience: 80
      eval_epoches: 10

  # ===== S2: ±3° fine-tune =====
  - name: "c1_v80_hybrid_S2"
    description: "V80 S2: ±3° finetune"
    dataset: "all_training_data_c1"
    version: "c1_v80_hybrid_S2"
    params:
      angle_range_deg: 3
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 120
      warmup_epochs: 5
      learning_rate: 5e-5
      early_stopping_patience: 30
      eval_epoches: 5
      per_axis_prob: 0.5
      continuous_noise_max_deg: 3.0
      pretrain_ckpt: "logs/all_training_data_c1/model_small_5deg_c1_v80_hybrid_S1/all_training_data_c1_scratch/checkpoint/ckpt_best_val.pth"

  # ===== S3: ±1.5° 精度推进 =====
  - name: "c1_v80_hybrid_S3"
    description: "V80 S3: ±1.5° precision push"
    dataset: "all_training_data_c1"
    version: "c1_v80_hybrid_S3"
    params:
      angle_range_deg: 1.5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 80
      warmup_epochs: 3
      learning_rate: 2e-5
      early_stopping_patience: 25
      eval_epoches: 3
      per_axis_prob: 0.5
      continuous_noise_max_deg: 2.0
      overcorrection_penalty: 0.3
      pretrain_ckpt: "logs/all_training_data_c1/model_small_3deg_c1_v80_hybrid_S2/all_training_data_c1_scratch/checkpoint/ckpt_best_val.pth"
