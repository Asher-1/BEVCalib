# v21 泛化性能评估配置
#
# 模型架构参数由 evaluate_checkpoint.py 从 checkpoint 自动检测；保留 use_drcv: 1；
# bev_zbound_step 须手写。
#
# 8 个实验模型 — 3 组对照:
#
#   Group 1 - v21 Generalization (核心对比, spconv, hard voxel):
#     1. generalize_full:     全量增强 (jitter+pc_drop+color+intrinsic+pitch_flip)
#     2. generalize_no_intr:  去掉 intrinsic 增强 (验证 intrinsic aug 贡献)
#     3. generalize_strong:   强增强 (所有参数加大)
#     4. generalize_z10:      z=10 voxels (z_step=2.0, 验证更细 z 分辨率)
#
#   Group 2 - v21 Quick Ablation (小数据快速验证):
#     5. quick_full:           Quick + 全量增强
#     6. quick_no_aug:         Quick + 无增强 (增强 vs 无增强对比)
#
#   Group 3 - v16 Baselines (参考基准, drcv, scatter voxel):
#     7. v16_pitch3_signflip:  pitch sign flip only
#     8. v16_ultimate:         pitch perturb + sign flip
#
# 用法:
#   HF_HUB_OFFLINE=1 python run_generalization_eval.py --config configs/eval_v21_generalization.yaml
#   HF_HUB_OFFLINE=1 python run_generalization_eval.py --config configs/eval_v21_generalization.yaml --parallel -1

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data/v21"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_v2"
output_dir: "logs/evaluations/generalization_eval_v21"
eval_script: "evaluate_checkpoint.py"

eval_params:
  angle_range: 5.0
  trans_range: 0.15
  batch_size: 16
  vis_interval: 200
  timeout: 7200
  eval_max_frames_per_seq: 400

models:
  # =========================================================================
  # Group 1: v21 Generalization — spconv, hard voxel, 全量数据
  # =========================================================================

  # Exp 1: Full augmentation suite (256 GPUs)
  - label: "v21-gen-full"
    dir_name: "model_small_5deg_v21_generalize_full"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    angle_deg: 5
    z_voxels: 5
    version: "v21"
    mode_desc: "full aug: jitter=0.02 pc_drop=0.05 color=0.15 intr=±0.05 pitch_flip=0.2(±3°) signflip=0.15"

  # Exp 2: No intrinsic augmentation (128 GPUs)
  - label: "v21-gen-no-intr"
    dir_name: "model_small_5deg_v21_generalize_no_intr"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    angle_deg: 5
    z_voxels: 5
    version: "v21"
    mode_desc: "no intrinsic: jitter=0.02 pc_drop=0.05 color=0.15 pitch_flip=0.2(±3°) signflip=0.15"

  # Exp 3: Strong augmentation (128 GPUs)
  - label: "v21-gen-strong"
    dir_name: "model_small_5deg_v21_generalize_strong"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    angle_deg: 5
    z_voxels: 5
    version: "v21"
    mode_desc: "strong aug: jitter=0.03 pc_drop=0.1 color=0.25 intr=±0.05(cxcy=±0.05) pitch_flip=0.3(±4°) signflip=0.25"

  # Exp 4: z=10 voxels, z_step=2.0 (128 GPUs)
  - label: "v21-gen-z10"
    dir_name: "model_small_5deg_v21_generalize_z10"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    angle_deg: 5
    z_voxels: 10
    version: "v21"
    mode_desc: "z10: jitter=0.02 pc_drop=0.05 color=0.15 intr=±0.03(cxcy=±0.03) pitch_flip=0.2(±3°) signflip=0.15"

  # =========================================================================
  # Group 2: v21 Quick Ablation — spconv, hard voxel, 小数据 (max_frames=500)
  # =========================================================================

  # Exp 5: Quick + full augmentation (8 GPUs standalone)
  - label: "v21-quick-full"
    dir_name: "model_small_5deg_v21_quick_full"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    angle_deg: 5
    z_voxels: 5
    version: "v21"
    mode_desc: "quick+aug: max_frames=500, jitter=0.02 pc_drop=0.05 color=0.15 intr=±0.03 pitch_flip=0.2(±3°) signflip=0.15"

  # Exp 6: Quick + no augmentation (8 GPUs standalone)
  - label: "v21-quick-no-aug"
    dir_name: "model_small_5deg_v21_quick_no_aug"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    angle_deg: 5
    z_voxels: 5
    version: "v21"
    mode_desc: "quick+no_aug: max_frames=500, all augmentation disabled"

  # =========================================================================
  # Group 3: v16 Baselines — drcv, scatter voxel, 全量数据
  # =========================================================================

  # Exp 7: v16 pitch sign flip (128 GPUs, drcv)
  - label: "v16-pitch3-signflip"
    dir_name: "model_small_5deg_v16_pitch3_signflip"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    use_drcv: 1
    angle_deg: 5
    z_voxels: 10
    version: "v16"
    mode_desc: "v16 drcv baseline: jitter=0.02 color=0.1 signflip=0.15"

  # Exp 8: v16 ultimate (128 GPUs, drcv)
  - label: "v16-ultimate"
    dir_name: "model_small_5deg_v16_ultimate"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    use_drcv: 1
    angle_deg: 5
    z_voxels: 10
    version: "v16"
    mode_desc: "v16 drcv ultimate: jitter=0.02 color=0.1 perturb=0.15(±2°) signflip=0.1"

# ============================================================================
# 评估矩阵
# ============================================================================
#
#   | 模型                | Voxel  | z  | Backend | Aug Level    | 核心差异                    |
#   |---------------------|--------|----|---------|--------------|-----------------------------|
#   | v21-gen-full        | hard   | 5  | spconv  | full         | 全量增强 (含 intrinsic)      |
#   | v21-gen-no-intr     | hard   | 5  | spconv  | full-noIntr  | 去掉 intrinsic aug           |
#   | v21-gen-strong      | hard   | 5  | spconv  | strong       | 所有增强参数加大             |
#   | v21-gen-z10         | hard   | 10 | spconv  | full         | z 分辨率翻倍                 |
#   | v21-quick-full      | hard   | 5  | spconv  | full         | 小数据 + 增强 (快速验证)     |
#   | v21-quick-no-aug    | hard   | 5  | spconv  | none         | 小数据 + 无增强 (对照)       |
#   | v16-pitch3-signflip | scatter| 10 | drcv    | light        | v16 drcv 基准                |
#   | v16-ultimate        | scatter| 10 | drcv    | light+perturb| v16 drcv + pitch perturb     |
#
# 关键对比:
#   1. Intrinsic aug 贡献:   gen-full vs gen-no-intr
#   2. 增强强度对比:         gen-full vs gen-strong
#   3. z 分辨率对比:         gen-full vs gen-z10
#   4. 增强有效性:           quick-full vs quick-no-aug
#   5. v21 vs v16:           gen-full vs v16-ultimate
#   6. 硬/软体素 + 后端:    gen-z10 vs v16-pitch3-signflip (同 z=10)
