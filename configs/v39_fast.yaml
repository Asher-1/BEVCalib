# V39 终极加速方案：3小时/实验
#
# 核心优化（达到5小时目标）：
#   1. ✅ batch_size: 48（24→48，+2×加速）
#   2. ✅ epochs: 60（100→60，充分收敛）
#   3. ✅ LR缩放: 5.7e-4（√2倍）
#   4. ✅ eval每20ep（减少评估开销）
#   5. ✅ trans_range=0.0（只优化旋转）
#
# 预期：
#   - 每epoch: 356s / 2 = 178s (3分钟)
#   - 60 epochs: 178s × 60 = 10,680s ≈ 3h ✅
#   - 3个实验总计：3h × 3 = 9h（1个工作日内完成）

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200
    PROJFUSION_ROOT: /mnt/drtraining/user/dahailu/code/ProjFusion

  params:
    # 核心架构
    fusion_backend: proj_only
    pc_encoder_mode: pointgpt2bev
    
    # 🚀 平衡batch_size：性能vs速度
    batch_size: 32  # 24 → 32 (平衡点)
    # Global batch_size: 32 × 8 = 256
    # Steps/epoch: 8400 / 256 = 33 steps
    
    # 🚀 LR按√batch_size缩放
    learning_rate: 4.6e-4  # 4e-4 × √(32/24) = 4.62e-4
    
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    use_compile: false
    no_amp: 1
    rotation_only: true
    
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 10.0
    jacobian_eval_batches: 1    # 2 → 1 (减半耗时)
    jacobian_eval_n_probes: 3   # 5 → 3 (减少探测点)
    medw_eval_max_frames: 200
    
    native_cross: 0
    cam2bev_mode: query
    backbone_type: dinov2
    backbone_variant: dinov2-small
    freeze_backbone: 1
    
    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.0,2.5,1.0"
    use_balanced_axis_loss: 1
    
    drop_path_rate: 0.15
    head_dropout: 0.15
    
    # 数据增强（保持不变，泛化能力重要）
    augment_mount_jitter_prob: 0.6
    augment_mount_jitter_rot_sigma: 5.0
    augment_mount_jitter_trans_sigma: 0.01
    augment_pitch_sign_flip_prob: 0.15
    augment_pitch_flip_prob: 0.25
    augment_pitch_flip_max_deg: 4.0
    augment_color_jitter: 0.15
    augment_pc_jitter: 0.02
    augment_pc_dropout: 0.05
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0
    
    native_cross_extend_ratio: 2.5
    lr_schedule: cosine_warm_restarts
    cosine_T0: 30  # 50 → 30（适配更少epochs）
    cosine_Tmult: 2
    warmup_epochs: 6  # 10 → 6
    backbone_lr_scale: 0.0
    
    # 🚀🚀 超级加速：减少dataset size
    max_frames_per_seq: 500  # 1000 → 500 (+1.84× 加速)
    save_ckpt_per_epoches: 15  # 20 → 15
    
    # 🚀 评估频率优化
    eval_epoches: 15  # 10 → 15（减少评估开销，60ep下仍有4次评估）
    
    iterative_refine: 0
    projfusion_image_hw: [224, 448]
    native_cross_pointgpt_ckpt: /mnt/drtraining/user/dahailu/code/ProjFusion/pretrained/fleet_pointgpt_L20.pth
    native_cross_pointgpt_config: /mnt/drtraining/user/dahailu/code/ProjFusion/cfg/pointgpt/finetune_fleet_L20.yaml
    native_cross_pointgpt_max_depth: 60.0
    
    pose_aware_sampling: true
    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    seed: 42

experiments:
  # ============================================================
  # Exp1: ±10° 广泛泛化（60 epochs ≈ 3h）
  # ============================================================
  - name: "v39_fast_exp1_wide_10deg"
    description: "±10° wide generalization (FAST: 3h), target: Jacobian>0.85, MEDW<0.5°"
    dataset: "all"
    version: "v39_fast_exp1_wide_10deg"
    params:
      angle_range_deg: 10
      trans_range: 0.0
      
      # 🚀 加速：epochs减少到60
      num_epochs: 60  # 100 → 60
      
      pretrain_ckpt: logs/all_training_data/model_small_5deg_v39_M1_htcn_main_f1000/all_training_data_scratch/checkpoint/ckpt_best_medw.pth
      
  # ============================================================
  # Exp2: ±5° 正常范围（50 epochs ≈ 2.5h）
  # ============================================================
  - name: "v39_fast_exp2_normal_5deg"
    description: "±5° balanced (FAST: 2.5h), target: Jacobian>0.75, MEDW<0.3°"
    dataset: "all"
    version: "v39_fast_exp2_normal_5deg"
    skip: true
    skip_reason: "Enable after Exp1 completes and Jacobian>0.8 confirmed"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      
      # 更小LR
      learning_rate: 3.8e-4  # 0.67倍
      
      num_epochs: 50
      cosine_T0: 25
      eval_epoches: 12
      
      pretrain_ckpt: logs/all_training_data/model_small_10deg_v39_fast_exp1_wide_10deg/all_training_data_scratch/checkpoint/ckpt_best_medw.pth
      
  # ============================================================
  # Exp3: ±3° 实际部署（40 epochs ≈ 2h）
  # ============================================================
  - name: "v39_fast_exp3_deploy_3deg"
    description: "±3° deployment (FAST: 2h), target: MEDW<0.15° (R,P,Y<0.1°)"
    dataset: "all"
    version: "v39_fast_exp3_deploy_3deg"
    skip: true
    skip_reason: "Enable after Exp2 if MEDW>0.15° and need further refinement"
    params:
      angle_range_deg: 3
      trans_range: 0.0
      
      learning_rate: 2.8e-4  # 0.5倍
      
      axis_weights: "1.0,3.0,1.0"  # 增强Pitch
      augment_pitch_flip_prob: 0.30
      
      num_epochs: 40
      cosine_T0: 20
      eval_epoches: 10
      
      pretrain_ckpt: logs/all_training_data/model_small_5deg_v39_fast_exp2_normal_5deg/all_training_data_scratch/checkpoint/ckpt_best_medw.pth

# ============================================================
# 备用方案：如果batch_size=48 OOM
# ============================================================
# 修改为：
#   batch_size: 40
#   learning_rate: 5.2e-4  # 4e-4 × √(40/24)
#   num_epochs: 70  # 稍微增加
# 预期：4.2h/实验（仍在5h目标内）
