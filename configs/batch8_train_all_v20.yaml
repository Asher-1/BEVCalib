# BEVCalib V20 全量训练配置 — 云服务器 GPU 版 (bs=16, 16节点)
#
# V20 设计哲学:
#   将 V6/V8 历史最佳配置迁移到 DRCV 后端, 搭配 sample_step=2 (更密采样)
#   验证: 更多数据量 + DRCV 是否能恢复 V6/V8 级精度
#
#   核心变更 (vs V6/V8 原始):
#     1. USE_DRCV_BACKEND=1 (强制 DRCV)
#     2. voxel_mode=scatter, scatter_reduce=mean
#     3. sample_step=2 (vs V16 的 4, 数据量翻倍)
#
#   基座模型:
#     A: all-v8-z10-pitch3      0.251° (Z=10, Pitch3.0)
#     B: v6-linear-baseline     0.283° (Z=5, 均匀权重)
#     C: all-v8-z10-baseline    0.296° (Z=10, 均匀权重)
#
# 用法:
#   bash batch_train.sh configs/batch8_train_all_v20.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10

defaults:
  env:
    BEV_ZBOUND_STEP: 2.0
    USE_DRCV_BACKEND: 1
    HF_HUB_OFFLINE: 1

  params:
    # === 扰动范围 (与 V6/V8 一致) ===
    angle_range_deg: 5
    trans_range: 0.15

    # === 训练基础配置 ===
    batch_size: 16
    learning_rate: 1e-4

    # === 分布式训练 (DDP) ===
    use_ddp: true
    ddp_gpus: 8
    nnodes: 16
    node_rank: null
    master_addr: null
    master_port: null
    ddp_auto_scale: 1               # 加速模式: 缩放LR+warmup, epoch不变
    # ddp_auto_scale: 2             # 保步模式: 增epoch匹配总步数
    ddp_reference_gpus: 8           # 超参参考GPU数
    max_scaled_lr: 4e-4             # LR上限: V16消融验证最优区间 2e-4~4e-4

    # === 模型配置 (与 V6/V8 一致) ===
    use_compile: false
    rotation_only: true

    # === 损失函数 (与 V6/V8 一致) ===
    enable_axis_loss: true
    weight_axis_rotation: 0.5

    # === 回归头 & 损失类型 (与 V6/V8 一致) ===
    use_mlp_head: 0
    use_geodesic_loss: 0

    # === 正则化 (与 V6/V8 一致) ===
    drop_path_rate: 0.1
    head_dropout: 0.1

    # === LR 调度 (与 V6/V8 一致: StepLR) ===
    lr_schedule: step
    warmup_epochs: 5
    backbone_lr_scale: 0.1
    cosine_T0: 50
    cosine_Tmult: 2

    # === 训练扰动策略 (与 V6/V8 一致) ===
    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    per_axis_weights: null

    # === 数据增强 (与 V6/V8 一致: 全关) ===
    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_color_jitter: 0.0
    augment_pitch_flip_prob: 0.0
    augment_pitch_flip_max_deg: 2.0
    augment_pitch_sign_flip_prob: 0.0

    # === 数据采样 (V20 核心: step=2, 数据量翻倍) ===
    sample_step: 2

    # === 训练控制 ===
    early_stopping_patience: 30
    seed: 42

    # === DRCV 后端配置 (V20 强制) ===
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"

    # === 运行模式 ===
    foreground: true
    no_tensorboard: true
    tensorboard_port: null

experiments:
  # =========================================================================
  # V20 全量训练: V6/V8 最优 → DRCV (3组 + 2个bs=8变体)
  # =========================================================================

  # A. V8 最佳: Z=10 + Pitch3.0 + DRCV (★最高优先级)
  - name: "v20_v8_z10_pitch_wt3_drcv"
    description: "V20-A: V8最佳(Z=10+Pitch3.0) → DRCV (★核心)"
    dataset: "all"
    version: "v20_v8_z10_pitch_wt3_drcv"
    params:
      axis_weights: "1.0,3.0,1.0"

  # B. V6 最佳: Z=5 + 均匀权重 + DRCV
  - name: "v20_v6best_drcv"
    description: "V20-B: V6最佳(Z=5+均匀权重) → DRCV"
    dataset: "all"
    version: "v20_v6best_drcv"
    env:
      BEV_ZBOUND_STEP: 4.0
    params:
      axis_weights: "1.0,1.0,1.0"

  # C. V8 次佳: Z=10 + 均匀权重 + DRCV
  - name: "v20_v8_z10_drcv"
    description: "V20-C: V8次佳(Z=10+均匀权重) → DRCV"
    dataset: "all"
    version: "v20_v8_z10_drcv"
    params:
      axis_weights: "1.0,1.0,1.0"

  # =========================================================================
  # V20 10度角度扰动变体: 验证更宽角度范围下 DRCV 表现
  # =========================================================================

  # D. V8 最佳 + 10度
  - name: "v20_v8best_drcv_10deg"
    description: "V20-F: V8最佳(Z=10+Pitch3.0) → DRCV + 10度"
    dataset: "all"
    version: "v20_v8best_drcv_10deg"
    params:
      angle_range_deg: 10
      axis_weights: "1.0,3.0,1.0"

  # E. V6 最佳 + 10度
  - name: "v20_v6best_drcv_10deg"
    description: "V20-G: V6最佳(Z=5+均匀权重) → DRCV + 10度"
    dataset: "all"
    version: "v20_v6best_drcv_10deg"
    env:
      BEV_ZBOUND_STEP: 4.0
    params:
      angle_range_deg: 10
      axis_weights: "1.0,1.0,1.0"

  # F. V8 次佳 + 10度
  - name: "v20_v8second_drcv_10deg"
    description: "V20-H: V8次佳(Z=10+均匀权重) → DRCV + 10度"
    dataset: "all"
    version: "v20_v8second_drcv_10deg"
    params:
      angle_range_deg: 10
      axis_weights: "1.0,1.0,1.0"

# ============================================================================
# V20 云服务器训练矩阵 (8组, 16节点 x 8GPU)
# ============================================================================
#
#   实验              | BS | Z  | axis_wt | Backend | sample_step | angle | 原始精度 | 目标
#   ------------------+----+----+---------+---------+-------------+-------+----------+------------------
#   A v8best_drcv     | 16 | 10 | 1,3,1   | DRCV    | 2           | 5°    | 0.251°   | DRCV+V8最佳
#   B v6best_drcv     | 16 | 5  | 1,1,1   | DRCV    | 2           | 5°    | 0.283°   | DRCV+V6最佳
#   C v8second_drcv   | 16 | 10 | 1,1,1   | DRCV    | 2           | 5°    | 0.296°   | Pitch权重消融
#   D v8best_10deg    | 16 | 10 | 1,3,1   | DRCV    | 2           | 10°   | 0.251°   | 宽角度V8最佳
#   E v6best_10deg    | 16 | 5  | 1,1,1   | DRCV    | 2           | 10°   | 0.283°   | 宽角度V6最佳
#   F v8second_10deg  | 16 | 10 | 1,1,1   | DRCV    | 2           | 10°   | 0.296°   | 宽角度Pitch消融
#
# DDP Scaling (sample_step=2, 约65K帧/epoch):
#   bs=16: 全局batch=16×8×16=2048, ~32步/epoch
#   bs=8:  全局batch=8×8×16=1024,  ~64步/epoch
#
# 对比逻辑:
#   A vs all-v8-z10-pitch3 (spconv): 量化 DRCV 后端在更多数据下的影响
#   A vs V16: V8参数+DRCV vs V16参数+DRCV (哪个底子更好?)
#   A vs D: 大/小batch在DRCV下的收敛差异
#   B vs C: Z=5 vs Z=10 在 DRCV 下的效果
