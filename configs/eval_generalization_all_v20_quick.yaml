# V20 Quick 泛化评估配置 — V6/V8 最优 + DRCV
#
# 用法:
#   USE_DRCV_BACKEND=1 HF_HUB_OFFLINE=1 /opt/conda/envs/bevcalib310/bin/python \
#     run_generalization_eval.py --config configs/eval_generalization_all_v20_quick.yaml

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data/v20_quick"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data"
output_dir: "logs/evaluations/generalization_eval_all_v20_quick"
eval_script: "evaluate_checkpoint.py"

eval_params:
  angle_range: 5.0
  trans_range: 0.15
  batch_size: 16
  vis_interval: 200
  timeout: 3600

models:
  # === V20: V6/V8 最优 + DRCV 后端 ===

  # A. V8 最佳 → DRCV (Z=10, Pitch3.0)
  - label: "v20-v8best-drcv"
    dir_name: "model_small_5deg_v20_v8best_drcv_quick"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v20-v8best-drcv"
    mode_desc: "V20-A: V8最佳(Z=10+Pitch3.0) → DRCV"

  # B. V6 最佳 → DRCV (Z=5, 均匀权重)
  - label: "v20-v6best-drcv"
    dir_name: "model_small_5deg_v20_v6best_drcv_quick"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 5
    version: "v20-v6best-drcv"
    mode_desc: "V20-B: V6最佳(Z=5+均匀) → DRCV"

  # C. V8 次佳 → DRCV (Z=10, 均匀权重)
  - label: "v20-v8second-drcv"
    dir_name: "model_small_5deg_v20_v8second_drcv_quick"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v20-v8second-drcv"
    mode_desc: "V20-C: V8次佳(Z=10+均匀) → DRCV"

  # === V20 Quick 10度角度扰动 ===

  # D. V8 最佳 + 10度
  - label: "v20-v8best-drcv-10deg"
    dir_name: "model_small_5deg_v20_v8best_drcv_10deg_quick"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 10
    z_voxels: 10
    version: "v20-v8best-drcv-10deg"
    mode_desc: "V20-D: V8最佳(Z=10+Pitch3.0) → DRCV + 10度"

  # E. V6 最佳 + 10度
  - label: "v20-v6best-drcv-10deg"
    dir_name: "model_small_5deg_v20_v6best_drcv_10deg_quick"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 10
    z_voxels: 5
    version: "v20-v6best-drcv-10deg"
    mode_desc: "V20-E: V6最佳(Z=5+均匀) → DRCV + 10度"

  # F. V8 次佳 + 10度
  - label: "v20-v8second-drcv-10deg"
    dir_name: "model_small_5deg_v20_v8second_drcv_10deg_quick"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 10
    z_voxels: 10
    version: "v20-v8second-drcv-10deg"
    mode_desc: "V20-F: V8次佳(Z=10+均匀) → DRCV + 10度"

# ============================================================================
# V20 对比逻辑
# ============================================================================
#
#   V20-A vs all-v8-z10-pitch3 (spconv): 量化 DRCV 后端衰退
#   V20-B vs v6-linear-baseline (spconv): 量化 Z=5 + DRCV 衰退
#   V20-A vs V20-C: Pitch3.0 在 DRCV 下的效果
#   V20-B vs V20-C: Z=5 vs Z=10 在 DRCV 下的效果
