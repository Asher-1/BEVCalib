# V55: 推荐首跑参数
#
# 核心思想:
#   1. 以 V54d router-fix 为恢复能力基座
#   2. 合入保守版 Partial GIN，提升跨场景 / 跨安装泛化稳定性
#   3. 打通 DP-Head hard-route eval，使训练路由与部署路由一致
#   4. 用域泛化增强替代 LSP/photo 主线，把优化重心放回 MEDW + ZD + GenuineRec
#
# Usage:
#   bash batch_train.sh configs/v55_deploy_generalization_cf_bev_r.yaml --skip-pattern refine
#   bash batch_train.sh configs/v55_deploy_generalization_cf_bev_r.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    use_pitch_fusion: 1
    pitch_vertical_bands: 5
    corr_window_mode: adaptive

    use_dla: 1
    use_instance_norm: 0
    use_gated_instance_norm: 1
    gin_channels: 96
    gin_init_gate: 0.40
    gin_gate_reg_weight: 0.01
    gin_gate_reg_target: 0.40

    use_dp_head: 1
    use_hard_route_eval: 1
    dp_gate_deg: 1.5
    route_loss_weight: 0.25
    route_zd_penalty_weight: 0.35
    use_jacg: 1
    jacg_hidden_dim: 64
    bias_path_in_norm: 1
    recovery_path_layer_norm: 1

    backbone_type: swin
    backbone_lr_scale: 0.08
    head_dropout: 0.05
    batch_size: 16
    learning_rate: 1.2e-05
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    no_amp: 1

    enable_axis_loss: true
    weight_axis_rotation: 0.55
    axis_weights: "1.5,5.5,2.0"
    corr_alignment_weight: 0.30
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.30
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.08
    seq_consistency_start_epoch: 10

    tinit_dropout_prob: 0.25
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 8.0
    zero_perturbation_prob: 0.35
    multi_scale_perturb: "0.5:0.25,1.0:0.25,2.0:0.20,3.5:0.10"
    per_axis_prob: 0.35
    per_axis_weights: "0.25,0.20,0.55"
    symmetric_perturb: 1
    overcorrection_penalty: 2.0
    use_magnitude_head: 1
    magnitude_loss_weight: 0.30

    use_mgda: 1
    mgda_start_epoch: 0
    mgda_include_inject: 1
    mgda_include_photo: 0

    jacobian_loss_weight: 0.12
    jacobian_loss_start_epoch: 0
    jacobian_loss_probe_deg: 2.0
    jacobian_loss_interval: 3

    zero_drift_loss_weight: 0.45
    zero_drift_loss_weight_start: 0.25
    zero_drift_loss_ramp_epochs: 8
    zero_drift_loss_start_epoch: 0
    zero_drift_dedicated_ratio: 0.35

    inject_recovery_loss_weight: 0.60
    inject_recovery_loss_start_epoch: 0
    inject_recovery_magnitude_deg: 2.0
    inject_recovery_dedicated_ratio: 0.18

    use_lsp_loss: 0
    rig_consistency_weight: 0.0
    pose_release_epoch: 0
    freeze_backbone_epoch: 999

    progressive_angle_start: 1.5
    progressive_angle_end: 5.0
    progressive_warmup_epochs: 25

    augment_mount_jitter_prob: 0.45
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.015
    augment_intrinsic: 0.03
    augment_color_jitter: 0.25
    augment_fov_crop_prob: 0.25
    augment_fov_crop_ratio_min: 0.78
    augment_fov_crop_ratio_max: 0.94
    augment_lidar_sparse_prob: 0.15
    augment_lidar_sparse_lines: "16,32,64"
    augment_lidar_vertical_fov: "-25,15"
    max_pcd_points: 16384
    pose_aware_sampling: true
    max_frames_per_seq: 400

    enable_medw_eval: 1
    enable_jacobian_eval: 1
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.18
    enable_jacobian_gate_ckpt: 1
    jacobian_early_stop_min: 0.84
    jacobian_early_stop_patience: 3
    eval_epoches: 5
    save_ckpt_per_epoches: 5
    seed: 42
    no_tensorboard: true

experiments:
  - name: "v55_smoke"
    description: "V55 smoke: Partial GIN + DP-Head + hard route eval + domain augment, 15ep"
    dataset: "all"
    version: "v55_smoke"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 15
      warmup_epochs: 2
      lr_schedule: cosine_warm_restarts
      cosine_T0: 15
      cosine_Tmult: 1
      early_stopping_patience: 999
      eval_epoches: 5
      pretrain_ckpt: "logs/all_training_data/v54/model_small_5deg_v54d_router_fix/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
      dual_gate_medw_max: 0.25

  - name: "v55_full"
    description: "V55 full: 车端泛化主线，目标 MEDW<=0.18 + ZD<=0.10 + GenuineRec>=70%"
    dataset: "all"
    version: "v55_deploy_generalization"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 60
      warmup_epochs: 5
      lr_schedule: cosine_warm_restarts
      cosine_T0: 30
      cosine_Tmult: 2
      early_stopping_patience: 25
      eval_epoches: 5
      pretrain_ckpt: "logs/all_training_data/v54/model_small_5deg_v54d_router_fix/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
      dual_gate_medw_max: 0.18

  - name: "v55_refine"
    description: "V55 refine: 冻结 backbone 冲部署 gate"
    dataset: "all"
    version: "v55_refine"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      learning_rate: 8.0e-06
      num_epochs: 20
      warmup_epochs: 2
      lr_schedule: cosine_warm_restarts
      cosine_T0: 20
      cosine_Tmult: 1
      freeze_backbone_epoch: 0
      early_stopping_patience: 20
      eval_epoches: 5
      zero_perturbation_prob: 0.45
      zero_drift_dedicated_ratio: 0.40
      zero_drift_loss_weight: 0.55
      inject_recovery_dedicated_ratio: 0.22
      inject_recovery_loss_weight: 0.65
      continuous_noise_max_deg: 6.0
      progressive_angle_start: 2.0
      progressive_angle_end: 5.0
      progressive_warmup_epochs: 5
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v55_deploy_generalization/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
      dual_gate_medw_max: 0.17
