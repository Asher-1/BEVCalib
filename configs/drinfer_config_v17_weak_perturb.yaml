# DrInfer 转换配置 — V17 Full: weak_perturb (推荐配置)
#
# 用法:
#   python utils/torch2drinfer.py --config configs/drinfer_config_v17_weak_perturb.yaml
#   python utils/drinfer_infer.py --config configs/drinfer_config_v17_weak_perturb.yaml --mode compare
#
# 其他 V17 Full 模型导出:
#   修改 ckpt_path 和 export_dir 中的模型目录名即可:
#     weak_pitch15:    model_small_5deg_v17_weak_pitch15
#     signflip_only:   model_small_5deg_v17_signflip_only
#     cosine_weak:     model_small_5deg_v17_cosine_weak

dataset_root: /mnt/drtraining/user/dahailu/data/bevcalib/all_training_data
validate_sample_ratio: 0.2
deformable: false
bev_encoder: true
rotation_only: true
img_height: 360
img_width: 640
max_num_points: 200000
pc_bev_channels: 128
bev_height: 100
bev_width: 100
bev_zbound_step: '2.0'
max_attn_tokens: 800
angle_range_deg: 5.0
trans_range: 0.15
batch_size: 1
num_workers: 4
max_batches: 50
export_strategy: full
model_name: bevcalib_fusion_head
model_version: v2
inference_backend: drinfer
device: cuda
ckpt_path: logs/all_training_data/model_small_5deg_v17_weak_perturb/all_training_data_scratch/checkpoint/ckpt_best_val.pth
export_dir: logs/all_training_data/model_small_5deg_v17_weak_perturb/drinfer
report_output: logs/all_training_data/model_small_5deg_v17_weak_perturb/drinfer/eval_report.json
verify_export_graph: true
voxel_mode: scatter
scatter_reduce: mean
to_bev_mode: concat
