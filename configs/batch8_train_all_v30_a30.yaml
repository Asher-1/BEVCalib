# V30 Full A30 (32 nodes, batch_size=8): dinov2-small 最优配置 + 消融实验
#
# 决策: dinov2-base 淘汰 (backbone 大 3.9x, 泛化仅好 5.4%, 过拟合严重)
# 全部使用 dinov2-small (V29-G3 配方), 聚焦: DANN / auto_scale / 扰动范围 消融
#
# 消融矩阵 (4 experiments):
#   G3:       dinov2-small + unfreeze2 + AS=1         ← 部署首选
#   G3-noAS:  dinov2-small + unfreeze2 + AS=0         ← auto_scale 消融
#   G3-DANN:  dinov2-small + unfreeze2 + DANN + AS=1  ← DANN 效果
#   G3-10deg: dinov2-small + unfreeze2 + 10° + AS=1   ← 大扰动消融
#
# 回答的关键问题:
#   G3 vs G3-noAS   → ddp_auto_scale 对 32-node 的提升幅度
#   G3 vs G3-DANN   → DANN 对 dinov2-small + unfreeze2 是否有效
#   G3 vs G3-10deg  → 10° 训练能否突破单帧精度上限
#
# Usage:
#   bash batch_train.sh configs/batch8_train_all_v30_a30.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 3
  retry_delay: 30

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1

  params:
    angle_range_deg: 5
    trans_range: 0.15

    batch_size: 8
    learning_rate: 1e-4

    use_ddp: true
    ddp_gpus: 8
    nnodes: 32
    node_rank: null
    master_addr: null
    master_port: null
    ddp_auto_scale: 1

    use_compile: false
    no_amp: 1
    rotation_only: true

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.0,1.0,1.0"
    use_balanced_axis_loss: 1

    use_mlp_head: 0
    use_geodesic_loss: 0

    drop_path_rate: 0.15
    head_dropout: 0.15

    lr_schedule: step
    warmup_epochs: 5
    backbone_lr_scale: 0.3
    backbone_warmup_epochs: 10
    layer_wise_lr_decay: 0.65
    step_size: 80

    use_pitch_branch: 0
    pitch_aux_weight: 0.0
    bev_instance_norm: 0
    use_contrastive_extrinsic: 0
    contrastive_weight: 0.0

    augment_mount_jitter_prob: 0.15
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.01

    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    per_axis_weights: null

    augment_pitch_sign_flip_prob: 0.15
    augment_pitch_flip_prob: 0.20
    augment_pitch_flip_max_deg: 3.0
    augment_color_jitter: 0.15
    augment_pc_jitter: 0.02
    augment_pc_dropout: 0.05
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0

    pose_aware_sampling: true

    max_frames_per_seq: 10000
    num_epochs: 400
    save_ckpt_per_epoches: 50

    early_stopping_patience: 30
    eval_epoches: 50

    seed: 42
    grad_accum_steps: 1

    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"

    fuser_type: "diff"
    cam_drop_prob: 0.0
    cam_drop_mode: "zero"

    foreground: true

    domain_adversarial: 0
    domain_adversarial_weight: 0.1
    num_domains: 0

experiments:
  # =========================================================================
  # G3: dinov2-small + unfreeze2 + strong jitter — 部署首选
  # Quick BEST (V29-G3): 0.092° / 800帧: 0.103° (MEDW400)
  # =========================================================================
  - name: "v30_G3_dinov2small_full"
    description: "G3: dinov2-small + unfreeze2 + strong jitter (deploy candidate)"
    dataset: "all"
    version: "v30_G3_dinov2small_full"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_freeze_layers: "0:-2"
      backbone_lr_scale: 0.01
      drop_path_rate: 0.1
      head_dropout: 0.2
      augment_mount_jitter_prob: 0.7
      augment_mount_jitter_rot_sigma: 3.0

  # =========================================================================
  # G3-noAS: 同 G3 但关闭 ddp_auto_scale
  # 消融目标: auto_scale 对 dinov2-small 32-node 训练的效果
  # =========================================================================
  - name: "v30_G3_dinov2small_noAS"
    description: "G3-noAS: dinov2-small + unfreeze2 + no auto_scale (ablation)"
    dataset: "all"
    version: "v30_G3_dinov2small_noAS"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_freeze_layers: "0:-2"
      backbone_lr_scale: 0.01
      drop_path_rate: 0.1
      head_dropout: 0.2
      augment_mount_jitter_prob: 0.7
      augment_mount_jitter_rot_sigma: 3.0
      ddp_auto_scale: 0

  # =========================================================================
  # G3-DANN: dinov2-small + unfreeze2 + DANN
  # 消融目标: DANN 对 dinov2-small + unfreeze2 的效果
  # =========================================================================
  - name: "v30_G3_dinov2small_dann"
    description: "G3-DANN: dinov2-small + unfreeze2 + DANN"
    dataset: "all"
    version: "v30_G3_dinov2small_dann"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_freeze_layers: "0:-2"
      backbone_lr_scale: 0.01
      drop_path_rate: 0.1
      head_dropout: 0.2
      augment_mount_jitter_prob: 0.7
      augment_mount_jitter_rot_sigma: 3.0
      domain_adversarial: 1
      domain_adversarial_weight: 0.15

  # =========================================================================
  # G3-10deg: dinov2-small + unfreeze2 + 10° 扰动
  # 消融目标: 10° 训练→5° 评估，验证更大扰动是否降低单帧精度上限
  # =========================================================================
  - name: "v30_G3_dinov2small_10deg"
    description: "G3-10deg: dinov2-small + unfreeze2 + 10deg perturbation"
    dataset: "all"
    version: "v30_G3_dinov2small_10deg"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_freeze_layers: "0:-2"
      backbone_lr_scale: 0.01
      drop_path_rate: 0.1
      head_dropout: 0.2
      augment_mount_jitter_prob: 0.7
      augment_mount_jitter_rot_sigma: 3.0
      angle_range_deg: 10
