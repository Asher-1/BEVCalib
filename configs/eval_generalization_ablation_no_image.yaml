# DST-Calib 消融实验: 去掉 image_branch (zero_image)
#
# 目的:
#   验证 DST-Calib 论文的核心发现 —— 单侧数据增强导致 camera branch 在推理时
#   产生与训练域不一致的特征，反而损害泛化性能。
#
# 方法:
#   对已训练好的模型，将图像输入置零（zero_image=true），仅靠 LiDAR 分支推理。
#   若 zero_image 精度 ≈ 甚至 > 正常精度，说明 camera branch 确实无贡献/有害，
#   DST-Calib 的 Difference Map 方案值得引入。
#
# 选择的模型:
#   - v16-ultimate: 全量增强 (camera branch 应受增强影响最大)
#   - v20-v8recipe-pitch-wt3: 无增强基线 (camera branch 应贡献正常)
#   - v20-v8recipe-z10: z=10, 无增强 (更大 BEV 特征空间)
#
# 用法:
#   HF_HUB_OFFLINE=1 python run_generalization_eval.py \
#     --config configs/eval_generalization_ablation_no_image.yaml --parallel -1

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_v2"
output_dir: "logs/evaluations/ablation_no_image"
eval_script: "evaluate_checkpoint.py"

eval_params:
  angle_range: 5.0
  trans_range: 0.15
  batch_size: 16
  vis_interval: 200
  timeout: 7200

  # 注: 对照组已有结果 → logs/evaluations/generalization_eval_test_models2_v2/
  # 此配置仅跑 NO-IMAGE 消融组，结果与上述对照组对比即可

models:
  # ============================================================================
  # zero_image 消融: camera branch 输入置零, 仅 LiDAR 分支工作
  # ============================================================================

  # --- v16 系列 (drcv, z=10, 有数据增强) ---

  - label: "v16-ultimate-NO-IMAGE"
    dir_name: "test_models2/model_small_5deg_v16_ultimate"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v16"
    zero_image: true
    mode_desc: "消融NO-IMG, L20x128GPU, 全量增强"

  - label: "v16-pitch3-signflip-NO-IMAGE"
    dir_name: "test_models2/model_small_5deg_v16_pitch3_signflip"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v16"
    zero_image: true
    mode_desc: "消融NO-IMG, sign_flip only"

  - label: "v16-a30-ultimate-NO-IMAGE"
    dir_name: "test_models2/model_small_5deg_v16_a30_ultimate"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v16-a30"
    zero_image: true
    mode_desc: "消融NO-IMG, A30x8GPU, 全量增强"

  - label: "v20-v8-z10-drcv-NO-IMAGE"
    dir_name: "test_models2/model_small_5deg_v20_v8_z10_drcv"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v16-l20"
    zero_image: true
    mode_desc: "消融NO-IMG, drcv, z=10, wt=1:3:1"

  # --- v20 系列 ---

  - label: "v20-v8recipe-z10-NO-IMAGE"
    dir_name: "test_models2/model_small_5deg_v20_v8recipe_z10"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 0
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v20"
    zero_image: true
    mode_desc: "消融NO-IMG, spconv, z=10, wt=1:1:1"

  - label: "v20-v8-z10-pitch-wt3-drcv-NO-IMAGE"
    dir_name: "test_models2/model_small_5deg_v20_v8_z10_pitch_wt3_drcv"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v20"
    zero_image: true
    mode_desc: "消融NO-IMG, drcv, z=10, wt=1:3:1"

  - label: "v20-v8recipe-pitch-wt3-NO-IMAGE"
    dir_name: "test_models2/model_small_5deg_v20_v8recipe_pitch_wt3"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    rotation_only: 1
    use_drcv: 0
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 5
    version: "v20"
    zero_image: true
    mode_desc: "消融NO-IMG, spconv, z=5, wt=1:3:1"
