# V18 A30（32 节点）全量泛化评估配置
#
# 对应训练配置: batch8_train_all_v18_a30.yaml
#
# 用法:
#   USE_DRCV_BACKEND=1 HF_HUB_OFFLINE=1 /opt/conda/envs/bevcalib310/bin/python \
#     run_generalization_eval.py --config configs/eval_generalization_all_v18_a30.yaml
#   多卡并行:
#     ... --parallel -1

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data/v18"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data"
output_dir: "logs/evaluations/generalization_eval_all_v18_a30"
eval_script: "evaluate_checkpoint.py"

eval_params:
  angle_range: 5.0
  trans_range: 0.15
  batch_size: 16
  vis_interval: 200
  timeout: 3600

models:
  - label: "v18-a30-signflip-pitch-focus"
    dir_name: "model_small_5deg_v18_signflip_pitch_focus"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v18-a30-signflip-pitch-focus"
    mode_desc: "sign_flip(0.20)+Pitch2.0"

  - label: "v18-a30-angle8-pitch"
    dir_name: "model_small_5deg_v18_angle8_pitch"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 8
    z_voxels: 10
    version: "v18-a30-angle8-pitch"
    mode_desc: "8deg+sign_flip+Pitch2.5"

  - label: "v18-a30-hybrid-aug"
    dir_name: "model_small_5deg_v18_hybrid_aug"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v18-a30-hybrid-aug"
    mode_desc: "混合增强"

  - label: "v18-a30-step-signflip-pitch"
    dir_name: "model_small_5deg_v18_step_signflip_pitch"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v18-a30-step-signflip-pitch"
    mode_desc: "StepLR+sign_flip+Pitch2.0"
