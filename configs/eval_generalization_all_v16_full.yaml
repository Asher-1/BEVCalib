# V16 Full PyTorch 泛化评估配置 — 全量训练 StepLR vs Cosine + 双模式 Pitch 增强
#
# 用法:
#   USE_DRCV_BACKEND=1 HF_HUB_OFFLINE=1 /opt/conda/envs/bevcalib310/bin/python \
#     run_generalization_eval.py --config configs/eval_generalization_all_v16_full.yaml
#   多卡并行:
#     ... --parallel -1

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data"
output_dir: "logs/evaluations/generalization_eval_all_v16_full"
eval_script: "evaluate_checkpoint.py"

eval_params:
  angle_range: 5.0
  trans_range: 0.15
  batch_size: 16
  vis_interval: 200
  timeout: 3600

models:
  # === V16 Full 全量训练 (PyTorch) ===

  # 0. 终极配置: StepLR + Pitch3 + dual_pitch
  - label: "v16-ultimate"
    dir_name: "model_small_5deg_v16_ultimate"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v16-ultimate"
    mode_desc: "V16 Full: StepLR+Pitch3+sign_flip(0.1)+perturb(0.15,2deg)"

  # 1. sign_flip only + Pitch3
  - label: "v16-pitch3-signflip"
    dir_name: "model_small_5deg_v16_pitch3_signflip"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v16-pitch3-signflip"
    mode_desc: "V16 Full: StepLR+Pitch3+sign_flip(0.15)"

  # 2. 纯 Aug 对照 (Pitch3, 无pitch增强)
  - label: "v16-pitch3-aug"
    dir_name: "model_small_5deg_v16_pitch3_aug"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v16-pitch3-aug"
    mode_desc: "V16 Full: StepLR+Pitch3+Aug (对照, 无pitch增强)"

  # 3. CosineAnnealing 终极配置
  - label: "v16-cosine-ultimate"
    dir_name: "model_small_5deg_v16_cosine_ultimate"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    rotation_only: 1
    use_drcv: 1
    use_mlp_head: 0
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 10
    version: "v16-cosine-ultimate"
    mode_desc: "V16 Full: Cosine+Pitch3+sign_flip(0.1)+perturb(0.15,2deg)"

# ============================================================================
# V16 Full 实验矩阵 (PyTorch)
# ============================================================================
#
#   实验                    | LR Schedule | Pitch3 | sign_flip | perturb  | 说明
#   ------------------------+-------------+--------+-----------+----------+----------
#   v16-ultimate            | StepLR      | Yes    | 0.1       | 0.15,2°  | 终极配方
#   v16-pitch3-signflip     | StepLR      | Yes    | 0.15      | No       | 仅sign_flip
#   v16-pitch3-aug          | StepLR      | Yes    | No        | No       | 纯Aug对照
#   v16-cosine-ultimate     | Cosine      | Yes    | 0.1       | 0.15,2°  | Cosine终极
