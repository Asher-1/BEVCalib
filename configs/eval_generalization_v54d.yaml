# V54d 泛化评估配置
#
# Router 修复版 DP-Head vs V54c/V54a/V53e 锚点
# 验收: GenuineRec≥70%, MEDW400≤0.18°, ZD≤0.10°
#
# Usage:
#   bash run_v54d_eval.sh
#   bash run_v54d_eval.sh --gate-eval
#   bash run_v54d_eval.sh --precheck-only

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_v2"
output_dir: "logs/evaluations/generalization_v54d"
eval_script: "evaluate_checkpoint.py"

bag_eval_dir: "/mnt/drtraining/user/dahailu/data/bevcalib/calibration_outputs/v54d_generalization"

deploy_policy:
  gate_deg: 1.5
  medw_n_frames: 400
  ckpt_medw:
    label: "v54d-router-fix-best-dual"
    dir_name: "model_small_5deg_v54d_router_fix"
    ckpt: "ckpt_best_dual.pth"
    eval_aliases: ["v54d-router-fix-best-dual"]
  ckpt_recovery:
    label: "v54d-router-fix-best-val"
    dir_name: "model_small_5deg_v54d_router_fix"
    ckpt: "ckpt_best_val.pth"
    eval_aliases: ["v54d-router-fix-best-val"]
  acceptance:
    medw400_max_deg: 0.18
    zd_max_rpy_max_deg: 0.10
    genuine_recovery_2deg_min_pct: 70.0
    multi_mag_0p5_recv_min_pct: 0.0
    multi_mag_1p0_recv_min_pct: 0.0

eval_params:
  angle_range: 5.0
  trans_range: 0.0
  batch_size: 16
  vis_interval: 200
  timeout: 7200
  shortcut_diag: false
  generalization_diag: true
  exclude_seqs: "07"
  eval_max_frames_per_seq: 400

models:

  - label: "v54d-router-fix-best-dual"
    dir_name: "model_small_5deg_v54d_router_fix"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_medw.pth", "ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_dp_head: 1
    use_gated_instance_norm: 0
    gin_channels: 0
    mode_desc: "V54d router fix dual (val MEDW 0.083° ep26)"
    pitch_vertical_bands: 5

  - label: "v54d-router-fix-best-medw"
    dir_name: "model_small_5deg_v54d_router_fix"
    ckpt: "ckpt_best_medw.pth"
    ckpt_fallback: ["ckpt_best_dual.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_dp_head: 1
    use_gated_instance_norm: 0
    gin_channels: 0
    mode_desc: "V54d MEDW最优"
    pitch_vertical_bands: 5

  - label: "v54d-router-fix-best-val"
    dir_name: "model_small_5deg_v54d_router_fix"
    ckpt: "ckpt_best_val.pth"
    ckpt_fallback: ["ckpt_best_dual.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_dp_head: 1
    use_gated_instance_norm: 0
    gin_channels: 0
    mode_desc: "V54d Recovery 路径"
    pitch_vertical_bands: 5

  - label: "v54c-nogin-best-dual"
    dir_name: "model_small_5deg_v54c_dphead_nogin"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_dp_head: 1
    use_gated_instance_norm: 0
    gin_channels: 0
    mode_desc: "V54c 前代 DP-Head (Rec 68.3%)"
    pitch_vertical_bands: 5

  - label: "v54a-nolsp-best-dual"
    dir_name: "model_small_5deg_v54a_nolsp"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_gated_instance_norm: 1
    gin_channels: 128
    use_dp_head: 0
    mode_desc: "V54a MEDW 锚点 (0.193°)"
    pitch_vertical_bands: 5

  - label: "v53e-gin-mgda-best-dual"
    dir_name: "model_small_5deg_v53e_gin_mgda_full"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    use_gated_instance_norm: 1
    gin_channels: 128
    use_dp_head: 0
    mode_desc: "V53e ZD/Rec 均衡锚点"
    pitch_vertical_bands: 5
