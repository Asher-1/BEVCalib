# V62-bias-lite-seq03-guard: conservative polish from V60 ckpt15 after V61 hardseq regression
#
# V61 result:
#   - best formal MEDW400 = 0.210 deg, worse than V60 ckpt15 = 0.205 deg
#   - hard full-balance + Seq03:2.0 did not reduce Seq03 and regressed pitch
#
# V62 strategy:
#   1. Restart from V60 formal best ckpt15, not V61.
#   2. Use sqrt sequence balancing plus mild Seq02/03/10 overrides.
#   3. Disable MGDA for this short refine to avoid zd-only task domination.
#   4. Lower LR, jac/inject pressure, mount jitter, and large perturb tail.
#   5. Keep pitch guard, since V61's main regression was pitch.

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    use_pitch_fusion: 1
    pitch_vertical_bands: 5
    corr_window_mode: adaptive

    use_dla: 1
    use_instance_norm: 0
    use_gated_instance_norm: 1
    gin_channels: 128
    gin_init_gate: 0.35
    gin_gate_reg_weight: 0.01
    gin_gate_reg_target: 0.35

    use_dp_head: 0
    use_hard_route_eval: 0
    dp_gate_deg: 1.5
    route_loss_weight: 0.0
    route_zd_penalty_weight: 0.0
    use_jacg: 1
    jacg_hidden_dim: 64
    bias_path_in_norm: 1
    recovery_path_layer_norm: 1

    backbone_type: swin
    backbone_lr_scale: 0.015
    head_dropout: 0.04
    batch_size: 16
    learning_rate: 2.0e-06
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    no_amp: 1
    data_balance: 2
    seq_weight_overrides: "02:1.10,03:1.25,10:1.05"

    enable_axis_loss: true
    weight_axis_rotation: 0.58
    axis_weights: "2.7,7.4,0.7"
    corr_alignment_weight: 0.30
    corr_alignment_warmup: 4
    pitch_aux_weight: 0.42
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.16
    seq_consistency_start_epoch: 0

    tinit_dropout_prob: 0.06
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 2.8
    zero_perturbation_prob: 0.62
    multi_scale_perturb: "0.5:0.50,1.0:0.35,2.0:0.12,3.0:0.03"
    per_axis_prob: 0.42
    per_axis_weights: "0.42,0.50,0.08"
    symmetric_perturb: 1
    overcorrection_penalty: 2.6
    use_magnitude_head: 1
    magnitude_loss_weight: 0.08

    use_mgda: 0
    mgda_start_epoch: 0
    mgda_include_inject: 0
    mgda_include_photo: 0

    jacobian_loss_weight: 0.030
    jacobian_loss_start_epoch: 0
    jacobian_loss_probe_deg: 1.4
    jacobian_loss_interval: 8

    zero_drift_loss_weight: 0.58
    zero_drift_loss_weight_start: 0.44
    zero_drift_loss_ramp_epochs: 4
    zero_drift_loss_start_epoch: 0
    zero_drift_dedicated_ratio: 0.52

    inject_recovery_loss_weight: 0.10
    inject_recovery_loss_start_epoch: 0
    inject_recovery_magnitude_deg: 1.4
    inject_recovery_dedicated_ratio: 0.03

    use_lsp_loss: 0
    rig_consistency_weight: 0.0
    pose_release_epoch: 0
    freeze_backbone_epoch: 0

    progressive_angle_start: 0.5
    progressive_angle_end: 3.5
    progressive_warmup_epochs: 4

    augment_mount_jitter_prob: 0.06
    augment_mount_jitter_rot_sigma: 0.30
    augment_mount_jitter_trans_sigma: 0.004
    augment_intrinsic: 0.006
    augment_color_jitter: 0.05
    augment_fov_crop_prob: 0.02
    augment_fov_crop_ratio_min: 0.94
    augment_fov_crop_ratio_max: 0.99
    augment_lidar_sparse_prob: 0.01
    augment_lidar_sparse_lines: "32,64"
    augment_lidar_vertical_fov: "-25,15"
    max_pcd_points: 16384
    pose_aware_sampling: true
    max_frames_per_seq: 400

    enable_medw_eval: 1
    enable_jacobian_eval: 1
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.90
    dual_gate_medw_max: 0.140
    enable_jacobian_gate_ckpt: 1
    jacobian_early_stop_min: 0.86
    jacobian_early_stop_patience: 3
    eval_epoches: 2
    save_ckpt_per_epoches: 2
    seed: 42
    no_tensorboard: true

experiments:
  - name: "v62_bias_lite_seq03_guard_smoke"
    description: "V62 smoke: V60 ckpt15 + sqrt balance + mild hard-seq + no MGDA"
    dataset: "all"
    version: "v62_bias_lite_seq03_guard_smoke"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 4
      warmup_epochs: 1
      lr_schedule: cosine_warm_restarts
      cosine_T0: 4
      cosine_Tmult: 1
      early_stopping_patience: 999
      eval_epoches: 2
      save_ckpt_per_epoches: 2
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v60_seq_balance_pitch_guard/all_training_data_scratch/checkpoint/ckpt_15.pth"
      dual_gate_medw_max: 0.16

  - name: "v62_bias_lite_seq03_guard_full"
    description: "V62 full: low-LR bias-lite polish toward MEDW400 <= 0.200"
    dataset: "all"
    version: "v62_bias_lite_seq03_guard"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 14
      warmup_epochs: 1
      lr_schedule: cosine_warm_restarts
      cosine_T0: 14
      cosine_Tmult: 1
      early_stopping_patience: 14
      eval_epoches: 2
      save_ckpt_per_epoches: 2
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v60_seq_balance_pitch_guard/all_training_data_scratch/checkpoint/ckpt_15.pth"
      dual_gate_medw_max: 0.140
