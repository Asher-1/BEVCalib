# V54b: Stage-2 refine (freeze backbone, stronger LSP, narrow perturb)
#
# Resume from v54a_lsp_full best ckpt.
#
# Usage:
#   bash batch_train.sh configs/v54b_refine_cf_bev_r.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    use_pitch_fusion: 1
    pitch_vertical_bands: 5
    corr_window_mode: adaptive

    use_dla: 1
    use_gated_instance_norm: 1
    gin_channels: 128
    gin_init_gate: 0.5
    gin_gate_reg_weight: 0.01
    gin_gate_reg_target: 0.5
    use_dp_head: 0

    backbone_type: swin
    backbone_lr_scale: 0.1
    head_dropout: 0.05
    batch_size: 16
    learning_rate: 1.6e-05
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    no_amp: 1

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.5,5.5,1.5"
    corr_alignment_weight: 0.3
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.3
    quat_norm_weight: 0.5

    use_mgda: 1
    mgda_start_epoch: 0
    mgda_include_inject: 1
    mgda_include_photo: 1

    jacobian_loss_weight: 0.10
    jacobian_loss_start_epoch: 0
    jacobian_loss_probe_deg: 2.0
    jacobian_loss_interval: 4

    zero_drift_loss_weight: 0.4
    zero_drift_loss_weight_start: 0.3
    zero_drift_loss_ramp_epochs: 5
    zero_drift_loss_start_epoch: 0
    zero_drift_dedicated_ratio: 0.15

    inject_recovery_loss_weight: 0.20
    inject_recovery_loss_start_epoch: 0
    inject_recovery_magnitude_deg: 2.0
    inject_recovery_dedicated_ratio: 0.08

    use_lsp_loss: 1
    lsp_weight: 0.5
    lsp_weight_start: 0.35
    lsp_ramp_epochs: 5
    lsp_start_epoch: 0
    lsp_lambda_ssim: 0.2
    lsp_max_points: 4096
    rig_consistency_weight: 0.15
    rig_consistency_start_epoch: 0
    pose_release_epoch: 0
    freeze_backbone_epoch: 0

    progressive_angle_start: 2.0
    progressive_angle_end: 2.0
    progressive_warmup_epochs: 1
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 2.0
    zero_perturbation_prob: 0.20
    multi_scale_perturb: "0.5:0.50,1.0:0.30,2.0:0.20"

    augment_mount_jitter_prob: 0.3
    augment_intrinsic: 0.02
    augment_color_jitter: 0.2
    max_pcd_points: 16384
    pose_aware_sampling: true
    max_frames_per_seq: 500

    enable_medw_eval: 1
    enable_jacobian_eval: 1
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.18
    eval_epoches: 5
    num_epochs: 20
    warmup_epochs: 2
    lr_schedule: cosine_warm_restarts
    cosine_T0: 20
    cosine_Tmult: 1
    save_ckpt_per_epoches: 5
    seed: 42
    no_tensorboard: true

experiments:
  - name: "v54b_refine"
    description: "V54b refine: freeze backbone, LSP=0.5, ±2° only"
    dataset: "all"
    version: "v54b_refine"
    params:
      angle_range_deg: 2
      eval_angle_range_deg: 2
      # 用 pretrain_ckpt 仅加载权重、从 ep0 训 20ep；勿用 resume_ckpt（v54a 的 epoch≈80 且 PRS 优化器分组不同）
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v54a_lsp_full/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
