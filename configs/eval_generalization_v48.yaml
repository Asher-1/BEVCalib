    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V47 S2 Full n_groups=512 best-val"
    pitch_vertical_bands: 1

  # ========================================================================
  # V48 新实验
  # ========================================================================

  # ===== V48a: Multi-Scale only (无GIN, 纯训练策略改进) =====
  - label: "v48a-ms-S1-quick-best-dual"
