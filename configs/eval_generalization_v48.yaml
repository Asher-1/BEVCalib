    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_medw.pth", "ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V48a Multi-Scale only (no GIN, cf256)"
    pitch_vertical_bands: 3

  - label: "v48a-ms-S1-quick-best-val"
    dir_name: "model_small_5deg_v48a_ms_only_S1_quick"
