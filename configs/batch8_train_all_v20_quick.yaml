# BEVCalib V20 Quick 训练配置 — V6/V8 最优 + DRCV (单机验证)
#
# V20 = V6/V8 历史最优参数 + DRCV 后端 + sample_step=2
#
# 用法:
#   bash batch_train.sh configs/batch8_train_all_v20_quick.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10

defaults:
  env:
    BEV_ZBOUND_STEP: 2.0
    USE_DRCV_BACKEND: 1
    HF_HUB_OFFLINE: 1

  params:
    # === 扰动范围 ===
    angle_range_deg: 5
    trans_range: 0.15

    # === 训练基础配置 ===
    batch_size: 16
    learning_rate: 2e-4                 # V16 LR消融验证: 2e-4 优于 1e-4 (0.15° vs 0.17°)

    # === 分布式训练 ===
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    node_rank: null
    master_addr: null
    master_port: null
    ddp_auto_scale: 1
    ddp_reference_gpus: 8

    # === 模型配置 ===
    use_compile: false
    rotation_only: true

    # === 损失函数 ===
    enable_axis_loss: true
    weight_axis_rotation: 0.5

    # === 回归头 ===
    use_mlp_head: 0
    use_geodesic_loss: 0

    # === 正则化 ===
    drop_path_rate: 0.1
    head_dropout: 0.1

    # === LR 调度 (StepLR, 与 V6/V8 一致) ===
    lr_schedule: step
    warmup_epochs: 5
    backbone_lr_scale: 0.1
    cosine_T0: 50
    cosine_Tmult: 2

    # === 训练扰动策略 ===
    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    per_axis_weights: null

    # === 数据增强 (全关, 与 V6/V8 一致) ===
    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_color_jitter: 0.0
    augment_pitch_flip_prob: 0.0
    augment_pitch_flip_max_deg: 2.0
    augment_pitch_sign_flip_prob: 0.0

    # === 训练控制 ===
    early_stopping_patience: 30
    seed: 42

    # === Quick 模式 ===
    max_frames_per_seq: 2000
    eval_epoches: 50
    grad_accum_steps: 1

    # === DRCV 后端 (V20 强制) ===
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"

    # === 运行模式 ===
    foreground: true
    no_tensorboard: true
    tensorboard_port: null

experiments:
  # =========================================================================
  # V20 Quick: V6/V8 → DRCV 验证 (3组)
  # =========================================================================

  # A. V8 最佳 → DRCV (★核心)
  - name: "v20_v8_z10_pitch_wt3_drcv"
    description: "V20-A: V8最佳(Z=10+Pitch3.0) → DRCV (★核心)"
    dataset: "all"
    version: "v20_v8_z10_pitch_wt3_drcv_quick"
    params:
      axis_weights: "1.0,3.0,1.0"

  # B. V6 最佳 → DRCV
  - name: "v20_v6best_drcv"
    description: "V20-B: V6最佳(Z=5+均匀权重) → DRCV"
    dataset: "all"
    version: "v20_v6best_drcv_quick"
    env:
      BEV_ZBOUND_STEP: 4.0
    params:
      axis_weights: "1.0,1.0,1.0"

  # C. V8 次佳 → DRCV
  - name: "v20_v8_z10_drcv"
    description: "V20-C: V8次佳(Z=10+均匀权重) → DRCV"
    dataset: "all"
    version: "v20_v8_z10_drcv_quick"
    params:
      axis_weights: "1.0,1.0,1.0"

  # =========================================================================
  # V20 Quick 10度角度扰动变体
  # =========================================================================

  # D. V8 最佳 + 10度
  - name: "v20_v8best_drcv_10deg"
    description: "V20-D: V8最佳(Z=10+Pitch3.0) → DRCV + 10度"
    dataset: "all"
    version: "v20_v8best_drcv_10deg_quick"
    params:
      angle_range_deg: 10
      axis_weights: "1.0,3.0,1.0"

  # E. V6 最佳 + 10度
  - name: "v20_v6best_drcv_10deg"
    description: "V20-E: V6最佳(Z=5+均匀权重) → DRCV + 10度"
    dataset: "all"
    version: "v20_v6best_drcv_10deg_quick"
    env:
      BEV_ZBOUND_STEP: 4.0
    params:
      angle_range_deg: 10
      axis_weights: "1.0,1.0,1.0"

  # F. V8 次佳 + 10度
  - name: "v20_v8second_drcv_10deg"
    description: "V20-F: V8次佳(Z=10+均匀权重) → DRCV + 10度"
    dataset: "all"
    version: "v20_v8second_drcv_10deg_quick"
    params:
      angle_range_deg: 10
      axis_weights: "1.0,1.0,1.0"

# ============================================================================
# V20 Quick 矩阵 (6组)
# ============================================================================
#
#   实验              | Z  | axis_wt | Backend | max_frames | 原始精度 | 目标
#   ------------------+----+---------+---------+------------+----------+---------------------------
#   A v8best_drcv     | 10 | 1,3,1   | DRCV    | 2000       | 0.251°   | DRCV 兼容性验证
#   B v6best_drcv     | 5  | 1,1,1   | DRCV    | 2000       | 0.283°   | Z=5 + DRCV
#   C v8second_drcv   | 10 | 1,1,1   | DRCV    | 2000       | 0.296°   | Pitch权重消融
