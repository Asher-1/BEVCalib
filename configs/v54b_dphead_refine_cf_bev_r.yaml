# V54b: DP-Head 短程 refine — 在 v54c-nogin-dual 上压 ZD + 推 Rec
#
# 背景: v54c eval GenuineRec=68.3%（差1.7pp），ZD=0.535°；MEDW=0.330°
# 策略: ±2° 窄扰动、低 LR、冻结 backbone，专注重标定能力
# 注意: 原 v54b LSP refine 已归档（LSP eval 无增益）
#
# Usage:
#   bash batch_train.sh configs/v54b_dphead_refine_cf_bev_r.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    use_pitch_fusion: 1
    pitch_vertical_bands: 5
    corr_window_mode: adaptive

    use_dla: 1
    use_instance_norm: 0
    use_gated_instance_norm: 0
    gin_channels: 0

    use_dp_head: 1
    dp_gate_deg: 1.5
    route_loss_weight: 0.15
    route_zd_penalty_weight: 0.20
    use_jacg: 1
    jacg_hidden_dim: 64
    bias_path_in_norm: 1

    backbone_type: swin
    backbone_lr_scale: 0.05
    head_dropout: 0.05
    batch_size: 16
    learning_rate: 8.0e-06
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    no_amp: 1

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.5,5.5,1.5"
    corr_alignment_weight: 0.2
    pitch_aux_weight: 0.2
    quat_norm_weight: 0.5

    tinit_dropout_prob: 0.2
    continuous_tinit_noise: 0
    zero_perturbation_prob: 0.35
    multi_scale_perturb: "0.5:0.50,1.0:0.30,2.0:0.20"
    symmetric_perturb: 1
    use_magnitude_head: 1
    magnitude_loss_weight: 0.2

    use_mgda: 1
    mgda_start_epoch: 0
    mgda_include_inject: 1
    mgda_include_photo: 0

    jacobian_loss_weight: 0.10
    jacobian_loss_start_epoch: 0
    jacobian_loss_probe_deg: 2.0
    jacobian_loss_interval: 4

    zero_drift_loss_weight: 0.55
    zero_drift_loss_weight_start: 0.4
    zero_drift_loss_ramp_epochs: 3
    zero_drift_loss_start_epoch: 0
    zero_drift_dedicated_ratio: 0.35

    inject_recovery_loss_weight: 0.55
    inject_recovery_loss_start_epoch: 0
    inject_recovery_magnitude_deg: 2.0
    inject_recovery_dedicated_ratio: 0.15

    use_lsp_loss: 0
    freeze_backbone_epoch: 0
    pose_release_epoch: 0

    progressive_angle_start: 2.0
    progressive_angle_end: 2.0
    progressive_warmup_epochs: 1

    augment_mount_jitter_prob: 0.2
    augment_intrinsic: 0.01
    augment_color_jitter: 0.1
    max_pcd_points: 16384
    max_frames_per_seq: 500

    enable_medw_eval: 1
    enable_jacobian_eval: 1
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.18
    eval_epoches: 5
    num_epochs: 20
    warmup_epochs: 2
    lr_schedule: cosine_warm_restarts
    cosine_T0: 20
    cosine_Tmult: 1
    save_ckpt_per_epoches: 5
    seed: 42
    no_tensorboard: true

experiments:
  - name: "v54b_dphead_refine"
    description: "V54b: v54c-nogin-dual refine, ±2°, 20ep, 冲 Rec≥70%"
    dataset: "all"
    version: "v54b_dphead_refine"
    params:
      angle_range_deg: 2
      eval_angle_range_deg: 2
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v54c_dphead_nogin/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
