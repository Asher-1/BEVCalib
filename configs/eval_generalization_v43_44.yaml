  - label: "v44-S2-best-dual"
    dir_name: "model_small_3deg_v44_cf_bev_r_S2_quick"
    ckpt: "ckpt_best_dual.pth"
    ckpt_fallback: ["ckpt_best_medw.pth", "ckpt_best_val.pth"]
    bev_zbound_step: "4.0"
    use_drcv: 0
    rotation_only: 1
    fusion_backend: "cf_bev_r"
    mode_desc: "V44 S2 dual-gate best (3° + InstanceNorm, MEDW=0.043°)"

  - label: "v44-S2-best-val"
    dir_name: "model_small_3deg_v44_cf_bev_r_S2_quick"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    use_drcv: 0
