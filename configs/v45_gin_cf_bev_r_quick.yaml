# V45 CF-BEV-R: Gated Instance Norm (GIN) — Unifying Domain Consistency and Generalization
#
# Root cause: Instance Norm creates a tradeoff between
#   - within-domain consistency (good for bag deployment) — favors early IN training (best_dual)
#   - cross-domain generalization (good for test_data_v2) — favors late IN training (best_val)
#
# V45 solution: GatedInstanceNorm
#   - Learnable per-channel gate: gate ≈ 0 → full IN, gate ≈ 1 → bypass IN
#   - Model learns which channels need domain normalization vs domain preservation
#   - Single checkpoint should be optimal for BOTH bag and test scenarios
#
# Based on V44-opt-S1 config (proven best architecture: DLA + PitchFusion)
# Key change: use_gated_instance_norm=1 replaces use_instance_norm
#
# Expected improvement:
#   V44-S1 (no IN): test=0.582°, bag=0.369° (verified baseline)
#   V44-S2 (full IN): test=0.787°/bag=0.356° or test=0.588°/bag=0.424° (depends on ckpt)
#   V45 target: test ≤ 0.55°, bag ≤ 0.35° (BOTH in same checkpoint)
#
# Usage:
#   bash batch_train.sh configs/v45_gin_cf_bev_r_quick.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    # --- CF-BEV-R architecture ---
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    # corr_window_mode: adaptive  # 注意：此参数已解析但训练循环未读取，实际始终使用 fixed radius=cf_corr_radius

    # --- V45: Architecture (DLA + Pitch Fusion + GIN) ---
    use_dla: 1
    use_pitch_fusion: 1
    use_instance_norm: 0
    use_gated_instance_norm: 1
    gin_init_gate: 0.5

    # Backbone: Swin-Tiny
    backbone_type: swin
    backbone_lr_scale: 0.1
    # drop_path_rate: CF-BEV-R 无 deformable transformer，不生效，已移除
    head_dropout: 0.15

    # --- Training common ---
    batch_size: 16
    learning_rate: 1e-4
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false

    # --- Loss ---
    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.5,4.0,1.5"
    use_geodesic_loss: 0
    corr_alignment_weight: 0.2
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.4
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.1

    # --- Anti-shortcut ---
    tinit_dropout_prob: 0.3
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 15.0
    consistency_loss_weight: 0.5
    consistency_loss_start_epoch: 10
    zero_perturbation_prob: 0.15

    # --- Domain Augmentation (same as V44-opt) ---
    augment_mount_jitter_prob: 0.4
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.015
    augment_intrinsic: 0.03
    augment_intrinsic_cxcy: 0.015
    augment_color_jitter: 0.3

    # --- Data ---
    xyz_only: 1
    max_pcd_points: 16384
    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    pose_aware_sampling: true
    max_frames_per_seq: 500
    foreground: true
    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_pitch_flip_prob: 0.0

    # --- Eval / Gate ---
    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.10
    save_ckpt_per_epoches: 20

    seed: 42
    pretrain_ckpt: null
    resume_ckpt: auto

experiments:
  # ===== S1: ±5° from V44-opt best (GIN enabled from start) =====
  - name: "v45_gin_cf_bev_r_S1_quick"
    description: "V45 S1: ±5° GIN, from V44-S1 best_dual (MEDW=0.058°, verified on bag+test)"
    dataset: "all"
    version: "v45_gin_cf_bev_r_S1_quick"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 200
      warmup_epochs: 10
      lr_schedule: cosine_warm_restarts
      cosine_T0: 40
      cosine_Tmult: 2
      early_stopping_patience: 50
      eval_epoches: 10
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v44_cf_bev_r_S1_quick/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
      resume_ckpt: auto
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 999
      use_gated_instance_norm: 1
      gin_init_gate: 0.5

  # ===== S2: ±3° GIN fine-tune =====
  - name: "v45_gin_cf_bev_r_S2_quick"
    description: "V45 S2: ±3° GIN fine-tune"
    dataset: "all"
    version: "v45_gin_cf_bev_r_S2_quick"
    params:
      angle_range_deg: 3
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 120
      warmup_epochs: 5
      learning_rate: 5e-5
      lr_schedule: cosine_warm_restarts
      cosine_T0: 30
      cosine_Tmult: 2
      early_stopping_patience: 30
      eval_epoches: 5
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v45_gin_cf_bev_r_S1_quick/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
      resume_ckpt: auto
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 0
      per_axis_prob: 0.5
      continuous_noise_max_deg: 8.0
      use_gated_instance_norm: 1
      gin_init_gate: 0.5

  # ===== S3: ±1° precision sprint =====
  - name: "v45_gin_cf_bev_r_S3_quick"
    description: "V45 S3: ±1° GIN precision sprint"
    dataset: "all"
    version: "v45_gin_cf_bev_r_S3_quick"
    params:
      angle_range_deg: 1
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 80
      warmup_epochs: 2
      learning_rate: 1e-5
      lr_schedule: cosine_warm_restarts
      cosine_T0: 20
      cosine_Tmult: 2
      early_stopping_patience: 25
      eval_epoches: 5
      pretrain_ckpt: "logs/all_training_data/model_small_3deg_v45_gin_cf_bev_r_S2_quick/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
      resume_ckpt: auto
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 0
      per_axis_prob: 0.7
      continuous_noise_max_deg: 5.0
      axis_weights: "2.0,4.0,2.0"
      use_gated_instance_norm: 1
      gin_init_gate: 0.5
