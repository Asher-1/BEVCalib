# BEVCalib V20 — 完整沿用 ALL V8 训练配方（云 16 机 + DRCV + sample_step=2）
#
# 用途:
#   在 batch8_train_all_v20.yaml 的工程设定下（强制 DRCV、scatter/mean、sample_step=2、
#   LR √N 缩放与 max_scaled_lr），复跑 batch8_train_all_v8.yaml 中的 7 组 Pitch/Z 消融。
#
#   与原始 V8 YAML 的差异（刻意保留）:
#     - nnodes=16（与当前 V20 Cloud 一致；原 V8 为 32 节点）
#     - USE_DRCV_BACKEND=1 + voxel scatter（V20）；原 V8 注释表曾写 SPConv/DRCV 对照，此处统一 DRCV
#     - 显式 augment_pitch_* = 0（与 V20 条目一致）
#     - sample_step=2（V20 标配；原 V8 默认未写 step，通常为更疏采样）
#
# 用法:
#   bash batch_train.sh configs/batch8_train_all_v20_v8_recipe.yaml
#   bash batch_train.sh --dry-run configs/batch8_train_all_v20_v8_recipe.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0           # Z=5 分支默认；Z=10 实验在条目内改为 2.0
    USE_DRCV_BACKEND: 1
    HF_HUB_OFFLINE: 1

  params:
    angle_range_deg: 5
    trans_range: 0.15

    batch_size: 8
    learning_rate: 1e-4

    use_ddp: true
    ddp_gpus: 8
    nnodes: 32
    node_rank: null
    master_addr: null
    master_port: null
    ddp_auto_scale: 0

    use_compile: false
    rotation_only: true

    enable_axis_loss: true
    weight_axis_rotation: 0.5

    use_mlp_head: 0
    use_geodesic_loss: 0

    drop_path_rate: 0.1
    head_dropout: 0.1

    lr_schedule: step
    warmup_epochs: 5
    backbone_lr_scale: 0.1

    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    per_axis_weights: null

    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_color_jitter: 0.0

    max_frames_per_seq: 10000

    early_stopping_patience: 30
    seed: 42

    eval_epoches: 50
    grad_accum_steps: 1

    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"

    foreground: true
    no_tensorboard: true
    tensorboard_port: null

experiments:
  # =========================================================================
  # ALL V8 消融 — 配方与 configs/batch8_train_all_v8.yaml 对齐，命名加 v20_v8recipe_
  # =========================================================================
  - name: "v20_v8recipe_z10"
    description: "V8 recipe: Z=10（zbound 2.0）"
    dataset: "all"
    version: "v20_v8recipe_z10"
    env:
      BEV_ZBOUND_STEP: 2.0
    params:
      axis_weights: "1.0,1.0,1.0"

  - name: "v20_v8recipe_pitch_wt3"
    description: "V8 recipe: axis_weights=1,3,1"
    dataset: "all"
    version: "v20_v8recipe_pitch_wt3"
    params:
      axis_weights: "1.0,3.0,1.0"

  - name: "v20_v8recipe_z10_pitch_wt3"
    description: "V8 recipe: Z=10 + axis_weights=1,3,1"
    dataset: "all"
    version: "v20_v8recipe_z10_pitch_wt3"
    env:
      BEV_ZBOUND_STEP: 2.0
    params:
      axis_weights: "1.0,3.0,1.0"

# ============================================================================
# 与原 batch8_train_all_v8.yaml 实验编号对应
# ============================================================================
#
#   v20_v8recipe_z10               ↔ v8_z10
#   v20_v8recipe_pitch_wt3        ↔ v8_pitch_wt3
#   v20_v8recipe_z10_pitch_wt3    ↔ v8_z10_pitch_wt3