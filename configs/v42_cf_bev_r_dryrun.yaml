# V42 CF-BEV-R: CalibFormer-aligned Rotation-only Calibration
# Design: docs/V42_CF_BEV_DESIGN.md
#
# Four-stage progressive training:
#   S1: ±10° (80ep) → S2: ±5° (150ep) → S3: ±3° (100ep) → S4: ±1° (70ep)
# Each stage pretrained from previous stage's ckpt_best_medw_axis.pth
#
# Usage:
#   bash batch_train.sh configs/v42_cf_bev_r.yaml
#
# Gate criteria (G3):
#   test MEDW200 max(R,P,Y) < 0.10° AND Jacobian min(R,P,Y) > 0.85

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    # --- CF-BEV-R architecture ---
    fusion_backend: cf_bev_r
    rotation_only: true

    # CF-BEV-R specific
    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    corr_window_mode: adaptive

    # Backbone: Swin-Tiny (NOT DINOv2 — see §8)
    backbone_type: swin
    backbone_lr_scale: 0.1

    # --- Training common ---
    batch_size: 4
    learning_rate: 1e-4
    use_ddp: false
    ddp_gpus: 1
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false

    # --- Loss ---
    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.0,4.0,1.0"
    use_geodesic_loss: 0
    corr_alignment_weight: 0.2
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.3
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.1

    # --- Anti-shortcut (§9) ---
    tinit_dropout_prob: 0.3
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 15.0
    consistency_loss_weight: 0.5
    consistency_loss_start_epoch: 10

    # --- Data ---
    xyz_only: 1
    max_pcd_points: 16384
    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    pose_aware_sampling: true
    max_frames_per_seq: 500
    foreground: true
    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_color_jitter: 0.0
    augment_pitch_flip_prob: 0.0
    augment_mount_jitter_prob: 0.0
    augment_intrinsic: 0.0

    # --- Eval / Gate ---
    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.10
    save_ckpt_per_epoches: 20

    seed: 42
    pretrain_ckpt: null
    resume_ckpt: auto

experiments:
  # ===== DRYRUN: 3 epochs, consistency from ep0 to test 2B batch fix =====
  - name: "v42_cf_bev_r_dryrun"
    description: "DRYRUN: 3 epochs, consistency+seq from ep0"
    dataset: "all"
    version: "v42_cf_bev_r_dryrun"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 3
      warmup_epochs: 1
      lr_schedule: step
      step_size: 2
      early_stopping_patience: 0
      eval_epoches: 2
      pretrain_ckpt: null
      resume_ckpt: null
      rocr_detach_epochs: 999
      consistency_loss_start_epoch: 0
      seq_consistency_start_epoch: 0
      save_ckpt_per_epoches: 2
      enable_jacobian_eval: 0
      enable_medw_eval: 0
      enable_dual_gate_ckpt: 0

  # ===== Remaining stages removed for dryrun =====
  # S2/S3 removed for dryrun
