# V37: V36 + ProjFusion-aligned long training
# - Global BS=1024 (128/GPU × 8), LR=4e-4 (linear scaled from v36)
# - max_frames=1000, 400 epochs, extend_ratio=2.5, perturb ±10°
# - Warm-start from v36 Ep191 best val checkpoint
#
# Usage:
#   bash batch_train.sh configs/v37_native_cross_pointgpt_long.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    PROJFUSION_ROOT: /mnt/drtraining/user/dahailu/code/ProjFusion

  params:
    angle_range_deg: 10
    trans_range: 0.15

    batch_size: 128
    learning_rate: 4e-4

    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    node_rank: null
    master_addr: null
    master_port: null
    ddp_auto_scale: 0

    use_compile: false
    no_amp: 1
    rotation_only: true

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.0,1.0,1.0"
    use_balanced_axis_loss: 1

    use_mlp_head: 0
    use_geodesic_loss: 0

    drop_path_rate: 0.15
    head_dropout: 0.15

    lr_schedule: cosine_warm_restarts
    cosine_T0: 50
    cosine_Tmult: 2
    warmup_epochs: 10
    backbone_lr_scale: 0.0
    backbone_warmup_epochs: 0
    layer_wise_lr_decay: 1.0

    use_pitch_branch: 0
    pitch_aux_weight: 0.0
    bev_instance_norm: 0
    use_contrastive_extrinsic: 0
    contrastive_weight: 0.0

    augment_mount_jitter_prob: 0.5
    augment_mount_jitter_rot_sigma: 3.0
    augment_mount_jitter_trans_sigma: 0.01

    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    per_axis_weights: null

    augment_pitch_sign_flip_prob: 0.15
    augment_pitch_flip_prob: 0.20
    augment_pitch_flip_max_deg: 3.0
    augment_color_jitter: 0.15
    augment_pc_jitter: 0.02
    augment_pc_dropout: 0.05
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0

    pose_aware_sampling: true

    max_frames_per_seq: 1000
    num_epochs: 400
    save_ckpt_per_epoches: 50

    early_stopping_patience: 0
    eval_epoches: 20

    seed: 42
    grad_accum_steps: 1

    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"

    fuser_type: "diff"
    cam_drop_prob: 0.0
    cam_drop_mode: "zero"

    foreground: true

    domain_adversarial: 0
    domain_adversarial_weight: 0.0
    num_domains: 0

experiments:
  - name: "v37_native_cross_pointgpt_long"
    description: "V37: V36+PointGPT long train, BS1024, extend_ratio=2.5, ±10deg"
    dataset: "all"
    version: "v37_native_cross_pointgpt_long"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_freeze_layers: "0:-2"
      native_cross: 1
      native_cross_pc_groups: 128
      native_cross_n_harmonic: 6
      native_cross_n_layers: 1
      native_cross_dual_branch: 1
      native_cross_use_pointgpt: 1
      native_cross_pointgpt_ckpt: /mnt/drtraining/user/dahailu/code/ProjFusion/pretrained/kitti_pointgpt_tiny.pth
      native_cross_pointgpt_config: /mnt/drtraining/user/dahailu/code/ProjFusion/cfg/pointgpt/finetune_kitti_tiny.yaml
      native_cross_pointgpt_max_depth: 50.0
      native_cross_extend_ratio: 2.5
      explicit_tinit: 0
      pretrain_ckpt: /mnt/drtraining/user/dahailu/code/BEVCalib/logs/all_training_data/model_small_5deg_v36_native_cross_pointgpt/all_training_data_scratch/checkpoint/ckpt_best_val.pth
      resume_ckpt: /mnt/drtraining/user/dahailu/code/BEVCalib/logs/all_training_data/model_small_10deg_v37_native_cross_pointgpt_long/all_training_data_scratch/checkpoint/ckpt_250.pth
      learning_rate: 4e-4
      warmup_epochs: 10
      batch_size: 128
      fuser_type: "diff"
