# V47-512g CF-BEV-R Quick: Ultra-High Spatial Resolution Experiment
#
# Same as V47 (V45c + V46 anti-shortcut) but with cf_n_groups=512
# for 4x spatial resolution vs baseline (128) and 2x vs V47 (256).
#
# Hypothesis: If 128→256 brought genuine recovery from ~17% to ~55%,
# 256→512 may push it to 65-75% (diminishing returns expected).
#
# Memory: 512 groups tested — G=256 bs=12 uses ~24GB/46GB.
# G=512 bs=12 estimated ~28-30GB, safely fits L20 46GB.
#
# This is an ABLATION experiment to quantify the marginal value of
# spatial resolution beyond 256 groups.
#
# Quick version: single-node 8-GPU
#
# Usage:
#   bash batch_train.sh configs/v47_512g_cf_bev_r_quick.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 512
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    corr_window_mode: adaptive

    use_dla: 1
    use_pitch_fusion: 1
    use_instance_norm: 0
    use_gated_instance_norm: 1
    gin_init_gate: 0.5

    backbone_type: swin
    backbone_lr_scale: 0.1
    head_dropout: 0.15

    batch_size: 12
    learning_rate: 1e-4
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.5,4.0,1.5"
    use_geodesic_loss: 0
    corr_alignment_weight: 0.2
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.4
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.1

    tinit_dropout_prob: 0.3
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 15.0
    consistency_loss_weight: 0.5
    consistency_loss_start_epoch: 10
    zero_perturbation_prob: 0.25
    symmetric_perturb: 1
    overcorrection_penalty: 2.0
    use_magnitude_head: 1
    magnitude_loss_weight: 0.3

    augment_mount_jitter_prob: 0.4
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.015
    augment_intrinsic: 0.03
    augment_intrinsic_cxcy: 0.015
    augment_color_jitter: 0.3

    xyz_only: 1
    max_pcd_points: 16384
    perturb_distribution: magnitude_balanced
    per_axis_prob: 0.3
    pose_aware_sampling: true
    max_frames_per_seq: 500
    foreground: true
    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_pitch_flip_prob: 0.0

    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.10
    save_ckpt_per_epoches: 10

    seed: 42
    pretrain_ckpt: null
    resume_ckpt: auto

experiments:
  # ===== S1 only: ±5° ablation to measure 512g vs 256g marginal gain =====
  # Pretrain from V45c-S1-quick-best-val (256 groups).
  # 256→512 PointEncoder weights: FPS is algorithmic (no learned params),
  # MLP is shared, so checkpoint loads cleanly. Only the number of FPS
  # centroids changes at runtime.
  - name: "v47_512g_cf_bev_r_S1_quick"
    description: "V47-512g S1: ±5° 512groups+GIN+adaptive+anti-shortcut (ablation)"
    dataset: "all"
    version: "v47_512g_cf_bev_r_S1_quick"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 300
      warmup_epochs: 10
      lr_schedule: cosine_warm_restarts
      cosine_T0: 60
      cosine_Tmult: 2
      early_stopping_patience: 60
      eval_epoches: 10
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v45c_cf_bev_r_S1_quick/all_training_data_scratch/checkpoint/ckpt_best_val.pth"
      resume_ckpt: auto
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 999
      zero_perturbation_prob: 0.25
      per_axis_prob: 0.4
      symmetric_perturb: 1

  # ===== S2: ±3° with 35% experience replay =====
  # Tests whether 512g architecture benefits from narrow-range fine-tuning
  # with experience replay to mitigate generalization collapse.
  - name: "v47_512g_cf_bev_r_S2_quick"
    description: "V47-512g S2: ±3° 512g + mag_balanced + replay 35% + overcorr"
    dataset: "all"
    version: "v47_512g_cf_bev_r_S2_quick"
    params:
      angle_range_deg: 3
      trans_range: 0.0
      eval_angle_range_deg: 5
      num_epochs: 120
      warmup_epochs: 5
      learning_rate: 5e-5
      lr_schedule: cosine_warm_restarts
      cosine_T0: 30
      cosine_Tmult: 2
      early_stopping_patience: 35
      eval_epoches: 10
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v47_512g_cf_bev_r_S1_quick/all_training_data_scratch/checkpoint/ckpt_best_val.pth"
      resume_ckpt: auto
      rocr_detach_epochs: 999
      seq_consistency_start_epoch: 0
      per_axis_prob: 0.5
      continuous_noise_max_deg: 8.0
      zero_perturbation_prob: 0.25
      symmetric_perturb: 1
      multi_range_prob: 0.35
      multi_range_angle: 5.0
