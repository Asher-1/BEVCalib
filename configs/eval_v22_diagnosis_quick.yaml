    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"
    angle_deg: 5
    z_voxels: 5
    version: "v22"
    mode_desc: "A3 quick: lr100, rotation_only"

  # =========================================================================
  # Phase B (quick) — joint variants
  # =========================================================================
  - label: "v22-B1-lr050-joint-quick"
    dir_name: "model_small_5deg_v22_B1_lr050_joint_quick"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    rotation_only: 0
    use_drcv: 0
    use_mlp_head: 0
    voxel_mode: "hard"
