# V78-dinov2-query-rpy02-recovery-guard
#
# Strict target:
#   Deployment R/P/Y generalization error should be evaluated against all axes
#   < 0.2 deg, not the older 0.3 deg business threshold.
#
# Why this is not a V77 continuation:
#   V77 passed internal train-val dual gate but failed external strict RPY02:
#     - random sequence-median = 0.3716 deg, Roll/Pitch above 0.2 deg
#     - fixed 2/2/2 adaptive mean recovery = 71.0%, below the 72% floor
#   More V77 full training is low value. V78 goes back to the strongest
#   random-generalization prior: V29-G3 Query-BEV + DINOv2-small.
#
# Design:
#   - Load V29-G3 best-val as the low-bias prior.
#   - Keep DINOv2 backbone effectively frozen to preserve i.i.d. noise behavior.
#   - Add only gentle fixed-inject/Jacobian pressure.
#   - Strongly protect zero-drift and small residual tails for RPY<0.2.

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    CUDA_VISIBLE_DEVICES: "0,1,2,5"
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    rotation_only: true

    cam2bev_mode: "query"
    backbone_type: "dinov2"
    backbone_variant: "dinov2-small"
    freeze_backbone: 1
    backbone_freeze_layers: "0:-2"
    backbone_lr_scale: 0.0
    use_mlp_head: 0
    drop_path_rate: 0.04
    head_dropout: 0.08

    batch_size: 8
    learning_rate: 7.0e-06
    wd: 0.008
    use_ddp: true
    ddp_gpus: 4
    nnodes: 1
    master_port: 29678
    ddp_auto_scale: 0
    no_amp: 1

    enable_axis_loss: true
    weight_axis_rotation: 0.66
    axis_weights: "1.20,1.35,1.05"
    use_balanced_axis_loss: 1

    perturb_distribution: truncated_normal
    zero_perturbation_prob: 0.34
    multi_scale_perturb: "0.25:0.14,0.5:0.20,1.0:0.25,2.0:0.28,3.5:0.09,5.0:0.04"
    per_axis_prob: 0.42
    per_axis_weights: "0.34,0.36,0.30"
    symmetric_perturb: 1
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 2.0
    tinit_dropout_prob: 0.008
    overcorrection_penalty: 1.25

    use_mgda: 0
    mgda_start_epoch: 0
    mgda_include_inject: 1
    mgda_include_photo: 0

    jacobian_loss_weight: 0.020
    jacobian_loss_start_epoch: 0
    jacobian_loss_probe_deg: 2.0
    jacobian_loss_interval: 8
    jacobian_loss_axis_weights: "1.05,1.15,1.00"

    zero_drift_loss_weight: 0.52
    zero_drift_loss_weight_start: 0.34
    zero_drift_loss_ramp_epochs: 4
    zero_drift_loss_start_epoch: 0
    zero_drift_dedicated_ratio: 0.34

    inject_recovery_loss_weight: 0.26
    inject_recovery_loss_start_epoch: 0
    inject_recovery_magnitude_deg: 2.0
    inject_recovery_dedicated_ratio: 0.16

    augment_mount_jitter_prob: 0.08
    augment_mount_jitter_rot_sigma: 0.35
    augment_mount_jitter_trans_sigma: 0.004
    augment_pitch_sign_flip_prob: 0.0
    augment_pitch_flip_prob: 0.015
    augment_pitch_flip_max_deg: 0.35
    augment_color_jitter: 0.04
    augment_pc_jitter: 0.006
    augment_pc_dropout: 0.012
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0

    pose_aware_sampling: true
    max_frames_per_seq: 300
    eval_epoches: 2
    save_ckpt_per_epoches: 2
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 2.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.20
    dual_gate_medw_max: 0.12
    enable_jacobian_gate_ckpt: 1
    jacobian_early_stop_min: 0.08
    jacobian_early_stop_patience: 4
    medw_eval_max_frames: 200

    seed: 780
    grad_accum_steps: 1
    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"
    fuser_type: "diff"
    no_tensorboard: true

experiments:
  - name: "v78_dinov2_query_rpy02_recovery_guard_smoke"
    description: "V78 smoke: V29-G3 low-bias prior plus strict RPY<0.2 zero-drift guard"
    dataset: "all"
    version: "v78_dinov2_query_rpy02_recovery_guard_smoke"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      batch_size: 8
      ddp_gpus: 4
      num_epochs: 8
      warmup_epochs: 1
      lr_schedule: cosine_warm_restarts
      cosine_T0: 8
      cosine_Tmult: 1
      early_stopping_patience: 999
      max_frames_per_seq: 220
      eval_epoches: 2
      save_ckpt_per_epoches: 2
      pretrain_ckpt: "logs/all_training_data/v29_quick/model_small_5deg_v29_G3_partial_unfreeze_dinov2_quick/all_training_data_scratch/checkpoint/ckpt_best_val.pth"

  - name: "v78_dinov2_query_rpy02_recovery_guard_full"
    description: "V78 full: launch only if smoke preserves random RPY02 sequence median and improves fixed recovery"
    dataset: "all"
    version: "v78_dinov2_query_rpy02_recovery_guard"
    params:
      angle_range_deg: 5
      trans_range: 0.0
      eval_angle_range_deg: 5
      batch_size: 8
      ddp_gpus: 4
      learning_rate: 5.0e-06
      num_epochs: 28
      warmup_epochs: 2
      lr_schedule: cosine_warm_restarts
      cosine_T0: 14
      cosine_Tmult: 1
      early_stopping_patience: 8
      max_frames_per_seq: 500
      eval_epoches: 2
      save_ckpt_per_epoches: 2
      inject_recovery_loss_weight: 0.22
      inject_recovery_dedicated_ratio: 0.14
      jacobian_loss_weight: 0.016
      zero_drift_loss_weight: 0.56
      zero_drift_dedicated_ratio: 0.36
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v78_dinov2_query_rpy02_recovery_guard_smoke/all_training_data_scratch/checkpoint/ckpt_best_medw.pth"
