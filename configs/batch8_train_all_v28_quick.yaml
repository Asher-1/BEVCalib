# V28 Quick: Fast validation of architecture-level domain gap mitigation
#
# All 5 experiments (F1-F5) with quick settings:
#   - nnodes: 1 (single machine)
#   - max_frames_per_seq: 500 (subset of training data)
#   - num_epochs: 200 (enough to see convergence trends)
#   - batch_size: 8
#   - backbone_lr_scale: 0.3
#
# Usage:
#   bash batch_train.sh configs/batch8_train_all_v28_quick.yaml
#   bash batch_train.sh --dry-run configs/batch8_train_all_v28_quick.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 3
  retry_delay: 30

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1

  params:
    angle_range_deg: 5
    trans_range: 0.15

    batch_size: 16
    learning_rate: 1e-4

    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    node_rank: null
    master_addr: null
    master_port: null
    ddp_auto_scale: 0

    use_compile: false
    no_amp: 1
    rotation_only: true

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.0,1.0,1.0"
    use_balanced_axis_loss: 1

    use_mlp_head: 0
    use_geodesic_loss: 0

    drop_path_rate: 0.15
    head_dropout: 0.15

    lr_schedule: step
    warmup_epochs: 5
    backbone_lr_scale: 0.3
    backbone_warmup_epochs: 10
    layer_wise_lr_decay: 0.65
    step_size: 40

    use_pitch_branch: 0
    pitch_aux_weight: 0.0
    bev_instance_norm: 0
    use_contrastive_extrinsic: 0
    contrastive_weight: 0.0

    augment_mount_jitter_prob: 0.15
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.01

    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    per_axis_weights: null

    augment_pitch_sign_flip_prob: 0.15
    augment_pitch_flip_prob: 0.20
    augment_pitch_flip_max_deg: 3.0
    augment_color_jitter: 0.15
    augment_pc_jitter: 0.02
    augment_pc_dropout: 0.05
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0

    pose_aware_sampling: true

    max_frames_per_seq: 500
    num_epochs: 200
    save_ckpt_per_epoches: 20
    early_stopping_patience: 20
    eval_epoches: 20

    seed: 42
    grad_accum_steps: 1

    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"

    fuser_type: "diff"
    cam_drop_prob: 0.0
    cam_drop_mode: "zero"

    foreground: true
    no_tensorboard: true
    tensorboard_port: null

    cam2bev_mode: "lss"
    backbone_type: "swin"
    backbone_variant: "dinov2-small"
    freeze_backbone: 0
    domain_adversarial: 0
    domain_adversarial_weight: 0.1
    num_domains: 0

experiments:
  # F1: Query-BEV + Swin (isolate depth-free effect)
  - name: "v28_F1_query_bev_swin_quick"
    description: "F1: Query-based BEV + Swin-Tiny"
    dataset: "all"
    version: "v28_F1_query_bev_swin_quick"
    params:
      cam2bev_mode: "query"
      backbone_type: "swin"

  # F2: LSS + DINOv2 (isolate backbone effect)
  - name: "v28_F2_lss_dinov2_quick"
    description: "F2: LSS + DINOv2-Small backbone"
    dataset: "all"
    version: "v28_F2_lss_dinov2_quick"
    params:
      cam2bev_mode: "lss"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"

  # F3: Query-BEV + DINOv2 (full architectural upgrade)
  - name: "v28_F3_query_dinov2_quick"
    description: "F3: Query-BEV + DINOv2-Small"
    dataset: "all"
    version: "v28_F3_query_dinov2_quick"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"

  # F5: Frozen DINOv2 (simpler, before F4)
  - name: "v28_F5_query_dinov2_frozen_quick"
    description: "F5: Query-BEV + frozen DINOv2-Small"
    dataset: "all"
    version: "v28_F5_query_dinov2_frozen_quick"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_lr_scale: 0.0
      drop_path_rate: 0.0

  # F4: Kitchen sink (most complex, last)
  - name: "v28_F4_query_dinov2_dann_quick"
    description: "F4: Query-BEV + DINOv2 + DANN + strong jitter"
    dataset: "all"
    version: "v28_F4_query_dinov2_dann_quick"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      drop_path_rate: 0.2
      head_dropout: 0.3
      augment_mount_jitter_prob: 0.5
      augment_mount_jitter_rot_sigma: 2.0
      domain_adversarial: 1
      domain_adversarial_weight: 0.1

# ============================================================================
# Quick Matrix: 5 experiments x 200 epochs with 500 frames/seq
# batch_size=8, nnodes=1, backbone_lr_scale=0.3
# DINOv2 weights: ckpt/checkpoints/dinov2_vits14_pretrain.pth (auto-loaded)
#
#   | Order | ID    | BEV Mode | Backbone     | DANN | Freeze | Key Question               |
#   |-------|-------|----------|--------------|------|--------|----------------------------|
#   | 1     | F1_q  | Query    | Swin         | No   | No     | Does depth-free help?      |
#   | 2     | F2_q  | LSS      | DINOv2-S     | No   | No     | Does DINOv2 alone help?    |
#   | 3     | F3_q  | Query    | DINOv2-S     | No   | No     | Architecture upgrade?      |
#   | 4     | F5_q  | Query    | DINOv2-S(F)  | No   | Yes    | Frozen self-sup features?  |
#   | 5     | F4_q  | Query    | DINOv2-S     | Yes  | No     | Architecture + training?   |
