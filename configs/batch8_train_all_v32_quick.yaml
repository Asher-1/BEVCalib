# V32 Quick: T_init 不变性训练快速验证 (单机 8 卡, ~2-4 小时)
#
# 缩短版配置: 100 epoch, 更频繁评估, 用于验证 v32 机制是否正常工作
# 成功标准: loss 正常下降, consistency loss 随训练降低, 日志无异常
#
# Usage:
#   bash batch_train.sh configs/batch8_train_all_v32_quick.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 0
  retry_delay: 30

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1

  params:
    angle_range_deg: 5
    trans_range: 0.15

    batch_size: 16
    learning_rate: 4e-4

    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    node_rank: null
    master_addr: null
    master_port: null
    ddp_auto_scale: 0

    use_compile: false
    no_amp: 1
    rotation_only: true

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.0,1.0,1.0"
    use_balanced_axis_loss: 1

    use_mlp_head: 0
    use_geodesic_loss: 0

    drop_path_rate: 0.15
    head_dropout: 0.15

    lr_schedule: cosine_warm_restarts
    cosine_T0: 30
    cosine_Tmult: 2
    warmup_epochs: 3
    backbone_lr_scale: 0.01
    backbone_warmup_epochs: 5
    layer_wise_lr_decay: 0.65

    use_pitch_branch: 0
    pitch_aux_weight: 0.0
    bev_instance_norm: 0
    use_contrastive_extrinsic: 0
    contrastive_weight: 0.0

    augment_mount_jitter_prob: 0.7
    augment_mount_jitter_rot_sigma: 3.0
    augment_mount_jitter_trans_sigma: 0.01

    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    per_axis_weights: null

    augment_pitch_sign_flip_prob: 0.15
    augment_pitch_flip_prob: 0.20
    augment_pitch_flip_max_deg: 3.0
    augment_color_jitter: 0.15
    augment_pc_jitter: 0.02
    augment_pc_dropout: 0.05
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0

    pose_aware_sampling: true

    max_frames_per_seq: 500
    num_epochs: 100
    save_ckpt_per_epoches: 20

    early_stopping_patience: 0
    eval_epoches: 10

    seed: 42
    grad_accum_steps: 1

    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"

    fuser_type: "diff"
    cam_drop_prob: 0.0
    cam_drop_mode: "zero"

    foreground: true

    domain_adversarial: 1
    domain_adversarial_weight: 0.15
    num_domains: 0

experiments:
  # =========================================================================
  # v32_1_quick: v32.1 快速验证 (EMA + continuous noise)
  # 基于 v32_quick，添加 v32.1 新机制
  # =========================================================================
  - name: "v32_1_quick"
    description: "V32.1 Quick: EMA + continuous noise (100 epochs)"
    dataset: "all"
    version: "v32_1_quick"
    params:
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_freeze_layers: "0:-2"
      tinit_dropout_prob: 0.3
      consistency_loss_weight: 0.5
      consistency_loss_start_epoch: 5
      progressive_angle_start: 2.0
      progressive_angle_end: 5.0
      progressive_warmup_epochs: 50
      ema_consistency: 1
      ema_decay: 0.996
      continuous_tinit_noise: 1
      continuous_noise_max_deg: 30.0

  # =========================================================================
  # v33_corr_quick: V33-B 快速验证 Spatial Correlation Fusion
  # 用 correlation 替代 concat+transformer+global_pool
  # 验证是否能打破 shortcut learning
  # =========================================================================
  - name: "v33_corr_quick"
    description: "V33-B Quick: Spatial Correlation Fusion (50 epochs)"
    dataset: "all"
    version: "v33_corr_quick"
    params:
      epochs: 50
      eval_freq: 5
      save_every: 10
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_freeze_layers: "0:-2"
      correlation_fusion: 1
      fuser_type: "diff"

  # =========================================================================
  # v34_xcorr_quick: V34 快速验证 Cross-Correlation Cost Volume Fusion
  # 用 cost volume 滑窗互相关替代逐像素余弦相似度
  # 验证能否打破 v33 的固定偏移 shortcut learning
  # =========================================================================
  - name: "v34_xcorr_quick"
    description: "V34 Quick: Cross-Correlation Cost Volume (50 epochs)"
    dataset: "all"
    version: "v34_xcorr_quick"
    params:
      epochs: 50
      eval_freq: 5
      save_every: 10
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_freeze_layers: "0:-2"
      cross_correlation_fusion: 1
      fuser_type: "diff"

  # =========================================================================
  # v35_tinit_quick: V35 Phase1 快速验证 显式 T_init RPY 编码
  # 将 T_init 的 RPY 通过 Fourier 编码直接注入预测头
  # 突破 BEV 投影的隐式 T_init 信息瓶颈
  # =========================================================================
  - name: "v35_tinit_quick"
    description: "V35 Phase1: Explicit T_init RPY Encoding (50 epochs)"
    dataset: "all"
    version: "v35_tinit_quick"
    params:
      epochs: 50
      eval_freq: 5
      save_every: 10
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_freeze_layers: "0:-2"
      explicit_tinit: 1
      fuser_type: "diff"

  # =========================================================================
  # v35b_tinit_sens: V35 Phase2 显式T_init + 对比灵敏度损失
  # 在 Phase1 基础上添加 TInitSensitivityLoss
  # 强制 BEV 特征对 T_init 变化产生不同的表示
  # =========================================================================
  - name: "v35b_tinit_sens"
    description: "V35 Phase2: Explicit T_init + Sensitivity Loss (100 epochs)"
    dataset: "all"
    version: "v35b_tinit_sens"
    params:
      epochs: 100
      eval_freq: 10
      save_every: 20
      cam2bev_mode: "query"
      backbone_type: "dinov2"
      backbone_variant: "dinov2-small"
      freeze_backbone: 1
      backbone_freeze_layers: "0:-2"
      explicit_tinit: 1
      tinit_sensitivity_weight: 0.5
      fuser_type: "diff"