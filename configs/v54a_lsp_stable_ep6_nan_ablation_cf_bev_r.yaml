# V54a-stable ep6 NaN ablation: 延后 zero_drift / inject / MGDA
#
# NaN 从 ep6 起（早于 jacobian ep10、LSP ep15），对照 MGDA 与辅助 loss 开启时机。
#
# Usage:
#   bash batch_train.sh configs/v54a_lsp_stable_ep6_nan_ablation_cf_bev_r.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true
    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1
    use_pitch_fusion: 1
    pitch_vertical_bands: 5
    corr_window_mode: adaptive
    use_dla: 1
    use_instance_norm: 0
    use_gated_instance_norm: 1
    gin_channels: 128
    gin_init_gate: 0.5
    gin_gate_reg_weight: 0.01
    gin_gate_reg_target: 0.5
    use_dp_head: 0
    backbone_type: swin
    backbone_lr_scale: 0.1
    head_dropout: 0.05
    batch_size: 16
    learning_rate: 3.2049534093491216e-05
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false
    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.5,5.5,1.5"
    use_geodesic_loss: 0
    corr_alignment_weight: 0.3
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.3
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.1
    tinit_dropout_prob: 0.5
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 15.0
    zero_perturbation_prob: 0.15
    symmetric_perturb: 1
    overcorrection_penalty: 2.0
    use_magnitude_head: 1
    magnitude_loss_weight: 0.3
    multi_scale_perturb: "0.5:0.30,1.0:0.25,2.0:0.15"
    use_mgda: 1
    mgda_start_epoch: 5
    mgda_include_inject: 1
    mgda_include_photo: 1
    jacobian_loss_weight: 0.10
    jacobian_loss_start_epoch: 10
    jacobian_loss_probe_deg: 2.0
    jacobian_loss_interval: 4
    zero_drift_loss_weight: 0.3
    zero_drift_loss_weight_start: 0.1
    zero_drift_loss_ramp_epochs: 10
    zero_drift_loss_start_epoch: 5
    zero_drift_dedicated_ratio: 0.12
    inject_recovery_loss_weight: 0.25
    inject_recovery_loss_start_epoch: 5
    inject_recovery_magnitude_deg: 2.0
    inject_recovery_dedicated_ratio: 0.08
    use_lsp_loss: 1
    lsp_weight: 0.20
    lsp_weight_start: 0.0
    lsp_ramp_epochs: 25
    lsp_start_epoch: 15
    lsp_lambda_ssim: 0.1
    lsp_max_points: 2048
    lsp_downsample: 6
    lsp_loss_clip: 1.5
    lsp_min_valid_ratio: 0.05
    rig_consistency_weight: 0.1
    rig_consistency_start_epoch: 5
    pose_release_epoch: 15
    pose_release_joint_epoch: 50
    pose_release_corr_lr_scale_joint: 0.5
    freeze_backbone_epoch: 999
    progressive_angle_start: 2.0
    progressive_angle_end: 5.0
    progressive_warmup_epochs: 50
    augment_mount_jitter_prob: 0.4
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.015
    augment_intrinsic: 0.03
    augment_intrinsic_cxcy: 0.015
    augment_color_jitter: 0.3
    xyz_only: 1
    max_pcd_points: 16384
    perturb_distribution: magnitude_balanced
    per_axis_prob: 0.4
    pose_aware_sampling: true
    max_frames_per_seq: 200
    foreground: true
    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_pitch_flip_prob: 0.0
    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.25
    enable_jacobian_gate_ckpt: 1
    jacobian_early_stop_min: 0.85
    jacobian_early_stop_patience: 3
    save_ckpt_per_epoches: 5
    seed: 42
    consistency_loss_weight: 0.0
    consistency_loss_start_epoch: 999
    conditional_consistency_threshold: 0.0
    quat_bias_reset_alpha: 0.1
    decoder_pool_mode: mean
    rocr_detach_epochs: 999
    seq_consistency_start_epoch: 999

experiments:
  - name: "v54a_stable_delay_zd_inj_smoke"
    description: "ep6 NaN ablation: ZD/inject/rig 延后至 ep15"
    dataset: "all"
    version: "v54a_stable_delay_zd_inj_smoke"
    params:
      num_epochs: 15
      warmup_epochs: 3
      lr_schedule: cosine_warm_restarts
      cosine_T0: 15
      cosine_Tmult: 1
      early_stopping_patience: 999
      eval_epoches: 5
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v53c_partial_gin_full/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
      zero_drift_loss_start_epoch: 15
      inject_recovery_loss_start_epoch: 15
      rig_consistency_start_epoch: 15

  - name: "v54a_stable_delay_mgda_smoke"
    description: "ep6 NaN ablation: MGDA 延后至 ep15"
    dataset: "all"
    version: "v54a_stable_delay_mgda_smoke"
    params:
      num_epochs: 15
      warmup_epochs: 3
      lr_schedule: cosine_warm_restarts
      cosine_T0: 15
      cosine_Tmult: 1
      early_stopping_patience: 999
      eval_epoches: 5
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v53c_partial_gin_full/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
      mgda_start_epoch: 15

  - name: "v54a_stable_delay_all_aux_smoke"
    description: "ep6 NaN ablation: MGDA+ZD+inject+rig 均 ep15"
    dataset: "all"
    version: "v54a_stable_delay_all_aux_smoke"
    params:
      num_epochs: 15
      warmup_epochs: 3
      lr_schedule: cosine_warm_restarts
      cosine_T0: 15
      cosine_Tmult: 1
      early_stopping_patience: 999
      eval_epoches: 5
      pretrain_ckpt: "logs/all_training_data/model_small_5deg_v53c_partial_gin_full/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
      mgda_start_epoch: 15
      zero_drift_loss_start_epoch: 15
      inject_recovery_loss_start_epoch: 15
      rig_consistency_start_epoch: 15
