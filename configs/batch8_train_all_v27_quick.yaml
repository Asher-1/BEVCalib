# V27 Quick: 快速验证版 — 单机8卡, 限500帧/序列, 50 epochs
#
# 目的: 快速验证各实验方向是否有效(~1-2小时/实验)，然后在全量配置上训练最优组合
# 仅保留最关键的4个实验: E5(核心), E9(DANN), E10(最强), E1(基线)
#
# Usage:
#   bash batch_train.sh configs/batch8_train_all_v27_quick.yaml
#   bash batch_train.sh --dry-run configs/batch8_train_all_v27_quick.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 3
  retry_delay: 30

defaults:
  env:
    # Z=5 coarse BEV (BEV_ZBOUND_STEP=4.0); E8 overrides to Z=10 (step 2.0), matching prior batch configs.
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1

  params:
    angle_range_deg: 5
    trans_range: 0.15

    batch_size: 16
    learning_rate: 1e-4

    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    node_rank: null
    master_addr: null
    master_port: null
    ddp_auto_scale: 0

    use_compile: false
    no_amp: 1
    rotation_only: true

    # --- Loss (axis loss on; balanced loss toggled per experiment E1 vs E2+) ---
    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.0,1.0,1.0"
    use_balanced_axis_loss: 0

    use_mlp_head: 0
    use_geodesic_loss: 0

    # Mild regularization for E1–E4 (closer to historical V24-B-style training); E5+ override.
    drop_path_rate: 0.1
    head_dropout: 0.1

    lr_schedule: step
    warmup_epochs: 5
    backbone_lr_scale: 0.5
    backbone_warmup_epochs: 10
    layer_wise_lr_decay: 0.65
    step_size: 80

    use_pitch_branch: 0
    pitch_aux_weight: 0.0
    bev_instance_norm: 0
    use_contrastive_extrinsic: 0
    contrastive_weight: 0.0

    # Mount jitter: sigma chosen for when prob>0; E1/E2 keep prob=0 (no jitter).
    augment_mount_jitter_prob: 0.0
    augment_mount_jitter_rot_sigma: 2.0
    augment_mount_jitter_trans_sigma: 0.01

    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    per_axis_weights: null

    augment_pitch_sign_flip_prob: 0.15
    augment_pitch_flip_prob: 0.20
    augment_pitch_flip_max_deg: 3.0
    augment_color_jitter: 0.15
    augment_pc_jitter: 0.02
    augment_pc_dropout: 0.05
    augment_intrinsic: 0.0
    augment_intrinsic_cxcy: 0.0

    pose_aware_sampling: true
    max_frames_per_seq: 500
    num_epochs: 400
    save_ckpt_per_epoches: 50

    early_stopping_patience: 30
    seed: 42

    eval_epoches: 50
    grad_accum_steps: 1

    voxel_mode: "hard"
    scatter_reduce: "sum"
    to_bev_mode: "concat"

    fuser_type: "diff"
    cam_drop_prob: 0.0
    cam_drop_mode: "zero"

    foreground: true
    no_tensorboard: true
    tensorboard_port: null

    domain_adversarial: 0
    domain_adversarial_weight: 0.1
    num_domains: 0

experiments:
  # ===================== 优先级: 最关键实验优先训练 =====================
  #
  # 训练顺序策略:
  #   1. E5 — 核心recipe (balanced + jitter + 强正则)，最可能超越V24-B的非DANN方案
  #   2. E9 — E5 + DANN，隔离域对抗训练的独立贡献
  #   3. E10 — 最强组合 (强jitter + DANN)，理论最优
  #   4. E1 — V24-B基线复现，用于对比
  #   5-10 — 消融实验，按信息量排序

  # =========================================================================
  # [优先1] E5: BalancedAxisLoss + mount jitter + 强正则 — 核心域泛化recipe
  # =========================================================================
  - name: "v27_E5_balanced_mount_strong_reg_quick"
    description: "E5-quick: BalancedAxis + mount jitter(p=0.5 σ=2.0) + drop_path=0.2 head_dropout=0.3"
    dataset: "all"
    version: "v27_E5_balanced_mount_strong_reg_quick"
    params:
      use_balanced_axis_loss: 1
      augment_mount_jitter_prob: 0.5
      augment_mount_jitter_rot_sigma: 2.0
      drop_path_rate: 0.2
      head_dropout: 0.3

  # =========================================================================
  # [优先2] E9: E5 + DANN — 域对抗训练，梯度反转迫使域不变特征
  # =========================================================================
  - name: "v27_E9_dann_balanced_mount_reg_quick"
    description: "E9-quick: E5 + DANN (domain_adversarial=1, weight=0.1)"
    dataset: "all"
    version: "v27_E9_dann_balanced_mount_reg_quick"
    params:
      use_balanced_axis_loss: 1
      augment_mount_jitter_prob: 0.5
      augment_mount_jitter_rot_sigma: 2.0
      drop_path_rate: 0.2
      head_dropout: 0.3
      domain_adversarial: 1
      domain_adversarial_weight: 0.1

  # =========================================================================
  # [优先3] E10: E7 + DANN — 最强jitter + DANN (最大域泛化推力)
  # =========================================================================
  - name: "v27_E10_dann_very_strong_jitter_quick"
    description: "E10-quick: E7 + DANN (prob=0.7 sigma=3.0 + DANN weight=0.15)"
    dataset: "all"
    version: "v27_E10_dann_very_strong_jitter_quick"
    params:
      use_balanced_axis_loss: 1
      augment_mount_jitter_prob: 0.7
      augment_mount_jitter_rot_sigma: 3.0
      drop_path_rate: 0.2
      head_dropout: 0.3
      domain_adversarial: 1
      domain_adversarial_weight: 0.15

  # =========================================================================
  # [优先4] E1: V24-B基线复现 — 验证~0.678°基线
  # =========================================================================
  - name: "v27_E1_v24b_repro_quick"
    description: "E1-quick: V24-B reproduction baseline (no BalancedAxisLoss, no mount jitter)"
    dataset: "all"
    version: "v27_E1_v24b_repro_quick"

# =============================================================================
# Quick validation: 仅4个关键实验 (E5, E9, E10, E1)
# =============================================================================
#
# | Exp | BalancedAxis | Mount jitter   | Regularization | DANN   |
# |-----|--------------|----------------|----------------|--------|
# | E5  | on           | p=0.5 σ=2.0    | 0.2 / 0.3      | off    |
# | E9  | on           | p=0.5 σ=2.0    | 0.2 / 0.3      | w=0.10 |
# | E10 | on           | p=0.7 σ=3.0    | 0.2 / 0.3      | w=0.15 |
# | E1  | off          | off            | 0.1 / 0.1      | off    |
