# test_models2 全量泛化评估 (test_data_v2)
#
# 模型架构参数由 evaluate_checkpoint.py 从 checkpoint 自动检测；保留 use_drcv: 1；
# bev_zbound_step 须手写。
#
# 包含 15 个模型，按系列分组:
#   - v16 系列 (2个): DDP 训练 + 数据增强消融
#   - v20-5° 系列 (7个): v8/v6 recipe, z/pitch_wt 消融, spconv vs drcv
#   - v20-10° 系列 (2个): 大扰动范围训练
#   - v21 系列 (3个): 泛化增强实验 (augmentation ablation)
#   - quick 系列 (1个): 快速训练验证
#
# 重要: models_dir 必须是 `logs/all_training_data`（不要写成 `.../test_models2`），
# 否则 os.path.basename(MODELS_DIR) 会变成 `test_models2`，checkpoint 目录会找不到。
#
# 用法:
#   HF_HUB_OFFLINE=1 python run_generalization_eval.py --config configs/eval_generalization_test_models2_v3.yaml
#   HF_HUB_OFFLINE=1 python run_generalization_eval.py --config configs/eval_generalization_test_models2_v3.yaml --parallel -1

bevcalib_root: "/mnt/drtraining/user/dahailu/code/BEVCalib"
models_dir: "logs/all_training_data"
test_data: "/mnt/drtraining/user/dahailu/data/bevcalib/test_data_v2"
output_dir: "logs/evaluations/generalization_eval_test_models2_v3"
eval_script: "evaluate_checkpoint.py"

eval_params:
  angle_range: 5.0
  trans_range: 0.15
  batch_size: 16
  vis_interval: 200
  timeout: 7200
  eval_max_frames_per_seq: 400

models:
  # ============================================================================
  # v16 系列: DDP + drcv 后端 + 数据增强消融
  # 共同: z=10, drcv, scatter/mean/concat, axis_loss wt=1:3:1
  # ============================================================================

  - label: "v16-ultimate"
    dir_name: "test_models2/model_small_5deg_v16_ultimate"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    use_drcv: 1
    angle_deg: 5
    z_voxels: 10
    version: "v16"
    mode_desc: "L20x128GPU, 全量增强(jitter+color+pitch_flip+sign_flip), wt=1:3:1"

  - label: "v16-pitch3-signflip"
    dir_name: "test_models2/model_small_5deg_v16_pitch3_signflip"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    use_drcv: 1
    angle_deg: 5
    z_voxels: 10
    version: "v16"
    mode_desc: "L20x8GPU, sign_flip only (无pitch_flip), wt=1:3:1"

  # ============================================================================
  # v20-5° 系列: spconv vs drcv, z5 vs z10, pitch_wt 消融
  # 训练扰动: ±5°, truncated_normal, per_axis_prob=0.3
  # ============================================================================

  - label: "v20-v8recipe-pitch-wt3"
    dir_name: "test_models2/model_small_5deg_v20_v8recipe_pitch_wt3"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    angle_deg: 5
    z_voxels: 5
    version: "v20"
    mode_desc: "spconv, z=5, wt=1:3:1, L20x256GPU, 无增强"

  - label: "v20-v8recipe-z10"
    dir_name: "test_models2/model_small_5deg_v20_v8recipe_z10"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    angle_deg: 5
    z_voxels: 10
    version: "v20"
    mode_desc: "spconv, z=10, wt=1:1:1, L20x256GPU, 无增强"

  - label: "v20-v8recipe-z10-pitch-wt3"
    dir_name: "test_models2/model_small_5deg_v20_v8recipe_z10_pitch_wt3"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    angle_deg: 5
    z_voxels: 10
    version: "v20"
    mode_desc: "spconv, z=10, wt=1:3:1, A30x256GPU, 无增强"

  - label: "v20-v8recipe-z10-5deg-pitch-wt3-no-drcv"
    dir_name: "test_models2/model_small_5deg_v20_v8recipe_z10_5deg_pitch_wt3_no_drcv"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    angle_deg: 5
    z_voxels: 10
    version: "v20"
    mode_desc: "spconv, z=10, wt=1:3:1, L20x256GPU, trunc_normal, 无增强"

  - label: "v20-v8recipe-z5-5deg-no-drcv"
    dir_name: "test_models2/model_small_5deg_v20_v8recipe_z5_5deg_no_drcv"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    angle_deg: 5
    z_voxels: 5
    version: "v20"
    mode_desc: "spconv, z=5, wt=1:1:1, L20x256GPU, trunc_normal, 无增强"

  - label: "v20-v8-z10-drcv"
    dir_name: "test_models2/model_small_5deg_v20_v8_z10_drcv"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    use_drcv: 1
    angle_deg: 5
    z_voxels: 10
    version: "v20"
    mode_desc: "drcv, z=10, L20x128GPU DDP, wt=1:3:1"

  - label: "v20-v8-z10-pitch-wt3-drcv"
    dir_name: "test_models2/model_small_5deg_v20_v8_z10_pitch_wt3_drcv"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    use_drcv: 1
    angle_deg: 5
    z_voxels: 10
    version: "v20"
    mode_desc: "drcv, z=10, wt=1:3:1, L20x256GPU, 无增强"

  - label: "v20-v8-z10-pitch-wt3-drcv-quick"
    dir_name: "test_models2/model_small_5deg_v20_v8_z10_pitch_wt3_drcv_quick"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    use_drcv: 1
    angle_deg: 5
    z_voxels: 10
    version: "v20-quick"
    mode_desc: "drcv, z=10, wt=1:3:1, L20x8GPU quick, 无增强"

  # ============================================================================
  # v20-10° 系列: 大扰动范围训练 (±10°)
  # 注意: 评估仍使用 ±5° 以统一比较
  # ============================================================================

  - label: "v20-10deg-z10-pitch-wt3-no-drcv"
    dir_name: "test_models2/model_small_10.0deg_v20_v8recipe_z10_10deg_pitch_wt3_no_drcv"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "2.0"
    angle_deg: 10
    z_voxels: 10
    version: "v20-10deg"
    mode_desc: "spconv, z=10, ±10°训练, wt=1:3:1, L20x256GPU, trunc_normal"

  - label: "v20-10deg-z5-no-drcv"
    dir_name: "test_models2/model_small_10.0deg_v20_v8recipe_z5_10deg_no_drcv"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    angle_deg: 10
    z_voxels: 5
    version: "v20-10deg"
    mode_desc: "spconv, z=5, ±10°训练, wt=1:1:1, L20x256GPU, trunc_normal"

  # ============================================================================
  # v21 系列: 泛化增强实验 (spconv, z=5, wt=1:3:1)
  # ============================================================================

  - label: "v21-generalize-full"
    dir_name: "test_models2/model_small_5deg_v21_generalize_full"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    angle_deg: 5
    z_voxels: 5
    version: "v21"
    mode_desc: "spconv, z=5, wt=1:3:1, 全量增强(jitter+color+intrinsic+pitch_perturb+sign_flip), L20x256GPU"

  - label: "v21-quick-full"
    dir_name: "test_models2/model_small_5deg_v21_quick_full"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    angle_deg: 5
    z_voxels: 5
    version: "v21-quick"
    mode_desc: "spconv, z=5, wt=1:3:1, 全量增强(jitter+color+intrinsic+pitch_perturb+sign_flip), L20x8GPU quick"

  - label: "v21-quick-no-aug"
    dir_name: "test_models2/model_small_5deg_v21_quick_no_aug"
    ckpt: "ckpt_best_val.pth"
    bev_zbound_step: "4.0"
    angle_deg: 5
    z_voxels: 5
    version: "v21-quick"
    mode_desc: "spconv, z=5, wt=1:3:1, 无增强(v21对照), L20x8GPU quick"

# ============================================================================
# 评估矩阵总结
# ============================================================================
#
# 消融维度:
#   1. Backend:    spconv (8个) vs drcv (5个)
#   2. Z 分辨率:  z=5 (6个) vs z=10 (9个)
#   3. Pitch权重: wt=1:3:1 (12个) vs wt=1:1:1 (3个)
#   4. 扰动范围:  ±5° (13个) vs ±10° (2个)
#   5. 数据增强:  全量(4个) / sign_flip(1个) / 无(10个)
#   6. 训练规模:  256GPU full (11个) / 8GPU quick (4个)
#
# 预期关键对比:
#   - v20-v8recipe-pitch-wt3 vs v20-v8recipe-z10:  z5+pitch_wt vs z10+equal_wt
#   - v20-v8recipe-z10-pitch-wt3 vs v20-v8recipe-z10:  pitch_wt3 效果 (z10下)
#   - v20-v8-z10-pitch-wt3-drcv vs v20-v8recipe-z10-pitch-wt3:  drcv vs spconv (z10+wt)
#   - v20-10deg-* vs v20-*:  大扰动训练的泛化效果
#   - v21-generalize-full vs v21-quick-no-aug:  增强消融 (full aug vs no aug)
#   - v21-quick-full vs v20-v8recipe-pitch-wt3:  v21增强 vs v20最佳(无增强)
