# V46 Ablation Study: isolate contribution of each anti-shortcut component
#
# 4 experiments (S1 only, ±5°), each disabling ONE component:
#   A: Full V46 (all 3 components enabled) — baseline for ablation
#   B: No mag_head (overcorr + mag_balanced only)
#   C: No overcorr_penalty (mag_head + mag_balanced only)
#   D: No mag_balanced (mag_head + overcorr + truncated_normal)
#
# All share the same V45-S1 pretrain checkpoint and hyperparameters.
# Compare GS_medw, zero_drift, genuine_recovery across variants.
#
# Usage:
#   bash batch_train.sh configs/v46_ablation_quick.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10
  max_retries: 1
  retry_delay: 60

defaults:
  env:
    BEV_ZBOUND_STEP: 4.0
    USE_DRCV_BACKEND: 0
    HF_HUB_OFFLINE: 1
    NCCL_IB_TIMEOUT: 50
    NCCL_SOCKET_IFNAME: eth0
    TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
    DDP_TIMEOUT_MINUTES: 180
    NCCL_TIMEOUT: 7200

  params:
    fusion_backend: cf_bev_r
    rotation_only: true

    cf_feat_dim: 256
    cf_n_groups: 128
    cf_knn: 8
    cf_corr_heads: 4
    cf_corr_radius: 4
    cf_num_queries: 6
    cf_encoder_layers: 2
    cf_decoder_layers: 4
    use_rocr: 1
    rocr_dropout: 0.3
    rocr_center_bias: 0.5
    use_pitch_branch: 1

    use_dla: 1
    use_pitch_fusion: 1
    use_instance_norm: 0
    use_gated_instance_norm: 1
    gin_init_gate: 0.5

    backbone_type: swin
    backbone_lr_scale: 0.1
    head_dropout: 0.15

    batch_size: 16
    learning_rate: 1e-4
    use_ddp: true
    ddp_gpus: 8
    nnodes: 1
    ddp_auto_scale: 0
    use_compile: false

    enable_axis_loss: true
    weight_axis_rotation: 0.5
    axis_weights: "1.5,4.0,1.5"
    use_geodesic_loss: 0
    corr_alignment_weight: 0.2
    corr_alignment_warmup: 20
    pitch_aux_weight: 0.4
    quat_norm_weight: 0.5
    seq_consistency_weight: 0.1

    tinit_dropout_prob: 0.3
    continuous_tinit_noise: 1
    continuous_noise_max_deg: 15.0
    consistency_loss_weight: 0.5
    consistency_loss_start_epoch: 10
    symmetric_perturb: 1

    augment_mount_jitter_prob: 0.4
    augment_mount_jitter_rot_sigma: 1.5
    augment_mount_jitter_trans_sigma: 0.015
    augment_intrinsic: 0.03
    augment_intrinsic_cxcy: 0.015
    augment_color_jitter: 0.3

    xyz_only: 1
    max_pcd_points: 16384
    per_axis_prob: 0.4
    pose_aware_sampling: true
    max_frames_per_seq: 10000
    foreground: true
    augment_pc_jitter: 0.0
    augment_pc_dropout: 0.0
    augment_pitch_flip_prob: 0.0

    angle_range_deg: 5
    trans_range: 0.0
    eval_angle_range_deg: 5
    num_epochs: 200
    warmup_epochs: 10
    lr_schedule: cosine_warm_restarts
    cosine_T0: 40
    cosine_Tmult: 2
    early_stopping_patience: 50
    eval_epoches: 10
    rocr_detach_epochs: 999
    seq_consistency_start_epoch: 999

    no_tensorboard: true
    no_amp: 1
    enable_vis: 0
    enable_ckpt_eval: 0
    enable_medw_eval: 1
    enable_jacobian_eval: 1
    jacobian_eval_angle_deg: 3.0
    jacobian_eval_batches: 2
    jacobian_eval_n_probes: 3
    medw_eval_max_frames: 200
    enable_dual_gate_ckpt: 1
    dual_gate_jacobian_min: 0.85
    dual_gate_medw_max: 0.10
    save_ckpt_per_epoches: 10

    seed: 42
    pretrain_ckpt: "logs/all_training_data/model_small_5deg_v45_gin_cf_bev_r_S1_full/all_training_data_scratch/checkpoint/ckpt_best_dual.pth"
    resume_ckpt: auto

experiments:
  # A: Full V46 — all 3 components (reference)
  - name: "v46_ablation_full"
    description: "Ablation A: mag_balanced + overcorr + mag_head (full V46)"
    dataset: "all"
    version: "v46_ablation_full"
    params:
      perturb_distribution: magnitude_balanced
      zero_perturbation_prob: 0.25
      overcorrection_penalty: 2.0
      use_magnitude_head: 1
      magnitude_loss_weight: 0.3

  # B: No magnitude head (data + loss only)
  - name: "v46_ablation_no_maghead"
    description: "Ablation B: mag_balanced + overcorr, NO mag_head"
    dataset: "all"
    version: "v46_ablation_no_maghead"
    params:
      perturb_distribution: magnitude_balanced
      zero_perturbation_prob: 0.25
      overcorrection_penalty: 2.0
      use_magnitude_head: 0
      magnitude_loss_weight: 0.0

  # C: No overcorrection penalty (architecture + data only)
  - name: "v46_ablation_no_overcorr"
    description: "Ablation C: mag_balanced + mag_head, NO overcorr_penalty"
    dataset: "all"
    version: "v46_ablation_no_overcorr"
    params:
      perturb_distribution: magnitude_balanced
      zero_perturbation_prob: 0.25
      overcorrection_penalty: 0.0
      use_magnitude_head: 1
      magnitude_loss_weight: 0.3

  # D: No magnitude_balanced (architecture + loss only, truncated_normal)
  - name: "v46_ablation_no_magbalanced"
    description: "Ablation D: overcorr + mag_head, truncated_normal (no mag_balanced)"
    dataset: "all"
    version: "v46_ablation_no_magbalanced"
    params:
      perturb_distribution: truncated_normal
      zero_perturbation_prob: 0.25
      overcorrection_penalty: 2.0
      use_magnitude_head: 1
      magnitude_loss_weight: 0.3
