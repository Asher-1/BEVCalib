# BEVCalib V18 全量训练配置 — 16节点 A30 版 (bs=8)
#
# V18 设计哲学:
#   Pitch 泛化突破。基于 V16+V17 共 11 个模型的评估分析:
#   - Seq 00/02 Pitch 误差 ~0.8° 是全局瓶颈
#   - v16-sign-flip 是当前冠军 (0.458°)
#   - V18 以 sign-flip 强化 + Pitch loss 聚焦为核心策略
#
# Baseline 参照:
#   - v16-sign-flip (Quick):  整体 0.458°, Seq02 1.003°
#   - v17-angle8-weak (Quick): 整体 0.491°, Seq02 1.099°
#   - v17-weak-pitch3 (Quick): 整体 0.492°, Seq02 0.975°
#
# 用法:
#   bash batch_train.sh configs/batch8_train_all_v18_a30.yaml

global:
  dry_run: false
  batch_log_dir: "logs"
  wait_between_experiments: 10

defaults:
  env:
    BEV_ZBOUND_STEP: 2.0
    USE_DRCV_BACKEND: 1
    HF_HUB_OFFLINE: 1

  params:
    # === 扰动范围 ===
    angle_range_deg: 5
    trans_range: 0.15

    # === 训练基础配置 ===
    batch_size: 8
    learning_rate: 1e-4

    # === 分布式训练 (DDP) ===
    use_ddp: true
    ddp_gpus: 8
    nnodes: 32
    node_rank: null
    master_addr: null
    master_port: null
    ddp_auto_scale: 1
    ddp_reference_gpus: 16              # 16GPU×bs8=128 等效云版 8GPU×bs16=128, 保证 √缩放一致
    max_scaled_lr: 4e-4             # LR上限: V16消融验证最优区间 2e-4~4e-4

    # === 模型配置 ===
    use_compile: false
    rotation_only: true

    # === 损失函数 ===
    enable_axis_loss: true
    weight_axis_rotation: 0.5

    # === 回归头 & 损失类型 ===
    use_mlp_head: 0
    use_geodesic_loss: 0

    # === 正则化 ===
    drop_path_rate: 0.1
    head_dropout: 0.1

    # === 训练扰动策略 ===
    perturb_distribution: truncated_normal
    per_axis_prob: 0.3
    per_axis_weights: null

    # === 学习率调度 ===
    lr_schedule: cosine_warm_restarts
    cosine_T0: 50
    cosine_Tmult: 2
    warmup_epochs: 10
    backbone_lr_scale: 0.1

    # === 数据增强 (V18: 强化 sign-flip + Pitch 聚焦) ===
    augment_pc_jitter: 0.02
    augment_pc_dropout: 0.0
    augment_color_jitter: 0.1
    augment_pitch_flip_prob: 0.0
    augment_pitch_flip_max_deg: 2.0
    augment_pitch_sign_flip_prob: 0.20

    # === 数据采样 ===
    sample_step: 4

    # === 训练控制 ===
    early_stopping_patience: 30
    seed: 42

    # === DrInfer 兼容配置 ===
    voxel_mode: "scatter"
    scatter_reduce: "mean"
    to_bev_mode: "concat"

    # === 运行模式 ===
    foreground: true
    no_tensorboard: true
    tensorboard_port: null

experiments:
  # =========================================================================
  # V18 全量训练 (A30 16节点版): Pitch 泛化突破
  # =========================================================================

  # A. sign-flip 强化 + Pitch 聚焦 (★首选)
  - name: "v18_signflip_pitch_focus"
    description: "V18-A: sign_flip(0.20) + Pitch2.0 (首选)"
    dataset: "all"
    version: "v18_signflip_pitch_focus"
    params:
      axis_weights: "1.0,2.0,1.0"

  # B. 大角度 + Pitch 强化
  - name: "v18_angle8_pitch"
    description: "V18-B: 8deg + sign_flip(0.20) + Pitch2.5"
    dataset: "all"
    version: "v18_angle8_pitch"
    params:
      angle_range_deg: 8
      axis_weights: "1.0,2.5,1.0"

  # C. 混合增强 + 高 per-axis 扰动
  - name: "v18_hybrid_aug"
    description: "V18-C: sign_flip(0.20) + perturb(0.15,2.5°) + per_axis(0.5)"
    dataset: "all"
    version: "v18_hybrid_aug"
    params:
      augment_pitch_flip_prob: 0.15
      augment_pitch_flip_max_deg: 2.5
      per_axis_prob: 0.5
      axis_weights: "1.0,2.0,1.0"

  # D. StepLR + sign-flip + Pitch (调度器消融)
  - name: "v18_step_signflip_pitch"
    description: "V18-D: StepLR + sign_flip(0.20) + Pitch2.0"
    dataset: "all"
    version: "v18_step_signflip_pitch"
    params:
      lr_schedule: step
      warmup_epochs: 5
      axis_weights: "1.0,2.0,1.0"

# ============================================================================
# V18 全量训练矩阵 (4组, A30 16节点 x 8GPU, bs=8, 全部 DRCV)
# ============================================================================
#
#   实验                       | LR调度 | sign_flip | Pitch loss | angle | Backend  | Z  | 目标
#   ---------------------------+--------+-----------+------------+-------+----------+----+-------------------
#   A signflip_pitch_focus     | Cosine | 0.20      | 2.0x       | 5°    | DRCV     | 10 | DRCV+Pitch聚焦
#   B angle8_pitch             | Cosine | 0.20      | 2.5x       | 8°    | DRCV     | 10 | 大角度+强Pitch
#   C hybrid_aug               | Cosine | 0.20      | 2.0x       | 5°    | DRCV     | 10 | 混合增强上限
#   D step_signflip_pitch      | Step   | 0.20      | 2.0x       | 5°    | DRCV     | 10 | 调度器对照
#
# 全局等效 batch size: 8 * 8GPU * 16node = 1024
# sample_step=4: 130K→33K帧, 每epoch约32步
